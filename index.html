<!DOCTYPE html>

<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#151311" name="theme-color"/>
<meta content="Companion app for the West of Westeros board game." name="description"/>
<style>
:root {
  --bg:#0f0e0d;
  --panel:#191715;
  --panel2:#211e1a;
  --line:#3a342d;
  --text:#f0eadf;
  --muted:#aaa094;
  --accent:#b99a63;
  --accent2:#d8c39a;
  --danger:#ba6a62;
  --good:#7da884;
  --shadow:0 14px 40px rgba(0,0,0,.34);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at top,#1d1915 0,#0f0e0d 44%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-shell{max-width:760px;margin:0 auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 16px 12px;background:linear-gradient(180deg,rgba(15,14,13,.98),rgba(15,14,13,.86),rgba(15,14,13,0));backdrop-filter:blur(8px)}
.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--accent);font-weight:800}
h1{font-family:Georgia,"Times New Roman",serif;font-size:29px;margin:2px 0 0;letter-spacing:.01em}
h2,h3{font-family:Georgia,"Times New Roman",serif}
.view{padding:6px 14px 24px}
.bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(18,16,14,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{width:min(20%,152px);min-height:66px;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;font-size:18px}
.nav-btn b{font-size:11px;font-weight:700}
.nav-btn.active{color:var(--accent2)}
.nav-icon{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn b{letter-spacing:.015em}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.hero{padding:18px}
.hero-row,.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;background:#2a251f;border:1px solid #413a31;color:var(--accent2);font-size:12px}
.pill.good{color:#c7e2cb;border-color:#3d5f44;background:#1c2a1f}
.pill.warn{color:#ead5a8;border-color:#6a5734;background:#302718}
.pill.bad{color:#efc4c0;border-color:#6d3c38;background:#321c1a}
.progress{height:8px;border-radius:99px;background:#302b26;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#8b7146,#d1b77f)}
.grid{display:grid;gap:10px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 8px}
.section-title h2{font-size:20px;margin:0}
.section-title p{margin:0;font-size:12px;color:var(--muted)}
.stat{background:#151311;border:1px solid #332e28;border-radius:13px;padding:10px;text-align:center;min-width:0}
.stat label{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat strong{display:block;font-family:Georgia,serif;font-size:25px;margin-top:3px}
.resource{padding:12px;background:#151311;border:1px solid #332e28;border-radius:13px}
.resource .name{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.resource input{width:100%;font-size:22px;font-family:Georgia,serif;color:var(--text);background:transparent;border:0;padding:5px 0 8px;outline:none}
.quick{display:flex;gap:6px}
button,.btn{border:1px solid #554a3d;background:#2a241d;color:var(--text);padding:9px 12px;border-radius:10px;font-weight:700}
button:hover{border-color:#8e795a}
button.primary{background:#8f764c;color:#100f0d;border-color:#b3996c}
button.danger{background:#4a2522;border-color:#78433e;color:#f5d8d4}
button.ghost{background:transparent;border-color:#413a31;color:var(--accent2)}
button.small{padding:6px 9px;font-size:11px}
button.icon-btn{border:0;background:transparent;color:var(--muted);font-size:28px;padding:0 4px}
.hidden{display:none!important}
input,select,textarea{width:100%;background:#11100f;color:var(--text);border:1px solid #443c33;border-radius:10px;padding:10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#a48a5f}
label.field{display:block;margin:10px 0}
label.field span{display:block;color:var(--muted);font-size:11px;margin:0 0 5px}
.item-card{position:relative;overflow:hidden}
.item-card.completed{border-color:#536c55}
.item-card .badge{position:absolute;right:10px;top:10px}
.item-card h3{margin:0 70px 4px 0;font-size:18px}
.item-card p{margin:6px 0;color:var(--muted);font-size:12px;line-height:1.45}
.item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.face-card h3{margin:0;font-size:17px}
.face-attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.face-attrs div{background:#11100f;border-radius:8px;text-align:center;padding:6px 2px;font-size:10px;color:var(--muted)}
.face-attrs strong{display:block;color:var(--text);font-size:16px}
.tool-grid{display:grid;gap:10px}
.tool-card h3{margin:0 0 6px;font-size:18px}
.tool-card p{font-size:12px;color:var(--muted);margin:0 0 10px}
.result{background:#11100f;border:1px solid #332e28;border-radius:12px;padding:12px;margin-top:10px}
.result strong{font-size:22px;font-family:Georgia,serif;color:var(--accent2)}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.tabs button{white-space:nowrap}
.tabs button.active{background:#8f764c;color:#111;border-color:#b99a63}
.search{position:sticky;top:70px;z-index:8;background:#0f0e0d;padding:7px 0 10px}
.search input{font-size:16px}
.rule-result{padding:12px 0;border-bottom:1px solid #302b26}
.rule-result h3{font-size:15px;margin:0 0 5px;color:var(--accent2)}
.rule-result p{font-size:12px;line-height:1.5;color:#ddd4c8;margin:0;white-space:pre-wrap}
.ability-row{padding:11px 0;border-bottom:1px solid #302b26}
.ability-row h3{font-size:15px;margin:0 0 4px}
.ability-row p{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
.ability-row-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ability-row-head h3{margin:0}
.ability-characters-btn{width:34px;height:34px;min-width:34px;border-radius:999px;padding:0;display:grid;place-items:center;color:var(--muted);background:#211e1a;border:1px solid #3c352e}
.ability-characters-btn:hover,.ability-characters-btn:focus{color:var(--text);border-color:#6d5e4d}
.ability-characters-btn svg{width:18px;height:18px;display:block}
.ability-character-list{display:grid;gap:8px;margin-top:12px}
.ability-character-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #302b26;border-radius:12px;background:#13110f}
.ability-character-row .visual-thumb{flex:0 0 auto}
.ability-character-row .meta{min-width:0}
.ability-character-row .meta strong{display:block;font-size:14px}
.ability-character-row .meta span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.suspicion-badge{display:inline-flex;align-items:center;gap:6px}
.confront-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.confront-summary>div{padding:10px;border-radius:12px;background:#13110f;border:1px solid #302b26;text-align:center}
.confront-summary span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.confront-summary strong{display:block;margin-top:3px;font-size:13px}
.confront-options{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.confront-options span{font-size:11px;border:1px solid #3b342d;border-radius:999px;padding:6px 9px;color:var(--muted)}
@media(max-width:430px){.confront-summary{grid-template-columns:1fr 1fr 1fr;gap:6px}.confront-summary>div{padding:8px 4px}.confront-summary strong{font-size:12px}}
.market-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.market-table th,.market-table td{border:1px solid #3c352e;padding:7px;text-align:center}
.market-table th{color:var(--accent2);background:#151311}
.status-row{display:flex;gap:8px;flex-wrap:wrap}
.status-toggle.active{border-color:#a78351;background:#342b20;color:#f0dfbd}
.modal{border:0;background:transparent;padding:14px;width:min(620px,100%);max-width:none;color:var(--text)}
.modal::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.modal-card{background:#171512;border:1px solid #4b4238;border-radius:18px;padding:16px;box-shadow:var(--shadow);max-height:88vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-head h2{margin:0;font-size:22px}
.notice{border-left:3px solid #a4814d;padding:9px 11px;background:#211b14;border-radius:4px 10px 10px 4px;color:#dbc7a4;font-size:12px;line-height:1.45}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}
hr{border:0;border-top:1px solid #302b26;margin:14px 0}
pre.rules-full{white-space:pre-wrap;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d9d0c5}
@media(min-width:620px){.view{padding-left:20px;padding-right:20px}.tool-grid{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:repeat(4,1fr)}}
@media(max-width:420px){.grid-5{grid-template-columns:repeat(5,minmax(50px,1fr));gap:6px}.stat{padding:8px 3px}.stat label{font-size:9px}.stat strong{font-size:21px}.card{padding:12px}.resource input{font-size:20px}}

/* v0.2 mobile interaction improvements */
html{min-height:100%;overflow-y:auto;scroll-padding-bottom:120px}
body{min-height:100dvh;overflow-x:hidden;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.app-shell{min-height:100dvh}
.view{padding-bottom:calc(130px + env(safe-area-inset-bottom))}
.bottom-nav{min-height:68px}
.resource-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.resource-quick button{min-height:42px;padding:8px 6px;font-size:12px}
.segmented{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.segmented button{min-height:42px}
.segmented button.active{background:#8f764c;color:#111;border-color:#b99a63}
.bounty-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.counter-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.counter-stack{display:grid;gap:10px;margin:12px 0}
.stepper{display:grid;grid-template-columns:minmax(52px,auto) minmax(54px,auto) minmax(52px,auto);align-items:center;gap:7px}
.stepper button{min-height:44px;min-width:52px;padding:8px 10px;font-size:15px}
.stepper strong{text-align:center;font-family:Georgia,serif;font-size:21px;white-space:nowrap}
.big-actions button{min-height:48px}
.bond-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}
.bond-btn{min-height:46px;text-align:left;font-size:12px}
.bond-btn.active{background:#273329;border-color:#55705a;color:#d6ead9}
.compact-field{max-width:360px}
.wide-action{width:100%;margin-top:4px;min-height:46px}
button:disabled{opacity:.45;cursor:not-allowed}
.good-text{color:#b9d8bf}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translate(-50%,18px);width:min(calc(100% - 28px),620px);padding:12px 14px;border-radius:12px;background:#24201b;border:1px solid #4b4238;color:var(--text);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;text-align:center;font-size:13px;font-weight:700}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{border-color:#4b7252;background:#1d2b20}
.toast.warn{border-color:#7a6138;background:#302718}
.toast.bad{border-color:#78433e;background:#3a211e}
.toast.neutral{border-color:#554a3d;background:#24201b}
@media(max-width:520px){
  .bounty-fields{grid-template-columns:1fr}
  .resources-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .resource{padding:10px}
  .resource-quick button{font-size:11px;min-height:44px}
  .bond-grid{grid-template-columns:1fr 1fr}
}

/* v0.3 interaction and mobile fixes */
html,body{height:auto!important;min-height:100%!important;overflow-y:auto!important;overscroll-behavior-y:auto}
body{padding-bottom:calc(118px + env(safe-area-inset-bottom))!important}
.app-shell{min-height:100dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.view{padding-bottom:calc(160px + env(safe-area-inset-bottom))!important;min-height:calc(100dvh - 80px)}
.bottom-nav{padding-bottom:max(env(safe-area-inset-bottom),6px);touch-action:manipulation}
.nav-btn,button{touch-action:manipulation;-webkit-tap-highlight-color:rgba(185,154,99,.18)}

.title-with-help,.tool-head,.item-head{display:flex;align-items:center;gap:8px}
.tool-head,.item-head{justify-content:space-between;align-items:flex-start}
.tool-head>div,.item-head>div{min-width:0;flex:1}
.help-btn{width:30px;height:30px;min-width:30px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--accent2);border:1px solid #5b5042;font-family:Georgia,serif;font-size:16px}
.help-btn:hover{background:#2a241d}
.inline-edit{margin-top:8px;justify-content:flex-end}

.resource{padding:12px}
.resource .name{text-align:center;margin-bottom:8px}
.resource-line{display:grid;grid-template-columns:minmax(54px,.8fr) minmax(90px,1.25fr) minmax(54px,.8fr);gap:7px;align-items:center}
.resource-side{display:grid;gap:6px}
.resource-side button{min-height:40px;padding:7px 5px;font-size:12px}
.resource input{font-size:24px;text-align:center;border:1px solid #40382f;border-radius:10px;padding:12px 4px;background:#11100f;font-family:Georgia,serif;min-width:0}

.benefit-list{display:grid;gap:8px}
.benefit-row{display:grid;gap:2px;padding:9px 0;border-bottom:1px solid #302b26}
.benefit-row:last-child{border-bottom:0}
.benefit-row strong{color:var(--accent2);font-size:13px}
.benefit-row span{color:var(--muted);font-size:12px;line-height:1.45}

.item-card .badge{top:12px;right:52px}
.item-head h3{margin:0 120px 4px 0}
.item-head p{margin:5px 0 0}
.cost-box{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#11100f;border:1px solid #332e28;border-radius:10px;padding:10px 12px;margin:10px 0}
.cost-box span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cost-box strong{font-size:13px;text-align:right}
.quest-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.quest-steps button{min-height:48px}

.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px 12px;color:var(--text)}
.modal.hidden{display:none!important}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.74)}
.modal-card{position:relative;width:min(620px,100%);max-height:min(86dvh,760px);overflow-y:auto;background:#171512;border:1px solid #4b4238;border-radius:18px;padding:16px;box-shadow:var(--shadow);z-index:1;-webkit-overflow-scrolling:touch}
body.modal-open{overflow:hidden!important}
.help-copy{font-size:14px;line-height:1.6;color:#ddd4c8;margin:8px 0 16px}

.action-feedback{margin-top:10px;padding:9px 10px;border-radius:9px;background:#151311;border:1px solid #332e28;color:var(--muted);font-size:12px;line-height:1.4}
.action-feedback.good{border-color:#3d5f44;color:#c7e2cb;background:#1c2a1f}
.action-feedback.warn{border-color:#6a5734;color:#ead5a8;background:#302718}
.action-feedback.bad{border-color:#6d3c38;color:#efc4c0;background:#321c1a}

.toc-list{display:grid;margin-top:10px}
.toc-row{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:transparent;border:0;border-bottom:1px solid #302b26;border-radius:0;padding:12px 2px;color:var(--text)}
.toc-row span{min-width:0}
.toc-row strong{display:inline-block;min-width:34px;color:var(--accent2)}
.toc-row small{color:var(--muted);white-space:nowrap}
.rules-toolbar{margin:0 0 8px}
.rule-section{box-shadow:none}
.rule-section-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #302b26;padding-bottom:10px;margin-bottom:10px}
.rule-section-head h3{display:inline;margin:0 0 0 8px;font-size:19px}
.rule-body{font-size:13px;line-height:1.6;color:#ddd4c8}
.rule-body p{margin:0 0 12px}
.rule-body h4{font-size:14px;color:var(--accent2);margin:14px 0 5px;font-family:Georgia,serif}
.rule-body ul{margin:8px 0 14px;padding-left:22px}
.rule-body li{margin:4px 0}
.rule-data-line{font-size:12px;background:#11100f;border-radius:7px;padding:6px 8px;margin:4px 0}
.error-box{white-space:pre-wrap;overflow:auto;background:#11100f;padding:10px;border-radius:8px;color:#efc4c0}

@media(max-width:520px){
  .grid-2.resources-grid{grid-template-columns:1fr}
  .resource-line{grid-template-columns:minmax(62px,.8fr) minmax(108px,1.25fr) minmax(62px,.8fr)}
  .resource-side button{min-height:44px;font-size:13px}
  .resource input{font-size:26px;min-height:94px}
  .bounty-fields{grid-template-columns:1fr}
  .quest-steps{grid-template-columns:1fr}
  .item-card .badge{position:static;margin:8px 0 4px}
  .item-head h3{margin-right:0}
  .modal{align-items:center;padding:12px 8px}
  .modal-card{max-height:82dvh;border-radius:18px}
}
.section-title{flex-wrap:wrap;align-items:center}
.section-title>p{margin-left:auto;max-width:62%;text-align:right;line-height:1.3}
@media(max-width:520px){
  .section-title>p{flex-basis:100%;max-width:none;text-align:left;margin:4px 0 0}
}

/* v0.4 card-library and held-card refinements */
.resource-line input{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.01em}
.held-card-list{display:grid;gap:8px;margin:10px 0 12px}
.held-card-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border:1px solid #342f29;background:#131210;border-radius:11px}
.held-card-row>div{display:grid;gap:2px;min-width:0}
.held-card-row strong{font-size:13px;color:var(--accent2)}
.held-card-row span{font-size:11px;line-height:1.4;color:var(--muted)}
.weirwood-add{align-items:stretch}
.weirwood-add select{flex:1;min-width:0}
.weirwood-add button{min-width:72px}
.compact-empty{padding:10px;margin:8px 0 12px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal-actions button{min-width:110px}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#11100f;border:1px solid #3b352e;border-radius:11px;margin:12px 0}
.check-row input{width:auto;margin-top:3px;transform:scale(1.15)}
.check-row span{display:grid;gap:2px}
.check-row small{color:var(--muted);line-height:1.35}
.face-picker-preview{padding:12px;background:#11100f;border:1px solid #342f29;border-radius:11px;margin:8px 0 12px}
.face-picker-preview .face-attrs{margin-top:10px}
.warn-text{color:#e0bd7f}
.bounty-card select{min-height:43px}
@media(max-width:520px){
  .resource-line{grid-template-columns:72px minmax(120px,1fr) 72px}
  .resource-side button{min-height:48px}
  .resource input{min-height:102px;font-size:29px;padding:10px 3px}
  .held-card-row{align-items:flex-start}
  .held-card-row button{min-height:44px;min-width:64px}
  .weirwood-add{display:grid;grid-template-columns:1fr 72px;width:100%}
  .modal-actions{display:grid;grid-template-columns:1fr 1fr}
  .modal-actions button{min-width:0;min-height:46px}
}

  

/* v0.5 phone-first controls */
.resources-list{display:grid;gap:9px}
.resource{padding:10px 11px}
.resource .name{text-align:left;margin:0 0 7px;font-size:12px}
.resource-one-line{display:grid;grid-template-columns:52px 52px minmax(82px,1fr) 52px 52px;gap:5px;align-items:center}
.resource-one-line button{min-height:46px;padding:6px 3px;font-size:12px}
.resource-one-line input{min-width:0;min-height:46px;text-align:center;font-size:22px;border:1px solid #40382f;border-radius:10px;background:#11100f;padding:6px 3px;font-weight:700;font-variant-numeric:tabular-nums}
.choice-grid{display:grid;gap:7px;margin:7px 0 11px;grid-template-columns:repeat(2,minmax(0,1fr))}
.choice-grid.two-choice{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice-grid.resource-choice{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice-grid.attr-choice{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice-grid.six-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice-btn{min-height:43px;padding:8px 7px;font-size:12px;text-align:center}
.choice-btn.active{background:#8f764c;color:#111;border-color:#b99a63}
.bounty-locations{grid-template-columns:repeat(2,minmax(0,1fr))}
.bounty-assistant{margin-top:12px;border-top:1px solid #302b26;padding-top:10px}
.bounty-assistant summary{cursor:pointer;color:var(--accent2);font-weight:800;padding:7px 0;list-style:none}
.bounty-assistant summary::-webkit-details-marker{display:none}
.bounty-assistant summary:after{content:'＋';float:right;color:var(--muted)}
.bounty-assistant[open] summary:after{content:'−'}
.assistant-body{display:grid;gap:11px;padding-top:8px}
.sub-block{padding:9px;border:1px solid #332e28;border-radius:10px;background:#151311}
.compact-notice{margin-top:7px;padding:7px 9px}
.outcome-grid{grid-template-columns:1fr 1fr}
.bounty-outcomes{border-top:1px solid #302b26;padding-top:10px}
.cooldown-box{display:grid;gap:10px}
.cooldown-box>div:first-child{display:grid;gap:2px}
.cooldown-actions{grid-template-columns:repeat(2,minmax(0,1fr));margin:0}
.item-group{margin:22px 0 6px}
.item-group>h2{font-size:18px;margin:0 2px 8px;color:var(--accent2)}
.item-group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item-group-grid .card{margin:0;min-width:0}
.gemstone-types{grid-template-columns:repeat(3,minmax(0,1fr))}
.market-pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.weirwood-choice{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:620px){
  .item-group-grid{grid-template-columns:1fr}
  .market-pickers{grid-template-columns:1fr 1fr}
}
@media(max-width:390px){
  .resource-one-line{grid-template-columns:47px 47px minmax(70px,1fr) 47px 47px;gap:4px}
  .resource-one-line button{font-size:11px;padding:5px 2px}
  .resource-one-line input{font-size:20px}
  .market-pickers{grid-template-columns:1fr}
  .gemstone-types{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:520px){.resource-one-line input{min-height:46px!important;height:46px!important;font-size:21px!important}.resource-one-line button{min-height:46px!important}.resources-list{grid-template-columns:1fr!important}}

/* v0.6 workflow, history and compact spacing */
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))!important}
.view{padding-bottom:24px!important;min-height:0!important}
.app-shell{padding-bottom:0!important}
.top-actions{display:flex;gap:7px;align-items:center}
.setup-card{border-color:#765f3d;background:linear-gradient(180deg,#2c251b,#191715)}
.setup-card h2{margin:0 0 5px}
.attr-adjust-list{display:grid;gap:8px;margin:12px 0}
.attr-adjust-row{display:grid;grid-template-columns:minmax(100px,1fr) 44px 58px 44px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #302b26}
.attr-adjust-row:last-child{border-bottom:0}
.attr-adjust-row button{min-height:42px;padding:6px}
.attr-adjust-row strong{text-align:center;font-family:Georgia,serif;font-size:21px}
.start-attr-row{display:grid;grid-template-columns:minmax(100px,1fr) 48px 58px 48px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #302b26}
.start-attr-row button{min-height:44px;padding:7px}
.start-attr-row strong{text-align:center;font-family:Georgia,serif;font-size:22px}
.start-total{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:#11100f;border:1px solid #3b352e;border-radius:11px;margin:12px 0}
.pill-help{border:0;background:transparent;padding:0 0 0 4px;color:inherit;font-weight:900;min-width:18px;cursor:pointer}
.history-list{display:grid;gap:0;margin-top:8px}
.history-row{padding:11px 2px;border-bottom:1px solid #302b26}
.history-row time{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}
.history-row div{font-size:12px;line-height:1.45}
.market-flow{display:grid;grid-template-columns:1fr 38px 1fr;gap:8px;align-items:stretch;margin:10px 0 12px}
.market-side{border:1px solid #40382f;border-radius:13px;background:#11100f;padding:10px}
.market-side-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.market-step{display:inline-flex;width:23px;height:23px;border-radius:50%;align-items:center;justify-content:center;background:#8f764c;color:#111;font-size:11px;font-weight:900}
.market-side-head strong{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2)}
.market-arrow{display:flex;align-items:center;justify-content:center;color:var(--accent2);font-size:24px;font-weight:900}
.resource-payout-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.resource-payout-grid button{min-height:50px;text-align:left}
.resource-payout-grid button small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
.locked-choice{margin-top:10px;padding:11px 12px;border:1px solid #536c55;background:#172019;border-radius:11px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.locked-choice span{color:var(--muted);font-size:11px}
.locked-choice strong{color:#c7e2cb}
.memory-assistant{margin-top:10px;padding-top:10px;border-top:1px solid #302b26}
.memory-checklist{display:grid;gap:6px;margin:10px 0}
.memory-word-btn{width:100%;text-align:left;display:block;padding:10px 11px;background:#171512;border:1px solid #40382f;border-radius:9px;color:var(--text);font-weight:700}
.memory-word-btn.checked{background:#252321;border-color:#35312c;color:#77716a;opacity:.58}
.market-amount-line{display:grid;grid-template-columns:52px 52px minmax(82px,1fr) 52px 52px;gap:5px;align-items:center;margin:9px 0}
.market-amount-line button{min-height:46px;padding:6px 3px;font-size:12px}
.market-amount-line input{min-width:0;min-height:46px;text-align:center;font-size:20px;border:1px solid #40382f;border-radius:10px;background:#11100f;color:var(--text);padding:6px 3px;font-weight:700;font-variant-numeric:tabular-nums}
.rule-section-head .tiny{margin-left:9px}
button.choice-locked{opacity:.45}
.timer-box{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#11100f;border:1px solid #342f29;border-radius:11px;padding:10px 11px;margin:10px 0}
.timer-display{font-family:Georgia,serif;font-size:28px;color:var(--accent2);font-variant-numeric:tabular-nums}
.visual-thumb{display:block;width:64px;height:54px;object-fit:cover;border-radius:9px;border:1px solid #40382f;background:#0d0c0b;flex:0 0 auto}
.visual-thumb.large{width:92px;height:72px}
.face-card-head{display:flex;gap:11px;align-items:flex-start;min-width:0}
.face-card-head>div:last-child{min-width:0}
.face-picker-visual{display:flex;gap:11px;align-items:flex-start;margin:9px 0}
.bounty-target-preview{display:flex;gap:11px;align-items:center;margin:9px 0;padding:9px;border:1px solid #3a342d;border-radius:11px;background:#11100f}
.bounty-target-preview .meta{min-width:0}
.attr-icon{display:block;width:29px;height:29px;object-fit:cover;border-radius:50%;margin:0 auto 4px;border:1px solid #4c4237}
.resource-name-wrap{display:flex;gap:8px;align-items:center;min-width:0}
.resource-icon{width:32px;height:32px;object-fit:cover;border-radius:7px;border:1px solid #40382f;background:#0d0c0b}
.location-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.location-choice-grid button{display:flex;align-items:center;gap:8px;text-align:left;padding:6px 8px;min-height:58px}
.location-choice-grid img{width:42px;height:50px;object-fit:cover;border-radius:6px;border:1px solid #40382f;flex:0 0 auto}
.location-choice-grid span{line-height:1.15}
.visual-pack-box{border:1px dashed #5b4f40;border-radius:12px;padding:11px;background:#11100f}
.visual-pack-box strong{display:block;margin-bottom:3px}
.stat .attr-icon{margin-bottom:5px}
@media(max-width:380px){
  .location-choice-grid{grid-template-columns:1fr}
  .visual-thumb.large{width:76px;height:62px}
}
@media(max-width:520px){
  .market-flow{grid-template-columns:1fr}
  .market-arrow{height:24px;transform:rotate(90deg)}
  .attr-adjust-row,.start-attr-row{grid-template-columns:minmax(95px,1fr) 46px 54px 46px}
  .market-amount-line{grid-template-columns:47px 47px minmax(70px,1fr) 47px 47px;gap:4px}
  .market-amount-line button{font-size:11px;padding:5px 2px}
}

/* v0.10 character portraits only; non-character visual assets removed */
.tool-category{margin-top:18px}
.tool-category-title{display:flex;align-items:center;gap:9px;margin:0 0 8px;padding:0 2px}
.tool-category-title h2{font-size:17px;margin:0}
.tool-category-title span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.raid-area-grid{display:grid;grid-template-columns:1fr;gap:7px;margin:8px 0}
.raid-area-btn{text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 11px}
.raid-area-btn small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.raid-area-btn.visited{opacity:.48;text-decoration:line-through}
.raid-area-btn.current{outline:1px solid var(--accent)}
.raid-haul{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0;padding:11px;border:1px solid var(--line);border-radius:12px;background:#171411}
.raid-haul strong{font-size:22px}
.raid-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.raid-actions .leave{grid-column:1/-1}
.war-declared{border-color:#7b6842;background:#211d15}
@media(min-width:620px){.raid-area-grid{grid-template-columns:1fr 1fr}}

<script>
window.WOW_DATA = {
  "rulesText": "The Rules & Playing the Game:\n\n\n    1. Setting Up:\n\n    Each player begins the game with 15 attribute points, which they can divide as they wish between\n    their 5 attributes: Magic, Intelligence, Combat, Stealth, and Cunning. Enter your chosen starting\n    attributes into the companion app. The app will track any changes to your attributes throughout\n    the game.\n\n    Each player also begins the game with the following resources: 5,000 gold, 2,000 wood, 2,000\n    stone, and 2,000 food. These resources are tracked using the companion app, which should be\n    updated whenever resources are gained, spent, stolen, lost or traded.\n\n\n    There are several opaque red cubes that can be positioned around the inner section of the board.\n    Each cube represents a ‘resource drop’, where an amount of resources have been abandoned.\n    Players can decide how many of these cubes they would like to use for the game. Once decided,\n    each player takes a portion of these cubes and positions them however they choose over the various\n    resource tiles on the map. The resource tile that the cubes are placed on determines which resource\n    it will contain. The tile icons and their associated resources are shown below. More information on\n    resource drops is given in section 4.7.\n\n\n           Gold:                 Wood:                  Stone:               Food:       &\n\n\n    To begin play, each player places their token on the Little Birds space nearest to them.\n\n\n    2. Starting the Game:\n\n    The youngest player takes the first turn, and play is passed clockwise. You start by immediately\n    receiving your first bounty, as explained in section 3.1. Once you have your bounty you can begin\n    moving towards your bounty’s location. Before rolling, you must choose to roll either one or two 6-\n    sided dice and in which direction you would like to travel, clockwise or anticlockwise. If you\n    choose to roll two dice, you must move the number of spaces that you roll, in the direction\n    that you stated before rolling.\n\n    However, if you have rolled one die instead, you may move any number of spaces up to and\n    including the number you rolled, unless the number you rolled would land you on a\n    detrimental space. Detrimental spaces are indicated by a red banner at the top of a space. These\n    include: ‘Foe spaces’, Brotherhood Without Banners, Iron Bank Tax, and Captured spaces. Any\n\n\n    number of players can land on the same space, and players can move past each other in either\n    direction.\n\n\n    3. Navigating the Outer Section:\n\n    3.1.   Little Birds:\n\n    Landing on this space initiates a meeting with your spies, or ‘Little Birds’. They will provide you\n    with a target that you may either attempt to assassinate or blackmail, and the location that they\n    were last sighted. You must first choose your target, then their location will be revealed.\n\n    Assassinating your target will mean that you gain their face, and any associated attribute points\n    that the character holds will be added to your total. Blackmailing a target will allow you to gain\n    resources from them, but allows them to walk free. Before assassinating or blackmailing your\n    target, you will need to perform a ‘take down’ on your target by rolling a higher number than them\n    on the 20-sided die, hereon referred to as the take down roll. Whilst you are ‘choosing a target’\n    and ‘finding your target’ (see below), the next player can start their turn.\n\n    Choosing a target:\n    There are two tiers of character that you can attempt to take down: high tier characters and low tier\n    characters. They differ in that high tier characters have more attribute points than low tier\n    characters. However, to attempt a take down on a high tier character, all of your attribute levels\n    must already be above level 10.\n\n    If you select low tier, you may choose one character card from the top three cards on the deck,\n    which you may look at face up. If selecting high tier, you only receive one target (not a choice of\n    three), which is drawn from the top of the deck.\n\n    If you do not wish to proceed with any of your available targets, you can return the cards to the\n    bottom of their respective deck and end your turn. On your next turn, you may select another target\n    from your Little Birds.\n\n    Finding your target:\n    On the same turn, take a bounty location card (purple coloured card) from your Little Birds. This\n    card will provide you with the location of your target. The location can be any of the 8 major cities\n    in Westeros, that are spaced around the outer section of the board. On your next turn, you will need\n    to begin travelling to this location before you can attempt to take down your target.\n\n    Gathering intel:\n    Once you arrive on the appropriate space, you must find out how many days your target is\n    planning on staying in the current location. This is achieved by rolling the 10-sided die. The\n    number you roll is the number of days that your target will be in the current location.\n\n    If your roll was a 0, your target has already left and you must revisit the Little Birds space to acquire\n    another location card. However, if you roll above a 0, your target will be spending that number of\n\n\n    days in the location. You can make one take down attempt per day that the target is in the city (i.e.\n    4 days = 4 attempts).\n\n    Instead of attempting a take down every day that your target is in the location, you may decide to\n    spend some of that time scouting your target’s patterns and behaviours in order to help in your\n    take down. Each day you spend gathering intel increases your take down roll by 1 point.\n    Taking down your target:\n    If your target is high tier, they will defend themselves using their highest attribute level. If your\n    target is low tier, you must roll a single 6-sided die to determine which of their attributes they will\n    use to defend themselves. The number rolled represents their attributes as follows:\n\n    1 = Magic             2 = Intelligence       3 = Combat\n    4 = Stealth           5 = Cunning            6 = Highest level attribute\n\n    To determine the outcome of the take down attempt, you and the target (played by the player to\n    your left) need to roll dice. The target rolls a 20-sided die and adds the value of the attribute\n    they are using to defend themselves. You also roll a 20-sided die and add the value of your\n    equivalent attribute.\n\n    If you spent a number of days gathering intel, you also add this number to your total.\n\n    Whoever has the highest total number wins. If it is a tie, the take down attempt was a failure.\n\n    If you fail, then you can either choose to gather more intel (thereby increasing your next take down\n    roll), or continue attempting to take down your target for any remaining days that your target is in\n    the location. Further take down attempts and intel gathering all occurs within the same turn.\n    If you exceed the number of days that your target is staying in the current location, you lose the\n    bounty, and must return the character card and bounty location card to the bottom of the deck.\n\n    Assassinating your target:\n\n    If you are successful in your takedown attempt, you can choose to assassinate your target. Choosing\n    to do this means you add the character card to your collection of faces, and their attributes\n    are added to your total. Once you successfully assassinate your target, you must return the\n    location card to the appropriate pile. You can only hold one bounty at a time and must either\n    abandon or complete the bounty before picking up another one.\n\n    If you have an assassination weapon card, you can choose to play it to help you with your\n    assassination. Playing this type of card will unlock your target’s special ability for you to use in\n    the game (see Character Abilities table). An assassination weapon card can only be used against one\n    target, so once you have assassinated your target, the card must be returned to the appropriate pile.\n\n    In total, you may hold up to 7 low tier characters and up to 4 high tier characters. You may\n    either discard unwanted faces, or trade them with other players. Discarding a character card also\n    means you lose that character’s attributes and special ability.\n\n    Blackmailing your target:\n\n\n    If you are successful in your takedown attempt, you can choose to spare your target and instead\n    blackmail them out of a resource of your choice. The amount of resources you receive is determined\n    by the roll of a die. For a low tier character you roll the 10-sided die, and for a high tier\n    character you roll the 20-sided die. Multiply your roll by 1000 to determine the amount of\n    your selected resource you gain.\n\n    Once you have gained your resources, return the character card to the bottom of the deck.\n\n\n    3.2.    Raid:\n\n    If you land on a raid space, you can attempt a raid on the nearest city in order to steal gold. You can\n    attempt the raid whilst the other players are taking their next turn. There are five different areas of\n    the city that you can raid, each requiring a different attribute: magic, intelligence, combat, stealth,\n    and cunning:\n\n    • Magic allows you to cast a spell that summons demonic visions into the minds of the priestesses\n        of the city’s temple, allowing you to enter their treasury undetected.\n    •   Intelligence allows you to locate and disarm the traps that protect the royal repository, which is\n        hidden beneath the palace.\n    •   Combat allows you to incapacitate the guards who are protecting the city’s vault.\n    •   Stealth allows you to sneak through the markets, where you pickpocket local merchants.\n    •   Cunning allows you to impersonate a servant and walk past the royal sentries into the queen’s\n        bedchambers, where you can steal her jewellery.\n\n    You must roll the 10-sided and 20-sided dice together and sum their values to try and match or beat\n    the required roll for your chosen area. The required roll is determined by subtracting the level of\n    your attribute from 30. However, the minimum required roll is always 10. Now you have\n    worked out your required rolls, you can decide which area of the city you would like to attempt to\n    raid first: the temple, the repository, the vault, the market, or the royal bedchambers. If you are\n    successful, you can choose to walk away with your winnings or attempt to raid another area in\n    the hope of stealing more gold. You cannot attempt to raid an area you have already visited.\n\n    If you fail to raid an area, you are set upon by the city guards and must flee the city empty-\n    handed. On your next turn, you must continue with your travels and cannot reattempt a raid on\n    that turn. The amount of gold stolen depends on how many areas you successfully raided:\n\n    •   One area raided:               500 gold\n    •   Two areas raided:              1500 gold\n    •   Three areas raided:            3000 gold\n    •   Four areas raided:             5000 gold\n    •   All five areas raided:         7500 gold\n\n\n    3.3.    Resources:\n\n    If you land on one of these spaces, you receive a minimum of 1000 of the associated resource (Gold, Wood, Stone\n    and Food).\n\n\n    Controlling villages on the inner section of the board can increase how many resources you gain\n    (your settlement does count as a village). Multiply 1000 by the number of villages you control,\n    but the payout can never fall below 1000. (e.g. you control no villages and receive 1000; or you\n    have a settlement and control 2 villages, so you receive 3000 of the resource).\n\n\n    3.4.    Foes:\n\n    There are 4 spaces where you encounter a foe. To escape, you must defeat your encountered foe.\n    Only one attribute will help you, and the helpful attribute is predetermined, depending on the foe.\n    The four spaces, and associated attributes are as follows:\n\n    •   White Walkers:                   Stealth\n    •   King’s Road Thieves:             Cunning\n    •   Witch from the East:             Magic\n    •   Bear Attack:                     Combat\n\n    To determine the outcome of the encounter, you and the foe (played by the player to your left) need\n    to roll dice. You roll a 10-sided die and add your appropriate attribute level to it. The foe\n    rolls a 20-sided die. Whoever has the highest total number wins. If you are not successful or it\n    is a tie, the foe lashes out and injures you. This results in you missing your next turn whilst you\n    heal.\n\n\n    3.5.    Iron Bank Tax & Brotherhood Without Banners:\n\n    There are also two spaces where loss is inescapable. The Iron Bank Tax space, where you lose 4000\n    gold; and the Brotherhood without Banners space, where you lose 1500 of each of the other\n    resources. If you cannot pay the tax to the Iron Bank or don’t have enough resources for the\n    Brotherhood without Banners, you are sent to the prison at Castle Black and lose as many resources\n    as you can afford to give.\n\n\n    3.6.    Captured:\n\n    There are two captured spaces. If you land on one of these spaces, you are immediately sent to\n    prison. If you do not currently hold a bounty, you are sent to the prison at Castle Black. However, if\n    you do have a current bounty, you are sent to the prison of the bounty location. You can indicate\n    that you are in prison by placing your game piece in the purple banner at the top of the space.\n    Whilst in prison, you lose track of the whereabouts of your target. You must therefore return the\n    bounty location card to appropriate pile and go to your Little Birds to find your target’s new\n    location.\n\n    To escape prison, you must either pay 2,000 gold to the prison guard or attempt to escape by\n    rolling two 6-sided dice and rolling a double. You must decide which method you are using before\n    rolling. If you do not have enough gold, you must attempt to roll a double. You may make one\n    escape attempt on each of your turns. If you have not rolled a double after three attempts, you\n\n\n    automatically escape on your third turn. Once you escape, your turn immediately continues as\n    normal and you may make your movement roll.\n\n\n    3.7.   Markets:\n\n    There are two market spaces (Northern and Southern), where players may trade resources at fixed\n    rates. These rates are described by Tables 1 and 2 in the companion app.\n\n\n    3.8.   Weirwood Tree:\n\n    After landing on a weirwood space you must withdraw a weirwood card from the pile and either\n    follow the instructions on the card, or keep the card for later use (where applicable).\n\n\n    3.9.   Roll Again:\n\n    You get to roll the dice again.\n\n\n    3.10. Ports:\n\n    Finally, there are four ports (one at each corner), which allow you to travel onto the inner map\n    section of the board. You can move between the outer and inner sections as often as you wish.\n    Once you have landed on a port, you must wait until your next turn, where you will roll and start\n    counting from the water tile closest to your token.\n\n\n    4. Navigating the Inner Section:\n\n    4.1.   Movement:\n\n    On water, you may choose to roll the 10-sided die, or the 20-sided die. The number rolled\n    determines the strength of the wind that blows you (how many tiles you may move). You may move\n    in any direction you wish, for as many tiles as you wish, from 1 up to the number on your die.\n    However, if you roll either 19 or 20, a storm gathers. A single 6-sided die is then rolled to\n    determine which direction you will be blown in by the storm, as follows:\n\n    1 = North             2 = North-East        3 = South-East\n    4 = South             5 = South-West        6 = North-West\n\n    To determine the number of tiles the storm blows you, you must roll either one or two dice. If a 19\n    was rolled, you roll one 6-sided die, and if a 20 was rolled, you roll two 6-sided dice. If you are\n    blown to the edge of the map, you are reflected and continue being blown by the storm. However, if\n    you meet land during a storm, you become shipwrecked. You then need to pay for boat repairs,\n    which cost 2,000 gold. If you don’t have enough gold to pay for boat repairs, you must only use one\n    6-sided die when crossing water, until you can afford repairs. You also drop any incomplete\n    items that you are carrying (see section 7.1 for dropping items).\n\n    On land, you roll the 20-sided die and, in a similar fashion to on water, you may move in any\n    direction you wish, for as many tiles as you wish, from 1 up to the number of your die.\n\n    To travel from water onto land, or vice versa, you must stop on a water-to-land, or land-to-water,\n    bordering tile. On the next turn, you roll the appropriate dice and start counting your move on the\n    adjacent land or water tile.\n\n\n    4.2.   Forming your Settlement:\n\n    The first thing you may wish to do on the inner section of the board is form your settlement. This is\n    done by moving your piece to a land tile of your preference on the inner board. The tile must be\n    within 15 tiles of the “Dragon’s Lair” tile at the centre of the map, and must be fully surrounded\n    by land tiles (i.e. not on the coastline etc.). Your settlement is indicated by placing your coloured\n    pawn on the map. Two players may not place their settlements within three tiles of each other.\n\n    Your settlement provides safekeeping of your Items, which will be addressed in Section 7.1. You\n    may only have one settlement for the entire game, so pick where to place it wisely.\n\n\n    4.3.   Villages:\n\n    To pillage a village, you must pay 500 gold to some local mercenaries who will carry out the attack.\n    To determine the outcome of the pillage, you and the villagers (played by the player to your left, or\n    the owner of the village) need to roll dice. You roll a 10-sided die and add your combat level to\n    it. The villagers roll a 20-sided die. Whoever has the highest total number wins. If it is a tie,\n    the pillage was not successful.\n\n\n    If successful, you must randomly select your reward from a deck of 8 pillage cards (red coloured\n    card). There are 6 resource cards, and 2 escaped prisoner cards. Resource cards give you either 500\n    or 1,000 of each resource (except gold). More detail about escaped prisoner cards is given in\n    Section 8.5. If you are unsuccessful, you can attempt to pillage again on your next turn.\n\n    Any villages you pillage will now be under your control. You place one of your clear coloured cubes\n    over any villages that you control. Controlling more villages affects how many resources you\n    earn when landing on the resources spaces on the outer board (see section 3.3).\n\n    You can also pillage other player’s villages by entering an adjacent tile. You must pay 1,000 gold to\n    attempt a pillage on another player’s village. If successful, you place one of your coloured cubes on\n    the village and it becomes yours. You can also choose between stealing 2000 of each of their\n    resources, or taking a village pillage card (if you are still looking for an escaped prisoner). If\n    unsuccessful, you must wait at least five turns before attempting to pillage that village again.\n\n\n    4.4.   Shipwrecks:\n\n    In coastal regions, there are shipwrecks that can be explored. If you land on a shipwreck tile, you\n    can randomly select a card from the deck of 9 shipwreck cards (blue coloured card). There are 6\n    gold cards and 3 assassination weapon cards. Assassination weapon cards are explained in\n    section 3.1.\n\n\n    4.5.   Whirlpools:\n\n    If you land on a whirlpool, you must roll a single 6-sided die to determine the strength of the\n    whirlpool’s suction. If you roll a 1, 2, 3, or 4, you safely travel over the whirlpool and continue\n    moving the number of spaces left from your original roll.\n\n    If you roll a 5 or 6, you are pulled into the whirlpool, transporting you to another random whirlpool,\n    where your turn ends. The whirlpool you emerge at is determined by rolling two 6-sided dice,\n    counting around the map in a clockwise direction (excluding the whirlpools around Dragon Island\n    at the centre of the map).\n\n\n    4.6.   Ancient Ruins:\n\n    The West is home to the ruins of an ancient city, reminiscent of Old Valyria. To enter this fallen city\n    is the same as travelling from water onto land. However, once in the ruins, you can only roll one\n    6-sided die. Whilst moving through the ruins, you are allowed to revisit spaces on the same\n    turn. Scattered amongst the ruins are shards of dragon glass, the material that is infused with steel\n    to make Valyrian steel. You will need to acquire some dragon glass in order to make your Valyrian\n    steel sword (one of the 8 items you need to collect to win). More detail about the Valyrian steel\n    sword is given in Section 8.7.\n\n    You must make sure to travel slowly and quietly in this city, as it is home to more than just dragon\n    glass. If you roll a 5 or 6, you travel too quickly and make too much noise, alerting a group of\n\n\n    Stone Men. They attack you, giving you greyscale in the process. However, if your stealth\n    attribute level is 15 or above, then you must roll a 6 to alert the Stone Men.\n\n    If you get greyscale, your travel distance is halved. If the movement roll is an odd number, the\n    half is rounded up. To cure greyscale, you must visit the Citadel Library, where the maesters can\n    treat you.\n\n\n    4.7.   Resource Drops:\n\n    You can visit a resource drop by landing on an adjacent tile. To determine the amount of resources\n    you gain from the drop, you must roll a 10-sided die. The number rolled is multiplied by 1,000 to\n    dictate the amount of resources gained. The location of the cube determines which resource you\n    obtain as follows:\n\n\n           Gold:                  Wood:                    Stone:               Food:         &\n\n\n    Once a resource drop has been explored, the cube is removed from the board.\n\n\n    5. Attacking Another Player’s Settlement:\n    Before you can declare war against another player, you need to train your army. You can initially\n    train your army for a cost of 10,000 food. Whilst located in your settlement, you can verbally\n    declare war on another player. You can declare war against other players as many times as you wish,\n    at any point during the game, but each time you declare war, you must retrain your army in order to\n    declare another war. Repeated wars cause your soldiers to grow battle-weary, therefore each\n    subsequent retraining of your army costs an additional 5,000 food. (e.g., first army costs\n    10,000 food, second army costs 15,000 food, etc.).\n\n    After declaring war, you must travel to the other player's settlement in order to attack it. If the\n    defending player returns to their settlement before you reach a tile adjacent to it, the attack is\n    called off and you must leave empty handed.\n\n    If you reach a tile adjacent to their settlement whilst the defending player is absent, you begin\n    taking 500 of each of their resources per turn, starting on the turn that you arrive. This\n    continues until the defending player returns to their settlement, or until 15 of your turns have\n    elapsed. If the defending player does not return within 15 of your turns, you may steal one of their\n    secured items without needing to duel for it.\n\n    If the defending player arrives within those 15 turns, you then have the opportunity to duel them\n    for one of their secured items. This is done by both players rolling a 6-sided die. If you both roll the\n    same number, you can steal a secured item of your choosing. An item may not be stolen if you\n    already possess one of the same item. You may not steal the City, the Iron Ship, or the Dragon Egg.\n\n\n    If an item is stolen during an attack, the attacking player receives the item in its completed\n    state. The stolen item is immediately secured at the attacking player's settlement or City and its\n    ability becomes available to them.\n\n    The player who lost the item no longer possesses or receives the benefits of that item. They must\n    return to the item's original acquisition location and complete its quest again before they can\n    regain it. If you have had war declared on you, you may not declare war on another player until your\n    current war is over.\n\n    You may also form an allegiance with one other player, where both of you declare war on another\n    player. In this situation, you must both be in your respective settlements at the same time to\n    declare war. The same rules apply, except both attacking players must be adjacent to the settlement\n    that is under attack before any resources are taken.\n\n    If the defending player arrives whilst there is only one attacking player at their gates, the late\n    attacking player must leave empty handed, and the prompt attacking player continues to duel for\n    an item as normal.\n\n    If both attackers arrive before the defender, each attacking player receives 300 of each resource\n    per turn. When duelling for an item, each of the attacking players can attempt to steal an item in\n    the same manner as before, however, only one attacking player needs to win in order for both\n    to steal an item. If the duel is won, the player who arrived at the settlement first can pick the item\n    they take first.\n\n\n    6. Confronting Another Player:\n    It is possible to steal a Face or resources from another player if you confront them. Alternatively,\n    you can make them drop one incomplete item that they are carrying.\n\n    To confront another player, you must land on the tile next to the person you wish to confront. This\n    can only be done on the inner section of the board, either on land or at sea (but not if a player is in\n    their settlement or a village they control). You then both roll one 6-sided die. To be successful, you\n    must both roll the same number.\n\n    If you are successful, you can either steal a face of your choice from the other player, or steal an\n    amount of resources from them. The amount of resources is determined by rolling a 6-sided die.\n    Multiply the roll by 1000, and take that amount of one resource type from them.\n\n    Alternatively, if they are carrying an incomplete item, you can make them drop it instead.\n    The item returns to its checkpoint, or to its original acquisition location if it has never been\n    checkpointed, as described in Section 7.1.\n\n    If the initiating player was successful in their confrontation, they must wait five turns before\n    initiating another confrontation, whilst the confronted player must only wait one turn. All\n    players involved in an unsuccessful confrontation must wait one turn before initiating another\n    confrontation.\n\n\n    7.     Items:\n    The items discussed throughout this rulebook are obtained and completed as described in Section\n    8. Some items require a separate activation stage after they have been obtained, whilst others do\n    not. Where an item requires activation, its ability will not take effect until it has been activated. An\n    item is considered completed once it has been activated, where activation is required, or once its\n    acquisition quest has been completed for items that do not require a separate activation stage.\n\n    The companion app is used to track which items you have obtained, whether they have been\n    checkpointed, whether they are currently being carried or secured, and whether they have been\n    completed.\n\n    The City and Iron Ship are permanent upgrades rather than carried items and therefore do not\n    follow the normal rules for carrying, checkpointing or dropping items. The Dragon Egg is also\n    subject to its own special rules, as described in Section 8.8.\n\n\n    7.1.   General Item Rules:\n\n    Carrying Items:\n    When you first obtain an item that has not yet been completed, you carry it with you as you travel.\n    Whilst carrying an incomplete item, it may be lost as a result of a shipwreck, confrontation, or\n    another game effect that causes you to drop an item. You may carry any number of incomplete\n    items at the same time.\n\n    Checkpointing Items:\n    Once you have obtained an incomplete item, you may take it to your settlement to establish a\n    checkpoint before continuing its quest. Once an item has been checkpointed, you may collect it\n    from your settlement and continue carrying it towards any location required to complete or\n    activate it.\n\n    Checkpointing an item is optional. You may instead take an item directly towards its next quest or\n    activation location without first visiting your settlement. Doing so is quicker, but carries a greater\n    risk if the item is subsequently lost.\n\n    If you lose an incomplete item that has previously been checkpointed, it returns to your settlement.\n    You must collect it from your settlement before you can continue its quest. If you lose an\n    incomplete item that has not previously been checkpointed, it returns to its original acquisition\n    location and you must obtain it again before continuing its quest.\n\n    Once your settlement has been upgraded into a City, the rules for checkpointing items change as\n    described in Section 8.2.\n\n    Completing and Securing Items:\n    Once an item has been completed, it is automatically secured at your settlement or City. You do not\n    need to physically return to your settlement after completing or activating an item. A secured item\n    continues to provide its ability as normal. Securing an item represents the completion and\n    safekeeping of that item for game purposes; it does not prevent any abilities associated with the\n    item from continuing to affect your character.\n\n\n    Secured items cannot normally be dropped through shipwrecks or confrontations. However, they\n    remain vulnerable to being stolen during an attack on your settlement, as described in Section 5.\n\n    Dropping Items:\n    You may be forced to drop an incomplete item that you are carrying if you are shipwrecked,\n    successfully confronted by another player, or affected by another rule or ability that causes you to\n    drop an item. If the dropped item has previously been checkpointed, it returns to your settlement.\n    If it has not previously been checkpointed, it returns to its original acquisition location and must be\n    obtained again.\n\n    Completed items are secured and therefore cannot normally be dropped. The Dragon Egg is an\n    exception to these rules. It cannot be checkpointed or secured and, if dropped, returns to the\n    Dragon's Lair as described in Section 8.8.\n\n\n    8. Quests to Obtain and Complete the Items:\n\n    8.1.   Secrets of the Hidden World:\n\n    You can take this book from the Citadel Library if you can prove to the maesters of the citadel that\n    you are worthy of entering the restricted section of the library. To prove your merit, you must\n    remember a list of single-syllable words set by the maesters. In this situation, the player to your left\n    will take the role of the maesters, and will be responsible for setting the words for you to remember.\n\n    To determine the number of words you must remember, look at your intelligence level and\n    minus this number from 30. The minimum number of words you need to remember is 5. The\n    player responsible for setting your words must write them down and read them to you slowly, at\n    roughly one word per second. You have 1 minute to recall the words once they have been read. All\n    other players must remain silent during this minute.\n\n    If you fail to remember them all, you can try again on your next turn, with the same words being\n    read to you again in the same order. If you leave the Citadel Library and return later with a higher\n    intelligence level, the number of words you need to remember is reduced accordingly from the\n    original list. When guessing, you are allowed to suggest incorrect words, but you need to recite all\n    of your set words to succeed.\n\n    Once you have the book, you can learn about the mysterious forces responsible for whirlpools and\n    can therefore navigate to a whirlpool of your choosing should you be sucked into one.\n\n\n    8.2.   City:\n\n    To upgrade your settlement into a city costs: 15,000 gold, and 25,000 stone. The upgrade is done\n    by visiting Bran the Builder. Place the city item on the board, covering the 7 tiles around your\n    settlement, and place one of your transparent coloured cubes on top to signify that it is yours.\n\n\n    Once you have upgraded your settlement into a City, all incomplete items you currently carry,\n    and any subsequently obtained, become automatically checkpointed. You therefore no longer\n    need to physically return to your City to establish a checkpoint. You may continue carrying the item\n    towards its next quest or activation location, but if you lose it before completion, it will return to\n    your City rather than its original location.\n\n\n    8.3.     Direwolf:\n\n    To obtain a Direwolf, you must first visit The Land of Always Winter, where you will attempt to\n    gain the trust of a wild Direwolf. Your Cunning level determines how easily you are able to\n    approach the Direwolf. Refer to the table below to determine the roll required on the 20-sided die:\n\n\n           Player Cunning Level      Up to 19             20 or above\n\n                  Required Roll        16+                    8+\n\n\n    Before making your taming attempt, you may choose to offer the Direwolf food to improve your\n    chances of success. For every 1,000 food you offer, add +2 to your taming roll. You must decide\n    how much food to offer before rolling the die, and the food is spent regardless of whether your\n    attempt is successful.\n\n    Any bonus gained from offering food applies only to the taming attempt made on that turn.\n    If you are unsuccessful, you may make another attempt on your next turn, but any previous food\n    bonus is lost and you must offer additional food if you wish to receive another bonus.\n\n    Once you successfully approach the Direwolf, take the Direwolf item. However, the Direwolf is not\n    yet fully tamed and its special ability does not take effect. You must first tame your Direwolf,\n    by gaining two Bond Points. A Bond Point is gained by completing one of the following feats whilst\n    the untamed Direwolf is travelling with you:\n\n    • Defeat a Foe on the outer section of the board.\n    • Successfully complete a bounty take down.\n    • Successfully pillage a village.\n    • Successfully confront another player.\n\n    Your two Bond Points must be gained from two different feats. For example, defeating two\n    different Foes would only provide one Bond Point, whereas defeating a Foe and successfully\n    pillaging a village would provide two.\n\n    Once you have gained your second Bond Point, the Direwolf becomes fully tamed and its ability is\n    immediately activated. Your Direwolf becomes your travelling companion, protecting you from\n    enemies on the road. If you encounter a Foe space on the outer section of the board, the Foe\n    is automatically defeated by your Direwolf and you can continue unscathed.\n\n\n    8.4.    Gemstone:\n\n    There are 6 different types of gemstones: five of them embody each of the five attributes (these\n    gemstones increase the associated attribute by 10 levels), and there is one protean gemstone\n    (which equally increases all attributes by 2 levels). The colours of each gemstone are as follows:\n\n    • Magic:             Pink\n    • Intelligence:      Blue\n    • Combat:            Red\n    • Stealth:           Black\n    • Cunning:           Green\n    • Protean:           Clear\n\n    To obtain a gemstone, you must hire a salvage crew who will retrieve it for you. You can hire a\n    crew from any of the ports around the outer board. Once you have assembled your crew, you must\n    sail them to the whirlpools around Dragon Island, where they will retrieve your gemstone.\n\n    You pay your crew for the amount of time they spend aboard your ship, so the longer you take,\n    the more expensive the venture. Whilst sailing with a crew, keep a tally of the number of turns you\n    spend with them on board. This includes the turns spent moving over land, or when shipwrecked,\n    and also the turns spent returning them to one of the ports on the outer board once you have got\n    your gemstone. You can use this tally to determine what you owe them at the end of your voyage.\n    You pay your crew with resources of your choosing, so long as the total matches the price they\n    charge.\n\n    Salvage crews have varying degrees of experience, and the better ones will demand a higher price.\n    To recover a gemstone, you must roll the required number or higher on the 20-sided die. The required number is determined by the experience level of your crew.\n\n\n           Experienced Crew   Cost = 300 resources per turn   Required roll = 13+\n\n       Inexperienced Crew     Cost = 100 resources per turn   Required roll = 18+\n\n\n    Once you are positioned over one of the whirlpools, you may continue to roll the 20-sided die\n    until you find a gemstone (i.e. keep rolling all in one turn). Remember to count how many rolls it\n    takes you to recover a gemstone, as this will be added to the number of turns you have taken.\n\n    Once you roll the required number or higher, you can then randomly select one of the gemstones. If\n    you do not wish to keep your selected gemstone, you may return it to the whirlpool and continue to\n    search for the gemstone you desire on your next turn.\n\n    The gemstone is activated by visiting the Priestess from Asshai, who will enchant it. Only once it\n    has been activated will the associated attribute(s) be added to your total.\n\n\n    8.5.    Knights of the Vale:\n\n    To gain the allegiance of the Knights of the Vale, you must return a high value prisoner to House\n    Arryn. These escaped prisoners are hiding out in the villages on the inner map. To flush one out,\n\n\n    you must pillage a village and withdraw an escaped prisoner card. This triggers the prisoner to\n    break from cover and attempt to run away. You must give chase to catch them.\n\n    To start, place one of the transparent turquoise cubes on the village you have pillaged to\n    represent the escaped prisoner. The direction that the prisoner runs is determined by rolling the 6-\n    sided die, in the same manner as with a storm. On the first turn, you roll the 20-sided die and count\n    out the number of spaces that they travel in the specified direction. You then travel as normal to try\n    and catch them. On subsequent turns, you again determine the direction they travel, then roll two\n    6-sided dice to determine how far they travel. You must chase them down and land on a tile next to\n    them (whilst in the same terrain as them) in order to apprehend them. Note that the escaped\n    prisoner can travel directly from water to land and vice versa without waiting. If the prisoner\n    finds their way back to a village or an enemy settlement, you lose them and need to pillage another\n    village to find a prisoner. If by chance, they enter one of your villages or your settlement, you\n    capture them. The escaped prisoner is unaffected by all other special-tile effects (e.g. whirlpools,\n    ruins, etc.).\n\n    Once you catch your prisoner, you take the transparent turquoise cube. You must return it to\n    House Arryn by visiting the Sky Cell space on the outer board. As a thank you for returning the\n    prisoner, Lady Arryn pledges her Knights of the Vale to you, and so you receive the horse item. Once\n    you have the Knights of the Vale on your side, you may call on them to assist you in a war. You\n    may use the Knights of the Vale to carry out one attack on another player as described in\n    section 5. This does not cost you any food.\n\n\n    8.6.   Iron Ship:\n\n    Upgrading your boat into an Iron Ship costs 15,000 gold and 25,000 wood. This upgrade is done\n    by visiting the Euron’s Shipyard on the outer section of the board. Once you have obtained your\n    Iron Ship item, you will be unaffected by storms.\n\n\n    8.7.   Valyrian Steel Sword:\n\n    You must first obtain some dragon glass to infuse into your blade. To obtain a dragon glass shard,\n    you must visit every tile in the ancient ruins. Remember, travelling too quickly in the ancient\n    ruins will alert the stone men who will give you greyscale.\n\n    Once obtained, the shard is taken to Gendry’s Foundry, where he forges it into a Valyrian steel\n    sword, earning you the Valyrian steel sword item. Once you have your Valyrian steel sword, you\n    only need to be within 5 tiles of another player before you can confront them.\n\n\n    8.8.   Dragon Egg:\n\n    The rarest and most difficult item to obtain is the dragon egg. There is only one dragon egg\n    available, so once a player has stolen the egg, it is advisable that the other players try and confront\n    them. Once you hatch your dragon egg you will become the dominant force in the west, and you\n    win the game.\n\n\n    The dragon’s lair is located on a volcanic island at the centre of the map. To enter the Dragon's Lair,\n    you must have completed all seven other item quests, including upgrading your settlement into a\n    City. You must pass the whirlpools that surround the island by landing on one of them and rolling\n    a 1, 2, 3, or 4 on the 6-sided die.\n\n    Once successfully past the whirlpools, travelling onto the volcanic island takes one turn. Now you\n    are on the island, you must try and obtain the egg. To do this, you must pass the mother dragon.\n    Once you are facing the dragon, you have one initial attempt to steal the egg. For this attempt,\n    you must roll a 20 on the 20-sided die. If you are unsuccessful on this attempt, you may have one\n    more attempt per attribute that is level 30 or above. For each of these attempts, you only need to\n    roll a 13 or above to defeat the dragon. If you are still unsuccessful after all subsequent attempts,\n    the mother dragon picks you up and flies you back to your city, from which you can embark on your\n    journey to face the dragon once again. However, your ship is damaged in the process, requiring you\n    to make repairs.\n\n    Once you have successfully stolen the egg, your final action will be to hatch it in the Dragon Pit on\n    the outer board. The Egg cannot be checkpointed or secured at your City and, if dropped, returns to\n    the Dragon's Lair.\n\n    Once you have hatched your egg, you are the winner of the game, and the ruler of the West.",

      "num": "1",
      "title": "Setting Up",
      "page": 1,
      "text": "Each player begins the game with 15 attribute points, which they can divide as they wish between\n    their 5 attributes: Magic, Intelligence, Combat, Stealth, and Cunning. Enter your chosen starting\n    attributes into the companion app. The app will track any changes to your attributes throughout\n    the game.\n\n    Each player also begins the game with the following resources: 5,000 gold, 2,000 wood, 2,000\n    stone, and 2,000 food. These resources are tracked using the companion app, which should be\n    updated whenever resources are gained, spent, stolen, lost or traded.\n\n    There are several opaque red cubes that can be positioned around the inner section of the board.\n    Each cube represents a ‘resource drop’, where an amount of resources have been abandoned.\n    Players can decide how many of these cubes they would like to use for the game. Once decided,\n    each player takes a portion of these cubes and positions them however they choose over the various\n    resource tiles on the map. The resource tile that the cubes are placed on determines which resource\n    it will contain. The tile icons and their associated resources are shown below. More information on\n    resource drops is given in section 4.7.\n\n           Gold:                 Wood:                  Stone:               Food:       &\n\n    To begin play, each player places their token on the Little Birds space nearest to them."
    },
    {
      "num": "2",
      "title": "Starting the Game",
      "page": 1,
      "text": "The youngest player takes the first turn, and play is passed clockwise. You start by immediately\n    receiving your first bounty, as explained in section 3.1. Once you have your bounty you can begin\n    moving towards your bounty’s location. Before rolling, you must choose to roll either one or two 6-\n    sided dice and in which direction you would like to travel, clockwise or anticlockwise. If you\n    choose to roll two dice, you must move the number of spaces that you roll, in the direction\n    that you stated before rolling.\n\n    However, if you have rolled one die instead, you may move any number of spaces up to and\n    including the number you rolled, unless the number you rolled would land you on a\n    detrimental space. Detrimental spaces are indicated by a red banner at the top of a space. These\n    include: ‘Foe spaces’, Brotherhood Without Banners, Iron Bank Tax, and Captured spaces. Any\n\n    number of players can land on the same space, and players can move past each other in either\n    direction."
