<!DOCTYPE html>

<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<meta content="#151311" name="theme-color"/>
<meta content="Companion app for the West of Westeros board game." name="description"/>
<style>
:root {
  --bg:#0f0e0d;
  --panel:#191715;
  --panel2:#211e1a;
  --line:#3a342d;
  --text:#f0eadf;
  --muted:#aaa094;
  --accent:#b99a63;
  --accent2:#d8c39a;
  --danger:#ba6a62;
  --good:#7da884;
  --shadow:0 14px 40px rgba(0,0,0,.34);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at top,#1d1915 0,#0f0e0d 44%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app-shell{max-width:760px;margin:0 auto;min-height:100vh}
.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:18px 16px 12px;background:linear-gradient(180deg,rgba(15,14,13,.98),rgba(15,14,13,.86),rgba(15,14,13,0));backdrop-filter:blur(8px)}
.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--accent);font-weight:800}
h1{font-family:Georgia,"Times New Roman",serif;font-size:29px;margin:2px 0 0;letter-spacing:.01em}
h2,h3{font-family:Georgia,"Times New Roman",serif}
.view{padding:6px 14px 24px}
.bottom-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(18,16,14,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{width:min(20%,152px);min-height:66px;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;font-size:18px}
.nav-btn b{font-size:11px;font-weight:700}
.nav-btn.active{color:var(--accent2)}
.nav-icon{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn b{letter-spacing:.015em}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.hero{padding:18px}
.hero-row,.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;background:#2a251f;border:1px solid #413a31;color:var(--accent2);font-size:12px}
.pill.good{color:#c7e2cb;border-color:#3d5f44;background:#1c2a1f}
.pill.warn{color:#ead5a8;border-color:#6a5734;background:#302718}
.pill.bad{color:#efc4c0;border-color:#6d3c38;background:#321c1a}
.progress{height:8px;border-radius:99px;background:#302b26;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#8b7146,#d1b77f)}
.grid{display:grid;gap:10px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 8px}
.section-title h2{font-size:20px;margin:0}
.section-title p{margin:0;font-size:12px;color:var(--muted)}
.stat{background:#151311;border:1px solid #332e28;border-radius:13px;padding:10px;text-align:center;min-width:0}
.stat label{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat strong{display:block;font-family:Georgia,serif;font-size:25px;margin-top:3px}
.resource{padding:12px;background:#151311;border:1px solid #332e28;border-radius:13px}
.resource .name{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.resource input{width:100%;font-size:22px;font-family:Georgia,serif;color:var(--text);background:transparent;border:0;padding:5px 0 8px;outline:none}
.quick{display:flex;gap:6px}
button,.btn{border:1px solid #554a3d;background:#2a241d;color:var(--text);padding:9px 12px;border-radius:10px;font-weight:700}
button:hover{border-color:#8e795a}
button.primary{background:#8f764c;color:#100f0d;border-color:#b3996c}
button.danger{background:#4a2522;border-color:#78433e;color:#f5d8d4}
button.ghost{background:transparent;border-color:#413a31;color:var(--accent2)}
button.small{padding:6px 9px;font-size:11px}
button.icon-btn{border:0;background:transparent;color:var(--muted);font-size:28px;padding:0 4px}
.hidden{display:none!important}
input,select,textarea{width:100%;background:#11100f;color:var(--text);border:1px solid #443c33;border-radius:10px;padding:10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#a48a5f}
label.field{display:block;margin:10px 0}
label.field span{display:block;color:var(--muted);font-size:11px;margin:0 0 5px}
.item-card{position:relative;overflow:hidden}
.item-card.completed{border-color:#536c55}
.item-card .badge{position:absolute;right:10px;top:10px}
.item-card h3{margin:0 70px 4px 0;font-size:18px}
.item-card p{margin:6px 0;color:var(--muted);font-size:12px;line-height:1.45}
.item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.face-card h3{margin:0;font-size:17px}
.face-attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.face-attrs div{background:#11100f;border-radius:8px;text-align:center;padding:6px 2px;font-size:10px;color:var(--muted)}
.face-attrs strong{display:block;color:var(--text);font-size:16px}
.tool-grid{display:grid;gap:10px}
.tool-card h3{margin:0 0 6px;font-size:18px}
.tool-card p{font-size:12px;color:var(--muted);margin:0 0 10px}
.result{background:#11100f;border:1px solid #332e28;border-radius:12px;padding:12px;margin-top:10px}
.result strong{font-size:22px;font-family:Georgia,serif;color:var(--accent2)}
.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.tabs button{white-space:nowrap}
.tabs button.active{background:#8f764c;color:#111;border-color:#b99a63}
.search{position:sticky;top:70px;z-index:8;background:#0f0e0d;padding:7px 0 10px}
.search input{font-size:16px}
.rule-result{padding:12px 0;border-bottom:1px solid #302b26}
.rule-result h3{font-size:15px;margin:0 0 5px;color:var(--accent2)}
.rule-result p{font-size:12px;line-height:1.5;color:#ddd4c8;margin:0;white-space:pre-wrap}
.ability-row{padding:11px 0;border-bottom:1px solid #302b26}
.ability-row h3{font-size:15px;margin:0 0 4px}
.ability-row p{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
.ability-row-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ability-row-head h3{margin:0}
.ability-characters-btn{width:34px;height:34px;min-width:34px;border-radius:999px;padding:0;display:grid;place-items:center;color:var(--muted);background:#211e1a;border:1px solid #3c352e}
.ability-characters-btn:hover,.ability-characters-btn:focus{color:var(--text);border-color:#6d5e4d}
.ability-characters-btn svg{width:18px;height:18px;display:block}
.ability-character-list{display:grid;gap:8px;margin-top:12px}
.ability-character-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #302b26;border-radius:12px;background:#13110f}
.ability-character-row .visual-thumb{flex:0 0 auto}
.ability-character-row .meta{min-width:0}
.ability-character-row .meta strong{display:block;font-size:14px}
.ability-character-row .meta span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.suspicion-badge{display:inline-flex;align-items:center;gap:6px}
.confront-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.confront-summary>div{padding:10px;border-radius:12px;background:#13110f;border:1px solid #302b26;text-align:center}
.confront-summary span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.confront-summary strong{display:block;margin-top:3px;font-size:13px}
.confront-options{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.confront-options span{font-size:11px;border:1px solid #3b342d;border-radius:999px;padding:6px 9px;color:var(--muted)}
@media(max-width:430px){.confront-summary{grid-template-columns:1fr 1fr 1fr;gap:6px}.confront-summary>div{padding:8px 4px}.confront-summary strong{font-size:12px}}
.market-table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.market-table th,.market-table td{border:1px solid #3c352e;padding:7px;text-align:center}
.market-table th{color:var(--accent2);background:#151311}
.status-row{display:flex;gap:8px;flex-wrap:wrap}
.status-toggle.active{border-color:#a78351;background:#342b20;color:#f0dfbd}
.modal{border:0;background:transparent;padding:14px;width:min(620px,100%);max-width:none;color:var(--text)}
.modal::backdrop{background:rgba(0,0,0,.7);backdrop-filter:blur(4px)}
.modal-card{background:#171512;border:1px solid #4b4238;border-radius:18px;padding:16px;box-shadow:var(--shadow);max-height:88vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-head h2{margin:0;font-size:22px}
.notice{border-left:3px solid #a4814d;padding:9px 11px;background:#211b14;border-radius:4px 10px 10px 4px;color:#dbc7a4;font-size:12px;line-height:1.45}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}
hr{border:0;border-top:1px solid #302b26;margin:14px 0}
pre.rules-full{white-space:pre-wrap;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d9d0c5}
@media(min-width:620px){.view{padding-left:20px;padding-right:20px}.tool-grid{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:repeat(4,1fr)}}
@media(max-width:420px){.grid-5{grid-template-columns:repeat(5,minmax(50px,1fr));gap:6px}.stat{padding:8px 3px}.stat label{font-size:9px}.stat strong{font-size:21px}.card{padding:12px}.resource input{font-size:20px}}

/* v0.2 mobile interaction improvements */
html{min-height:100%;overflow-y:auto;scroll-padding-bottom:120px}
body{min-height:100dvh;overflow-x:hidden;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.app-shell{min-height:100dvh}
.view{padding-bottom:calc(130px + env(safe-area-inset-bottom))}
.bottom-nav{min-height:68px}
.resource-quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.resource-quick button{min-height:42px;padding:8px 6px;font-size:12px}
.segmented{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.segmented button{min-height:42px}
.segmented button.active{background:#8f764c;color:#111;border-color:#b99a63}
.bounty-fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.counter-line{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.counter-stack{display:grid;gap:10px;margin:12px 0}
.stepper{display:grid;grid-template-columns:minmax(52px,auto) minmax(54px,auto) minmax(52px,auto);align-items:center;gap:7px}
.stepper button{min-height:44px;min-width:52px;padding:8px 10px;font-size:15px}
.stepper strong{text-align:center;font-family:Georgia,serif;font-size:21px;white-space:nowrap}
.big-actions button{min-height:48px}
.bond-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px}
.bond-btn{min-height:46px;text-align:left;font-size:12px}
.bond-btn.active{background:#273329;border-color:#55705a;color:#d6ead9}
.compact-field{max-width:360px}
.wide-action{width:100%;margin-top:4px;min-height:46px}
button:disabled{opacity:.45;cursor:not-allowed}
.good-text{color:#b9d8bf}
.toast{position:fixed;z-index:50;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translate(-50%,18px);width:min(calc(100% - 28px),620px);padding:12px 14px;border-radius:12px;background:#24201b;border:1px solid #4b4238;color:var(--text);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;text-align:center;font-size:13px;font-weight:700}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{border-color:#4b7252;background:#1d2b20}
.toast.warn{border-color:#7a6138;background:#302718}
.toast.bad{border-color:#78433e;background:#3a211e}
.toast.neutral{border-color:#554a3d;background:#24201b}
@media(max-width:520px){
  .bounty-fields{grid-template-columns:1fr}
  .resources-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .resource{padding:10px}
  .resource-quick button{font-size:11px;min-height:44px}
  .bond-grid{grid-template-columns:1fr 1fr}
}

/* v0.3 interaction and mobile fixes */
html,body{height:auto!important;min-height:100%!important;overflow-y:auto!important;overscroll-behavior-y:auto}
body{padding-bottom:calc(118px + env(safe-area-inset-bottom))!important}
.app-shell{min-height:100dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.view{padding-bottom:calc(160px + env(safe-area-inset-bottom))!important;min-height:calc(100dvh - 80px)}
.bottom-nav{padding-bottom:max(env(safe-area-inset-bottom),6px);touch-action:manipulation}
.nav-btn,button{touch-action:manipulation;-webkit-tap-highlight-color:rgba(185,154,99,.18)}

.title-with-help,.tool-head,.item-head{display:flex;align-items:center;gap:8px}
.tool-head,.item-head{justify-content:space-between;align-items:flex-start}
.tool-head>div,.item-head>div{min-width:0;flex:1}
.help-btn{width:30px;height:30px;min-width:30px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--accent2);border:1px solid #5b5042;font-family:Georgia,serif;font-size:16px}
.help-btn:hover{background:#2a241d}
.inline-edit{margin-top:8px;justify-content:flex-end}

.resource{padding:12px}
.resource .name{text-align:center;margin-bottom:8px}
.resource-line{display:grid;grid-template-columns:minmax(54px,.8fr) minmax(90px,1.25fr) minmax(54px,.8fr);gap:7px;align-items:center}
.resource-side{display:grid;gap:6px}
.resource-side button{min-height:40px;padding:7px 5px;font-size:12px}
.resource input{font-size:24px;text-align:center;border:1px solid #40382f;border-radius:10px;padding:12px 4px;background:#11100f;font-family:Georgia,serif;min-width:0}

.benefit-list{display:grid;gap:8px}
.benefit-row{display:grid;gap:2px;padding:9px 0;border-bottom:1px solid #302b26}
.benefit-row:last-child{border-bottom:0}
.benefit-row strong{color:var(--accent2);font-size:13px}
.benefit-row span{color:var(--muted);font-size:12px;line-height:1.45}

.item-card .badge{top:12px;right:52px}
.item-head h3{margin:0 120px 4px 0}
.item-head p{margin:5px 0 0}
.cost-box{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#11100f;border:1px solid #332e28;border-radius:10px;padding:10px 12px;margin:10px 0}
.cost-box span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cost-box strong{font-size:13px;text-align:right}
.quest-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.quest-steps button{min-height:48px}

.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px 12px;color:var(--text)}
.modal.hidden{display:none!important}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.74)}
.modal-card{position:relative;width:min(620px,100%);max-height:min(86dvh,760px);overflow-y:auto;background:#171512;border:1px solid #4b4238;border-radius:18px;padding:16px;box-shadow:var(--shadow);z-index:1;-webkit-overflow-scrolling:touch}
body.modal-open{overflow:hidden!important}
.help-copy{font-size:14px;line-height:1.6;color:#ddd4c8;margin:8px 0 16px}

.action-feedback{margin-top:10px;padding:9px 10px;border-radius:9px;background:#151311;border:1px solid #332e28;color:var(--muted);font-size:12px;line-height:1.4}
.action-feedback.good{border-color:#3d5f44;color:#c7e2cb;background:#1c2a1f}
.action-feedback.warn{border-color:#6a5734;color:#ead5a8;background:#302718}
.action-feedback.bad{border-color:#6d3c38;color:#efc4c0;background:#321c1a}

.toc-list{display:grid;margin-top:10px}
.toc-row{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:transparent;border:0;border-bottom:1px solid #302b26;border-radius:0;padding:12px 2px;color:var(--text)}
.toc-row span{min-width:0}
.toc-row strong{display:inline-block;min-width:34px;color:var(--accent2)}
.toc-row small{color:var(--muted);white-space:nowrap}
.rules-toolbar{margin:0 0 8px}
.rule-section{box-shadow:none}
.rule-section-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #302b26;padding-bottom:10px;margin-bottom:10px}
.rule-section-head h3{display:inline;margin:0 0 0 8px;font-size:19px}
.rule-body{font-size:13px;line-height:1.6;color:#ddd4c8}
.rule-body p{margin:0 0 12px}
.rule-body h4{font-size:14px;color:var(--accent2);margin:14px 0 5px;font-family:Georgia,serif}
.rule-body ul{margin:8px 0 14px;padding-left:22px}
.rule-body li{margin:4px 0}
.rule-data-line{font-size:12px;background:#11100f;border-radius:7px;padding:6px 8px;margin:4px 0}
.error-box{white-space:pre-wrap;overflow:auto;background:#11100f;padding:10px;border-radius:8px;color:#efc4c0}

@media(max-width:520px){
  .grid-2.resources-grid{grid-template-columns:1fr}
  .resource-line{grid-template-columns:minmax(62px,.8fr) minmax(108px,1.25fr) minmax(62px,.8fr)}
  .resource-side button{min-height:44px;font-size:13px}
  .resource input{font-size:26px;min-height:94px}
  .bounty-fields{grid-template-columns:1fr}
  .quest-steps{grid-template-columns:1fr}
  .item-card .badge{position:static;margin:8px 0 4px}
  .item-head h3{margin-right:0}
  .modal{align-items:center;padding:12px 8px}
  .modal-card{max-height:82dvh;border-radius:18px}
}
.section-title{flex-wrap:wrap;align-items:center}
.section-title>p{margin-left:auto;max-width:62%;text-align:right;line-height:1.3}
@media(max-width:520px){
  .section-title>p{flex-basis:100%;max-width:none;text-align:left;margin:4px 0 0}
}

/* v0.4 card-library and held-card refinements */
.resource-line input{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.01em}
.held-card-list{display:grid;gap:8px;margin:10px 0 12px}
.held-card-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border:1px solid #342f29;background:#131210;border-radius:11px}
.held-card-row>div{display:grid;gap:2px;min-width:0}
.held-card-row strong{font-size:13px;color:var(--accent2)}
.held-card-row span{font-size:11px;line-height:1.4;color:var(--muted)}
.weirwood-add{align-items:stretch}
.weirwood-add select{flex:1;min-width:0}
.weirwood-add button{min-width:72px}
.compact-empty{padding:10px;margin:8px 0 12px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal-actions button{min-width:110px}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:12px;background:#11100f;border:1px solid #3b352e;border-radius:11px;margin:12px 0}
.check-row input{width:auto;margin-top:3px;transform:scale(1.15)}
.check-row span{display:grid;gap:2px}
.check-row small{color:var(--muted);line-height:1.35}
.face-picker-preview{padding:12px;background:#11100f;border:1px solid #342f29;border-radius:11px;margin:8px 0 12px}
.face-picker-preview .face-attrs{margin-top:10px}
.warn-text{color:#e0bd7f}
.bounty-card select{min-height:43px}
@media(max-width:520px){
  .resource-line{grid-template-columns:72px minmax(120px,1fr) 72px}
  .resource-side button{min-height:48px}
  .resource input{min-height:102px;font-size:29px;padding:10px 3px}
  .held-card-row{align-items:flex-start}
  .held-card-row button{min-height:44px;min-width:64px}
  .weirwood-add{display:grid;grid-template-columns:1fr 72px;width:100%}
  .modal-actions{display:grid;grid-template-columns:1fr 1fr}
  .modal-actions button{min-width:0;min-height:46px}
}

  

/* v0.5 phone-first controls */
.resources-list{display:grid;gap:9px}

<script>
window.WOW_DATA = {
  "rulesText": "The Rules & Playing the Game:\n\n1. Setting Up:\nEach player begins the game with 15 attribute points, which they can divide as they wish between their 5 attributes: Magic, Intelligence, Combat, Stealth, and Cunning. Enter your chosen starting attributes into the companion app. The app will track any changes to your attributes throughout the game.\n\nEach player also begins the game with the following resources: 5,000 gold, 2,000 wood, 2,000 stone, and 2,000 food. These resources are tracked using the companion app, which should be updated whenever resources are gained, spent, stolen, lost or traded.\n\nThere are several opaque red cubes that can be positioned around the inner section of the board. Each cube represents a ‘resource drop’, where an amount of resources have been abandoned. Players can decide how many of these cubes they would like to use for the game. Once decided, each player takes a portion of these cubes and positions them however they choose over the various resource tiles on the map. The resource tile that the cubes are placed on determines which resource it will contain. The tile icons and their associated resources are shown below. More information on resource drops is given in section 4.7.\n\nGold:                 Wood:                  Stone:               Food:       &\n\nTo begin play, each player places their token on the Little Birds space nearest to them.\n\n2. Starting the Game:\nThe youngest player takes the first turn, and play is passed clockwise. You start by immediately receiving your first bounty, as explained in section 3.1. Once you have your bounty you can begin moving towards your bounty’s location. Before rolling, you must choose to roll either one or two 6-sided dice and in which direction you would like to travel, clockwise or anticlockwise. If you choose to roll two dice, you must move the number of spaces that you roll, in the direction that you stated before rolling.\n\nHowever, if you have rolled one die instead, you may move any number of spaces up to and including the number you rolled, unless the number you rolled would land you on a detrimental space. Detrimental spaces are indicated by a red banner at the top of a space. These include: ‘Foe spaces’, Brotherhood Without Banners, Iron Bank Tax, and Captured spaces. Any\n\nnumber of players can land on the same space, and players can move past each other in either direction.\n\n3. Navigating the Outer Section:\n\n3.1. Little Birds:\nLanding on this space initiates a meeting with your spies, or ‘Little Birds’. They will provide you with a target that you may either attempt to assassinate or blackmail, and the location that they were last sighted. You must first choose your target, then their location will be revealed.\n\nAssassinating your target will mean that you gain their face, and any associated attribute points that the character holds will be added to your total. Blackmailing a target will allow you to gain resources from them, but allows them to walk free. Before assassinating or blackmailing your target, you will need to perform a ‘take down’ on your target by rolling a higher number than them on the 20-sided die, hereon referred to as the take down roll. Whilst you are ‘choosing a target’ and ‘finding your target’ (see below), the next player can start their turn.\n\nChoosing a target:\nThere are two tiers of character that you can attempt to take down: high tier characters and low tier characters. They differ in that high tier characters have more attribute points than low tier characters. However, to attempt a take down on a high tier character, all of your attribute levels must already be above level 10.\n\nIf you select low tier, you may choose one character card from the top three cards on the deck, which you may look at face up. If selecting high tier, you only receive one target (not a choice of three), which is drawn from the top of the deck.\n\nIf you do not wish to proceed with any of your available targets, you can return the cards to the bottom of their respective deck and end your turn. On your next turn, you may select another target from your Little Birds.\n\nFinding your target:\nOn the same turn, take a bounty location card (purple coloured card) from your Little Birds. This card will provide you with the location of your target. The location can be any of the 8 major cities in Westeros, that are spaced around the outer section of the board. On your next turn, you will need to begin travelling to this location before you can attempt to take down your target.\n\nGathering intel:\nOnce you arrive on the appropriate space, you must find out how many days your target is planning on staying in the current location. This is achieved by rolling the 10-sided die. The number you roll is the number of days that your target will be in the current location.\n\nIf your roll was a 0, your target has already left and you must revisit the Little Birds space to acquire another location card. However, if you roll above a 0, your target will be spending that number of\n\ndays in the location. You can make one take down attempt per day that the target is in the city (i.e. 4 days = 4 attempts).\n\nInstead of attempting a take down every day that your target is in the location, you may decide to spend some of that time scouting your target’s patterns and behaviours in order to help in your take down. Each day you spend gathering intel increases your take down roll by 1 point.\n\nTaking down your target:\nIf your target is high tier, they will defend themselves using their highest attribute level. If your target is low tier, you must roll a single 6-sided die to determine which of their attributes they will use to defend themselves. The number rolled represents their attributes as follows:\n\n1 = Magic             2 = Intelligence       3 = Combat\n4 = Stealth           5 = Cunning            6 = Highest level attribute\n\nThe defending attribute remains the same for all takedown attempts against that target during their current stay.\n\nTo determine the outcome of the take down attempt, you and the target (played by the player to your left) need to roll dice. The target rolls a 20-sided die and adds the value of the attribute they are using to defend themselves. You also roll a 20-sided die and add the value of your equivalent attribute.\n\nIf you spent a number of days gathering intel, you also add this number to your total.\n\nWhoever has the highest total number wins. If it is a tie, the take down attempt was a failure.\n\nIf you fail, then you can either choose to gather more intel (thereby increasing your next take down roll), or continue attempting to take down your target for any remaining days that your target is in the location. Further take down attempts and intel gathering all occurs within the same turn. If you exceed the number of days that your target is staying in the current location, you lose the bounty, and must return the character card and bounty location card to the bottom of the deck.\n\nAssassinating your target:\n\nIf you are successful in your takedown attempt, you can choose to assassinate your target. Choosing to do this means you add the character card to your collection of faces, and their attributes are added to your total. Once you successfully assassinate your target, you must return the location card to the appropriate pile. You can only hold one bounty at a time and must either abandon or complete the bounty before picking up another one.\n\nIf you have an assassination weapon card, you can choose to play it to help you with your assassination. Playing this type of card will unlock your target’s special ability for you to use in the game (see Character Abilities table). An assassination weapon card can only be used against one target, so once you have assassinated your target, the card must be returned to the appropriate pile.\n\nIn total, you may hold up to 7 low tier characters and up to 4 high tier characters. You may either discard unwanted faces, or trade them with other players. Discarding a character card also means you lose that character’s attributes and special ability.\n\nBlackmailing your target:\n\nIf you are successful in your takedown attempt, you can choose to spare your target and instead blackmail them out of a resource of your choice. The amount of resources you receive is determined by the roll of a die. For a low tier character you roll the 10-sided die, and for a high tier character you roll the 20-sided die. Multiply your roll by 500 to determine the amount of your selected resource you gain.\n\nOnce you have gained your resources, return the character card to the bottom of the deck.\n\n3.2. Raid:\nIf you land on a raid space, you can attempt a raid on the nearest city in order to steal gold. You can attempt the raid whilst the other players are taking their next turn. There are five different areas of the city that you can raid, each requiring a different attribute: magic, intelligence, combat, stealth,\nand cunning:\n\n• Magic allows you to cast a spell that summons demonic visions into the minds of the priestesses\nof the city’s temple, allowing you to enter their treasury undetected.\n•   Intelligence allows you to locate and disarm the traps that protect the royal repository, which is\nhidden beneath the palace.\n•   Combat allows you to incapacitate the guards who are protecting the city’s vault.\n•   Stealth allows you to sneak through the markets, where you pickpocket local merchants.\n•   Cunning allows you to impersonate a servant and walk past the royal sentries into the queen’s\nbedchambers, where you can steal her jewellery.\n\nYou must roll the 10-sided and 20-sided dice together and sum their values to try and match or beat the required roll for your chosen area. The required roll is determined by subtracting the level of your attribute from 30. However, the minimum required roll is always 10. Now you have worked out your required rolls, you can decide which area of the city you would like to attempt to raid first: the temple, the repository, the vault, the market, or the royal bedchambers. If you are successful, you can choose to walk away with your winnings or attempt to raid another area in the hope of stealing more gold. You cannot attempt to raid an area you have already visited.\n\nIf you fail to raid an area, you are set upon by the city guards and must flee the city empty-handed. On your next turn, you must continue with your travels and cannot reattempt a raid on that turn. The amount of gold stolen depends on how many areas you successfully raided:\n\n•   One area raided:               500 gold\n•   Two areas raided:              1500 gold\n•   Three areas raided:            3000 gold\n•   Four areas raided:             5000 gold\n•   All five areas raided:         7500 gold\n\n3.3. Resources:\nIf you land on one of these spaces, you receive 1000 of the associated resource (Gold, Wood, Stone and Food).\n\nSettlements in your network can increase how many resources you gain. Multiply the base 1,000 resources by the number of Settlements in your network, with your Stronghold counting as one additional network location. If you do not yet have a Stronghold or any Settlements in your network, you still receive the minimum 1,000 resources. For example, if you land on the wood space whilst you have a Stronghold and 2 Settlements in your network, you receive 3,000 wood.\n\n3.4. Foes:\nThere are 4 spaces where you encounter a foe. To escape, you must defeat your encountered foe. Only one attribute will help you, and the helpful attribute is predetermined, depending on the foe.\nThe four spaces, and associated attributes are as follows:\n\n•   White Walkers:                   Stealth\n•   King’s Road Thieves:             Cunning\n•   Witch from the East:             Magic\n•   Bear Attack:                     Combat\n\nTo determine the outcome of the encounter, you and the foe (played by the player to your left) need to roll dice. You roll a 10-sided die and add your appropriate attribute level to it. The foe rolls a 20-sided die. Whoever has the highest total number wins. If you are not successful or it is a tie, the foe lashes out and injures you. This results in you missing your next turn whilst you heal.\n\n3.5. Iron Bank Tax & Brotherhood Without Banners:\nThere are also two spaces where loss is inescapable. The Iron Bank Tax space, where you lose 4000 gold; and the Brotherhood without Banners space, where you lose 1500 of each of the other resources. If you cannot pay the tax to the Iron Bank or don’t have enough resources for the Brotherhood without Banners, you are sent to the prison at Castle Black and lose as many resources as you can afford to give.\n\n3.6. Captured:\nThere are two captured spaces. If you land on one of these spaces, you are immediately sent to prison. If you do not currently hold a bounty, you are sent to the prison at Castle Black. However, if you do have a current bounty, you are sent to the prison of the bounty location. You can indicate that you are in prison by placing your game piece in the purple banner at the top of the space. Whilst in prison, you lose track of the whereabouts of your target. You must therefore return the bounty location card to appropriate pile and go to your Little Birds to find your target’s new location.\n\nTo escape prison, you must either pay 2,000 gold to the prison guard or attempt to escape by rolling two 6-sided dice and rolling a double. You must decide which method you are using before rolling. If you do not have enough gold, you must attempt to roll a double. You may make one escape attempt on each of your turns. If you have not rolled a double after three attempts, you remain in prison for the rest of that turn and automatically escape at the start of your following turn. Once you escape, your turn immediately continues as normal and you may make your movement roll.\n\n3.7. Markets:\nThere are two market spaces (Northern and Southern), where players may trade resources at fixed rates. These rates are described by Tables 1 and 2 in the companion app.\n\n3.8. Weirwood Tree:\nAfter landing on a weirwood space you must withdraw a weirwood card from the pile and either follow the instructions on the card, or keep the card for later use (where applicable).\n\n3.9. Roll Again:\nYou get to roll the dice again.\n\n3.10. Ports:\nFinally, there are four ports (one at each corner), which allow you to travel onto the inner map section of the board. You can move between the outer and inner sections as often as you wish. Once you have landed on a port, you must wait until your next turn, where you will roll and start counting from the water tile closest to your token.\n\n4. Navigating the Inner Section:\n\n4.1. Movement:\nOn water, you may choose to roll the 10-sided die, or the 20-sided die. The number rolled determines the strength of the wind that blows you (how many tiles you may move). You may move in any direction you wish, for as many tiles as you wish, from 1 up to the number on your die. However, if you roll either 19 or 20, a storm gathers. A single 6-sided die is then rolled to\ndetermine which direction you will be blown in by the storm, as follows:\n\n1 = North             2 = North-East        3 = South-East\n4 = South             5 = South-West        6 = North-West\n\nTo determine the number of tiles the storm blows you, you must roll either one or two dice. If a 19 was rolled, you roll one 6-sided die, and if a 20 was rolled, you roll two 6-sided dice. If you are blown to the edge of the map, you are reflected and continue being blown by the storm. However, if you meet land during a storm, you become shipwrecked. You then need to pay for boat repairs, which cost 2,000 gold. If you don’t have enough gold to pay for boat repairs, you must only use one 6-sided die when crossing water, until you can afford repairs. You also drop any incomplete items that you are carrying (see section 7.1 for dropping items).\n\nOn land, you roll the 20-sided die and, in a similar fashion to on water, you may move in any direction you wish, for as many tiles as you wish, from 1 up to the number of your die.\n\nTo travel from water onto land, or vice versa, you must stop on a water-to-land, or land-to-water, bordering tile. On the next turn, you roll the appropriate dice and start counting your move on the adjacent land or water tile.\n\n4.2. Forming your Stronghold:\nThe first thing you may wish to do on the inner section of the board is establish your Stronghold. Your Stronghold acts as a hidden base of operations, containing safehouses, stores, trusted contacts and retainers. This is done by moving your piece to a land tile of your preference on the inner board. The tile must be within 15 tiles of the “Dragon’s Lair” tile at the centre of the map, and must be fully surrounded by land tiles (i.e. not on the coastline etc.). Your Stronghold is indicated by placing your coloured pawn on the map. Two players may not place their Strongholds within three tiles of each other.\n\nYour Stronghold provides safekeeping of your Items, which will be addressed in Section 7.1. You may only have one Stronghold for the entire game, so pick where to place it wisely.\n\n4.3. Settlements:\nSettlements across the West provide access to local supplies, contacts and information. To establish influence in a neutral Settlement, you must pay 500 gold to local agents and mercenaries who will help overcome any resistance. To determine whether you are successful, you and the Settlement\n\n(played by the player to your left, or by the player whose network the Settlement belongs to) need to roll dice. You roll a 10-sided die and add your Combat level to it. The Settlement rolls a 20-sided die and adds your Suspicion level. Whoever has the highest total number wins. If it is a tie, you fail to establish influence.\n\nYour Suspicion level increases as assassinations take place across Westeros, causing communities to become increasingly wary of strangers and strengthen their defences. Each time you assassinate a Low Tier character, your Suspicion increases by 1, and each time you assassinate a High Tier character, it increases by 2. Blackmail does not increase Suspicion, and Suspicion is not reduced if you later discard, trade or lose a Face.\n\nIf successful, randomly select your reward from the deck of 8 red reward cards. There are 6 resource cards and 2 escaped prisoner cards. Resource cards give you either 500 or 1,000 of each resource (except gold). More detail about escaped prisoner cards is given in Section 8.5. The Settlement also becomes part of your network; place one of your clear coloured cubes over it to represent your influence there. Settlements in your network increase the resources you earn when landing on resource spaces on the outer board (see Section 3.3). If unsuccessful, you may attempt to establish influence there again on your next turn.\n\nYou can also attempt to take over the influence of another player by entering a tile adjacent to a Settlement in their network. This costs 1,000 gold and is resolved in the same way using your current Suspicion level. If successful, replace their coloured cube with one of your own and the Settlement becomes part of your network instead. You can also choose between stealing 2,000 of each of their resources, or taking a red reward card if you are still looking for an escaped prisoner. If unsuccessful, you must wait at least five turns before attempting to take over that Settlement again.\n\n4.4. Shipwrecks:\nIn coastal regions, there are shipwrecks that can be explored. If you land on a shipwreck tile, you can randomly select a card from the deck of 9 shipwreck cards (blue coloured card). There are 6 gold cards and 3 assassination weapon cards. Assassination weapon cards are explained in section 3.1.\n\n4.5. Whirlpools:\nIf you land on a whirlpool, you must roll a single 6-sided die to determine the strength of the whirlpool’s suction. If you roll a 1, 2, 3, or 4, you safely travel over the whirlpool and continue moving the number of spaces left from your original roll.\n\nIf you roll a 5 or 6, you are pulled into the whirlpool, transporting you to another random whirlpool, where your turn ends. The whirlpool you emerge at is determined by rolling two 6-sided dice, counting around the map in a clockwise direction (excluding the whirlpools around Dragon Island at the centre of the map).\n\n4.6. Ancient Ruins:\nThe West is home to the ruins of an ancient city, reminiscent of Old Valyria. To enter this fallen city is the same as travelling from water onto land. However, once in the ruins, you can only roll one 6-sided die. Whilst moving through the ruins, you are allowed to revisit spaces on the same turn. Scattered amongst the ruins are shards of dragon glass, the material that is infused with steel to make Valyrian steel. You will need to acquire some dragon glass in order to make your Valyrian steel sword (one of the 8 items you need to collect to win). More detail about the Valyrian steel sword is given in Section 8.7.\n\nYou must make sure to travel slowly and quietly in this city, as it is home to more than just dragon glass. If you roll a 5 or 6, you travel too quickly and make too much noise, alerting a group of Stone Men. They attack you, giving you greyscale in the process. However, if your stealth attribute level is 15 or above, then you must roll a 6 to alert the Stone Men.\n\nIf you get greyscale, your travel distance is halved. If the movement roll is an odd number, the half is rounded up. To cure greyscale, you must visit the Citadel Library, where the maesters can treat you.\n\n4.7. Resource Drops:\nYou can visit a resource drop by landing on an adjacent tile. To determine the amount of resources you gain from the drop, you must roll a 10-sided die. The number rolled is multiplied by 1,000 to dictate the amount of resources gained. The location of the cube determines which resource you\nobtain as follows:\n\nGold:                  Wood:                   Stone:                Food:        &\n\nOnce a resource drop has been explored, the cube is removed from the board.\n\n5. Attacking Another Player’s Stronghold:\nBefore you can declare a Stronghold Attack against another player, you need to assemble a group of Hired Blades. These are temporary recruits brought together to infiltrate and attack another player’s Stronghold rather than a permanent army. Your first group of Hired Blades costs 10,000 food to provision. Whilst located in your Stronghold, you can verbally declare a Stronghold Attack against another player. You can declare Stronghold Attacks as many times as you wish during the game, but once an attack is over your Hired Blades disperse and another group must be assembled before declaring another. Each subsequent group costs an additional 5,000 food, as reliable recruits become harder to find and surviving fighters demand greater payment (e.g. the first group costs 10,000 food, the second costs 15,000 food, etc.).\n\nAfter declaring a Stronghold Attack, you must travel to the other player’s Stronghold. If the defending player returns to their Stronghold before you reach a tile adjacent to it, the attack is called off and you must leave empty handed.\n\nIf you reach a tile adjacent to their Stronghold whilst the defending player is absent, your Hired Blades begin infiltrating it and you take 500 of each of their resources per turn, starting on the turn that you arrive. This continues until the defending player returns to their Stronghold, or until 15 of your turns have elapsed. If the defending player does not return within 15 of your turns, you may steal one of their secured Items without needing to duel for it.\n\nIf the defending player arrives within those 15 turns, you then have the opportunity to duel them for one of their secured Items. This is done by both players rolling a 6-sided die. If you both roll the same number, you can steal a secured Item of your choosing. An Item may not be stolen if you already possess one of the same Item. You may not steal the City, the Iron Ship, or the Dragon Egg.\n\nIf an Item is stolen during a Stronghold Attack, the attacking player receives the Item in its completed state. The stolen Item is immediately secured at the attacking player’s Stronghold or City and its ability becomes available to them. The player who lost the Item no longer possesses or receives the benefits of that Item. They must return to the Item’s original acquisition location and complete its quest again before they can regain it. If another player has declared a Stronghold Attack against you, you may not declare one against another player until the current attack is over.\n\nYou may also form an allegiance with one other player, where both of you declare a Stronghold Attack against another player. In this situation, you must both be in your respective Strongholds at the same time to declare the attack. The same rules apply, except both attacking players must be adjacent to the defending Stronghold before any resources are taken.\n\nIf the defending player arrives whilst there is only one attacking player at their Stronghold, the late attacking player must leave empty handed, and the prompt attacking player continues to duel for an Item as normal.\n\nIf both attackers arrive before the defender, each attacking player receives 300 of each resource per turn. When duelling for an Item, each attacking player can attempt to steal an Item in the same manner as before; however, only one attacking player needs to win in order for both to steal an Item. If the duel is won, the player who arrived at the Stronghold first can pick the Item they take first.\n\n6. Confronting Another Player:\nIt is possible to steal a Face or resources from another player if you confront them. Alternatively, you can make them drop one incomplete item that they are carrying.\n\nTo confront another player, you must land on the tile next to the person you wish to confront. This can only be done on the inner section of the board, either on land or at sea (but not if a player is in their stronghold or a settlement in their network). You then both roll one 6-sided die. To be successful, you must both roll the same number.\n\nIf you are successful, you can either steal a face of your choice from the other player, or steal an amount of resources from them. The amount of resources is determined by rolling a 6-sided die. Multiply the roll by 1000, and take that amount of one resource type from them.\n\nAlternatively, if they are carrying an incomplete item, you can make them drop it instead. The item returns to its checkpoint, or to its original acquisition location if it has never been checkpointed, as described in Section 7.1.\n\nIf the initiating player was successful in their confrontation, they must wait five turns before initiating another confrontation, whilst the confronted player must only wait one turn. All players involved in an unsuccessful confrontation must wait one turn before initiating another confrontation.\n\n7. Items:\nThe items discussed throughout this rulebook are obtained and completed as described in Section 8. Some items require a separate activation stage after they have been obtained, whilst others do not. Where an item requires activation, its ability will not take effect until it has been activated. An item is considered completed once it has been activated, where activation is required, or once its acquisition quest has been completed for items that do not require a separate activation stage.\n\nThe companion app is used to track which items you have obtained, whether they have been checkpointed, whether they are currently being carried or secured, and whether they have been completed.\n\nThe City and Iron Ship are permanent upgrades rather than carried items and therefore do not follow the normal rules for carrying, checkpointing or dropping items. The Dragon Egg is also subject to its own special rules, as described in Section 8.8.\n\n7.1. General Item Rules:\nCarrying Items:\nWhen you first obtain an item that has not yet been completed, you carry it with you as you travel. Whilst carrying an incomplete item, it may be lost as a result of a shipwreck, confrontation, or another game effect that causes you to drop an item. You may carry any number of incomplete items at the same time.\n\nCheckpointing Items:\nOnce you have obtained an incomplete item, you may take it to your stronghold to establish a checkpoint before continuing its quest. Once an item has been checkpointed, you may collect it from your stronghold and continue carrying it towards any location required to complete or activate it.\n\nCheckpointing an item is optional. You may instead take an item directly towards its next quest or activation location without first visiting your stronghold. Doing so is quicker, but carries a greater risk if the item is subsequently lost.\n\nIf you lose an incomplete item that has previously been checkpointed, it returns to your stronghold. You must collect it from your stronghold before you can continue its quest. If you lose an incomplete item that has not previously been checkpointed, it returns to its original acquisition location and you must obtain it again before continuing its quest.\n\nOnce your stronghold has been upgraded into a City, the rules for checkpointing items change as described in Section 8.2.\n\nCompleting and Securing Items:\nOnce an item has been completed, it is automatically secured at your stronghold or City. You do not need to physically return to your stronghold after completing or activating an item. A secured item continues to provide its ability as normal. Securing an item represents the completion and safekeeping of that item for game purposes; it does not prevent any abilities associated with the item from continuing to affect your character.\n\nSecured items cannot normally be dropped through shipwrecks or confrontations. However, they remain vulnerable to being stolen during an attack on your stronghold, as described in Section 5.\n\nDropping Items:\nYou may be forced to drop an incomplete item that you are carrying if you are shipwrecked, successfully confronted by another player, or affected by another rule or ability that causes you to drop an item. If the dropped item has previously been checkpointed, it returns to your stronghold. If it has not previously been checkpointed, it returns to its original acquisition location and must be obtained again.\n\nCompleted items are secured and therefore cannot normally be dropped. The Dragon Egg is an exception to these rules. It cannot be checkpointed or secured and, if dropped, returns to the Dragon's Lair as described in Section 8.8.\n\n8. Quests to Obtain and Complete the Items:\n\n8.1. Secrets of the Hidden World:\nYou can take this book from the Citadel Library if you can prove to the maesters of the citadel that you are worthy of entering the restricted section of the library. To prove your merit, you must remember a list of single-syllable words set by the maesters. In this situation, the player to your left will take the role of the maesters, and will be responsible for setting the words for you to remember.\n\nTo determine the number of words you must remember, look at your intelligence level and minus this number from 30. The minimum number of words you need to remember is 5. The player responsible for setting your words must write them down and read them to you slowly, at roughly one word per second. You have 1 minute to recall the words once they have been read. All other players must remain silent during this minute.\n\nIf you fail to remember them all, you can try again on your next turn, with the same words being read to you again in the same order. If you leave the Citadel Library and return later with a higher\n\nintelligence level, the number of words you need to remember is reduced accordingly from the original list. When guessing, you are allowed to suggest incorrect words, but you need to recite all of your set words to succeed.\n\nOnce you have the book, you can learn about the mysterious forces responsible for whirlpools and can therefore navigate to a whirlpool of your choosing should you be sucked into one.\n\n8.2. City:\nTo upgrade your stronghold into a City costs: 15,000 gold, and 25,000 stone. The upgrade is done by visiting Bran the Builder. Place the city item on the board, covering the 7 tiles around your stronghold, and place one of your transparent coloured cubes on top to signify that it is yours.\n\nOnce you have upgraded your stronghold into a City, all incomplete items you currently carry, and any subsequently obtained, become automatically checkpointed. You therefore no longer need to physically return to your City to establish a checkpoint. You may continue carrying the item towards its next quest or activation location, but if you lose it before completion, it will return to your City rather than its original location.\n\n8.3. Direwolf:\nTo obtain a Direwolf, you must first visit The Land of Always Winter, where you will attempt to gain the trust of a wild Direwolf. Your Cunning level determines how easily you are able to approach the Direwolf. Refer to the table below to determine the roll required on the 20-sided die:\n\nPlayer Cunning Level      Up to 19             20 or above\n\nRequired Roll        16+                    8+\n\nBefore making your taming attempt, you may choose to offer the Direwolf food to improve your chances of success. For every 1,000 food you offer, add +2 to your taming roll. You must decide how much food to offer before rolling the die, and the food is spent regardless of whether your attempt is successful.\n\nAny bonus gained from offering food applies only to the taming attempt made on that turn. If you are unsuccessful, you may make another attempt on your next turn, but any previous food bonus is lost and you must offer additional food if you wish to receive another bonus.\n\nOnce you successfully approach the Direwolf, take the Direwolf item. However, the Direwolf is not yet fully tamed and its special ability does not take effect. You must first tame your Direwolf, by gaining two Bond Points. A Bond Point is gained by completing one of the following feats whilst\nthe untamed Direwolf is travelling with you:\n\n• Defeat a Foe on the outer section of the board.\n• Successfully complete a bounty take down.\n• Successfully establish influence in a Settlement.\n• Successfully confront another player.\n\nYour two Bond Points must be gained from two different feats. For example, defeating two different Foes would only provide one Bond Point, whereas defeating a Foe and successfully confronting another player would provide two.\n\nOnce you have gained your second Bond Point, the Direwolf becomes fully tamed and its ability is immediately activated. Your Direwolf becomes your travelling companion, protecting you from enemies on the road. If you encounter a Foe space on the outer section of the board, the Foe is automatically defeated by your Direwolf and you can continue unscathed.\n\n8.4. Gemstone:\nThere are 6 different types of gemstones: five of them embody each of the five attributes (these gemstones increase the associated attribute by 10 levels), and there is one protean gemstone (which equally increases all attributes by 2 levels). The colours of each gemstone are as follows:\n\n• Magic:             Pink\n• Intelligence:      Blue\n• Combat:            Red\n• Stealth:           Black\n• Cunning:           Green\n• Protean:           Clear\n\nTo obtain a gemstone, you must hire a salvage crew who will retrieve it for you. You can hire a crew from any of the ports around the outer board. Once you have assembled your crew, you must sail them to the whirlpools around Dragon Island, where they will retrieve your gemstone.\n\nYou pay your crew for the amount of time they spend aboard your ship, so the longer you take, the more expensive the venture. Whilst sailing with a crew, keep a tally of the number of turns you spend with them on board. This includes the turns spent moving over land, or when shipwrecked, and also the turns spent returning them to one of the ports on the outer board once you have got your gemstone. You can use this tally to determine what you owe them at the end of your voyage. You pay your crew with resources of your choosing, so long as the total matches the price they charge.\n\nSalvage crews have varying degrees of experience, and the better ones will demand a higher price. To recover a gemstone, you must roll the 20-sided die above a certain number, and this number is determined by the experience level of your crew.\n\nExperienced Crew   Cost = 300 resources per turn   Required roll = 13+\n\nInexperienced Crew     Cost = 100 resources per turn   Required roll = 18+\n\nOnce you are positioned over one of the whirlpools, you may continue to roll the 20-sided die until you find a gemstone (i.e. keep rolling all in one turn). Remember to count how many rolls it takes you to recover a gemstone, as this will be added to the number of turns you have taken.\n\nOnce you roll the required number or higher, you can then randomly select one of the gemstones. If you do not wish to keep your selected gemstone, you may return it to the whirlpool and continue to search for the gemstone you desire on your next turn.\n\nThe gemstone is activated by visiting the Priestess from Asshai, who will enchant it. Only once it has been activated will the associated attribute(s) be added to your total.\n\n8.5. Knights of the Vale:\nTo gain the allegiance of the Knights of the Vale, you must return a high value prisoner to House Arryn. These escaped prisoners are hiding out in Settlements on the inner map. To flush one out, you must successfully establish influence in a Settlement and withdraw an escaped prisoner card. This triggers the prisoner to break from cover and attempt to run away. You must give chase to catch them.\n\nTo start, place one of the transparent turquoise cubes on the settlement where you found the escaped prisoner. The direction that the prisoner runs is determined by rolling the 6-sided die, in the same manner as with a storm. On the first turn, you roll the 20-sided die and count out the number of spaces that they travel in the specified direction. You then travel as normal to try and catch them. On subsequent turns, you again determine the direction they travel, then roll two 6-sided dice to determine how far they travel. You must chase them down and land on a tile next to them (whilst in the same terrain as them) in order to apprehend them. Note that the escaped prisoner can travel directly from water to land and vice versa without waiting. If the prisoner enters a neutral Settlement, a Settlement in another player’s network, or another player’s Stronghold, you lose them and need to find another escaped prisoner. If they enter a Settlement in your network or your Stronghold, you capture them. The escaped prisoner is unaffected by all other special-tile effects (e.g. whirlpools, ruins, etc.).\n\nOnce you catch your prisoner, you take the transparent turquoise cube. You must return it to House Arryn by visiting the Sky Cell space on the outer board. As a thank you for returning the prisoner, Lady Arryn pledges her Knights of the Vale to you, and so you receive the horse item. Once you have the Knights of the Vale on your side, you may call on them to carry out one Stronghold Attack against another player as described in Section 5. You do not need to assemble Hired Blades for this attack and it does not cost you any food.\n\n8.6. Iron Ship:\nUpgrading your boat into an Iron Ship costs 15,000 gold and 25,000 wood. This upgrade is done by visiting the Euron’s Shipyard on the outer section of the board. Once you have obtained your Iron Ship item, you will be unaffected by storms.\n\n8.7. Valyrian Steel Sword:\nYou must first obtain some dragon glass to infuse into your blade. To obtain a dragon glass shard, you must visit every tile in the ancient ruins. Remember, travelling too quickly in the ancient ruins will alert the stone men who will give you greyscale.\n\nOnce obtained, the shard is taken to Gendry’s Foundry, where he forges it into a Valyrian steel sword, earning you the Valyrian steel sword item. Once you have your Valyrian steel sword, you only need to be within 5 tiles of another player before you can confront them.\n\n8.8. Dragon Egg:\nThe rarest and most difficult item to obtain is the dragon egg. There is only one dragon egg available, so once a player has stolen the egg, it is advisable that the other players try and confront them. Once you hatch your dragon egg you will become the dominant force in the west, and you win the game.\n\nThe dragon’s lair is located on a volcanic island at the centre of the map. To enter the Dragon's Lair, you must have completed all seven other item quests, including upgrading your Stronghold into a City. You must pass the whirlpools that surround the island by landing on one of them and rolling a 1, 2, 3, or 4 on the 6-sided die.\n\nOnce successfully past the whirlpools, travelling onto the volcanic island takes one turn. Now you are on the island, you must try and obtain the egg. To do this, you must pass the mother dragon. Once you are facing the dragon, you have one initial attempt to steal the egg. For this attempt, you must roll a 20 on the 20-sided die. If you are unsuccessful on this attempt, you may have one more attempt per attribute that is level 30 or above. For each of these attempts, you only need to roll a 13 or above to defeat the dragon. If you are still unsuccessful after all subsequent attempts, the mother dragon picks you up and flies you back to your city, from which you can embark on your journey to face the dragon once again. However, your ship is damaged in the process, requiring you to make repairs.\n\nOnce you have successfully stolen the egg, your final action will be to hatch it in the Dragon Pit on the outer board. The Egg cannot be checkpointed or secured at your City and, if dropped, returns to the Dragon's Lair.\n\nOnce you have hatched your egg, you are the winner of the game, and the ruler of the West.",

  "sourceVersion": "Rules v6 + Tables v4 + Character/Weirwood card imports · app v0.13",
  "ruleSections": [
    {
      "num": "1",
      "title": "Setting Up",
      "page": 1,
      "text": "Each player begins the game with 15 attribute points, which they can divide as they wish between their 5 attributes: Magic, Intelligence, Combat, Stealth, and Cunning. Enter your chosen starting attributes into the companion app. The app will track any changes to your attributes throughout the game.\n\nEach player also begins the game with the following resources: 5,000 gold, 2,000 wood, 2,000 stone, and 2,000 food. These resources are tracked using the companion app, which should be updated whenever resources are gained, spent, stolen, lost or traded.\n\nThere are several opaque red cubes that can be positioned around the inner section of the board. Each cube represents a ‘resource drop’, where an amount of resources have been abandoned. Players can decide how many of these cubes they would like to use for the game. Once decided, each player takes a portion of these cubes and positions them however they choose over the various resource tiles on the map. The resource tile that the cubes are placed on determines which resource it will contain. The tile icons and their associated resources are shown below. More information on resource drops is given in section 4.7.\n\nGold:                 Wood:                  Stone:               Food:       &\n\nTo begin play, each player places their token on the Little Birds space nearest to them."
    },
    {
      "num": "2",
      "title": "Starting the Game",
      "page": 1,
      "text": "The youngest player takes the first turn, and play is passed clockwise. You start by immediately receiving your first bounty, as explained in section 3.1. Once you have your bounty you can begin moving towards your bounty’s location. Before rolling, you must choose to roll either one or two 6-sided dice and in which direction you would like to travel, clockwise or anticlockwise. If you choose to roll two dice, you must move the number of spaces that you roll, in the direction that you stated before rolling.\n\nHowever, if you have rolled one die instead, you may move any number of spaces up to and including the number you rolled, unless the number you rolled would land you on a detrimental space. Detrimental spaces are indicated by a red banner at the top of a space. These include: ‘Foe spaces’, Brotherhood Without Banners, Iron Bank Tax, and Captured spaces. Any\n\nnumber of players can land on the same space, and players can move past each other in either direction."
    },
    {
      "num": "3",
      "title": "Navigating the Outer Section",
      "page": 2,
      "text": ""
    },
    {
      "num": "3.1",
      "title": "Little Birds",
      "page": 2,
      "text": "Landing on this space initiates a meeting with your spies, or ‘Little Birds’. They will provide you with a target that you may either attempt to assassinate or blackmail, and the location that they were last sighted. You must first choose your target, then their location will be revealed.\n\nAssassinating your target will mean that you gain their face, and any associated attribute points that the character holds will be added to your total. Blackmailing a target will allow you to gain resources from them, but allows them to walk free. Before assassinating or blackmailing your target, you will need to perform a ‘take down’ on your target by rolling a higher number than them on the 20-sided die, hereon referred to as the take down roll. Whilst you are ‘choosing a target’ and ‘finding your target’ (see below), the next player can start their turn.\n\nChoosing a target:\nThere are two tiers of character that you can attempt to take down: high tier characters and low tier characters. They differ in that high tier characters have more attribute points than low tier characters. However, to attempt a take down on a high tier character, all of your attribute levels must already be above level 10.\n\nIf you select low tier, you may choose one character card from the top three cards on the deck, which you may look at face up. If selecting high tier, you only receive one target (not a choice of three), which is drawn from the top of the deck.\n\nIf you do not wish to proceed with any of your available targets, you can return the cards to the bottom of their respective deck and end your turn. On your next turn, you may select another target from your Little Birds.\n\nFinding your target:\nOn the same turn, take a bounty location card (purple coloured card) from your Little Birds. This card will provide you with the location of your target. The location can be any of the 8 major cities in Westeros, that are spaced around the outer section of the board. On your next turn, you will need to begin travelling to this location before you can attempt to take down your target.\n\nGathering intel:\nOnce you arrive on the appropriate space, you must find out how many days your target is planning on staying in the current location. This is achieved by rolling the 10-sided die. The number you roll is the number of days that your target will be in the current location.\n\nIf your roll was a 0, your target has already left and you must revisit the Little Birds space to acquire another location card. However, if you roll above a 0, your target will be spending that number of\n\ndays in the location. You can make one take down attempt per day that the target is in the city (i.e. 4 days = 4 attempts).\n\nInstead of attempting a take down every day that your target is in the location, you may decide to spend some of that time scouting your target’s patterns and behaviours in order to help in your take down. Each day you spend gathering intel increases your take down roll by 1 point.\n\nTaking down your target:\nIf your target is high tier, they will defend themselves using their highest attribute level. If your target is low tier, you must roll a single 6-sided die to determine which of their attributes they will use to defend themselves. The number rolled represents their attributes as follows:\n\n1 = Magic             2 = Intelligence       3 = Combat\n4 = Stealth           5 = Cunning            6 = Highest level attribute\n\nThe defending attribute remains the same for all takedown attempts against that target during their current stay.\n\nTo determine the outcome of the take down attempt, you and the target (played by the player to your left) need to roll dice. The target rolls a 20-sided die and adds the value of the attribute they are using to defend themselves. You also roll a 20-sided die and add the value of your equivalent attribute.\n\nIf you spent a number of days gathering intel, you also add this number to your total.\n\nWhoever has the highest total number wins. If it is a tie, the take down attempt was a failure.\n\nIf you fail, then you can either choose to gather more intel (thereby increasing your next take down roll), or continue attempting to take down your target for any remaining days that your target is in the location. Further take down attempts and intel gathering all occurs within the same turn. If you exceed the number of days that your target is staying in the current location, you lose the bounty, and must return the character card and bounty location card to the bottom of the deck.\n\nAssassinating your target:\n\nIf you are successful in your takedown attempt, you can choose to assassinate your target. Choosing to do this means you add the character card to your collection of faces, and their attributes are added to your total. Once you successfully assassinate your target, you must return the location card to the appropriate pile. You can only hold one bounty at a time and must either abandon or complete the bounty before picking up another one.\n\nIf you have an assassination weapon card, you can choose to play it to help you with your assassination. Playing this type of card will unlock your target’s special ability for you to use in the game (see Character Abilities table). An assassination weapon card can only be used against one target, so once you have assassinated your target, the card must be returned to the appropriate pile.\n\nIn total, you may hold up to 7 low tier characters and up to 4 high tier characters. You may either discard unwanted faces, or trade them with other players. Discarding a character card also means you lose that character’s attributes and special ability.\n\nBlackmailing your target:\n\nIf you are successful in your takedown attempt, you can choose to spare your target and instead blackmail them out of a resource of your choice. The amount of resources you receive is determined by the roll of a die. For a low tier character you roll the 10-sided die, and for a high tier character you roll the 20-sided die. Multiply your roll by 500 to determine the amount of your selected resource you gain.\n\nOnce you have gained your resources, return the character card to the bottom of the deck."
    },
    {
      "num": "3.2",
      "title": "Raid",
      "page": 4,
      "text": "If you land on a raid space, you can attempt a raid on the nearest city in order to steal gold. You can attempt the raid whilst the other players are taking their next turn. There are five different areas of the city that you can raid, each requiring a different attribute: magic, intelligence, combat, stealth,\nand cunning:\n\n• Magic allows you to cast a spell that summons demonic visions into the minds of the priestesses\nof the city’s temple, allowing you to enter their treasury undetected.\n•   Intelligence allows you to locate and disarm the traps that protect the royal repository, which is\nhidden beneath the palace.\n•   Combat allows you to incapacitate the guards who are protecting the city’s vault.\n•   Stealth allows you to sneak through the markets, where you pickpocket local merchants.\n•   Cunning allows you to impersonate a servant and walk past the royal sentries into the queen’s\nbedchambers, where you can steal her jewellery.\n\nYou must roll the 10-sided and 20-sided dice together and sum their values to try and match or beat the required roll for your chosen area. The required roll is determined by subtracting the level of your attribute from 30. However, the minimum required roll is always 10. Now you have worked out your required rolls, you can decide which area of the city you would like to attempt to raid first: the temple, the repository, the vault, the market, or the royal bedchambers. If you are successful, you can choose to walk away with your winnings or attempt to raid another area in the hope of stealing more gold. You cannot attempt to raid an area you have already visited.\n\nIf you fail to raid an area, you are set upon by the city guards and must flee the city empty-handed. On your next turn, you must continue with your travels and cannot reattempt a raid on that turn. The amount of gold stolen depends on how many areas you successfully raided:\n\n•   One area raided:               500 gold\n•   Two areas raided:              1500 gold\n•   Three areas raided:            3000 gold\n•   Four areas raided:             5000 gold\n•   All five areas raided:         7500 gold"
    },
    {
      "num": "3.3",
      "title": "Resources",
      "page": 4,
      "text": "If you land on one of these spaces, you receive 1000 of the associated resource (Gold, Wood, Stone and Food).\n\nSettlements in your network can increase how many resources you gain. Multiply the base 1,000 resources by the number of Settlements in your network, with your Stronghold counting as one additional network location. If you do not yet have a Stronghold or any Settlements in your network, you still receive the minimum 1,000 resources. For example, if you land on the wood space whilst you have a Stronghold and 2 Settlements in your network, you receive 3,000 wood."
    },
    {
      "num": "3.4",
      "title": "Foes",
      "page": 5,
      "text": "There are 4 spaces where you encounter a foe. To escape, you must defeat your encountered foe. Only one attribute will help you, and the helpful attribute is predetermined, depending on the foe.\nThe four spaces, and associated attributes are as follows:\n\n•   White Walkers:                   Stealth\n•   King’s Road Thieves:             Cunning\n•   Witch from the East:             Magic\n•   Bear Attack:                     Combat\n\nTo determine the outcome of the encounter, you and the foe (played by the player to your left) need to roll dice. You roll a 10-sided die and add your appropriate attribute level to it. The foe rolls a 20-sided die. Whoever has the highest total number wins. If you are not successful or it is a tie, the foe lashes out and injures you. This results in you missing your next turn whilst you heal."
    },
    {
      "num": "3.5",
      "title": "Iron Bank Tax & Brotherhood Without Banners",
      "page": 5,
      "text": "There are also two spaces where loss is inescapable. The Iron Bank Tax space, where you lose 4000 gold; and the Brotherhood without Banners space, where you lose 1500 of each of the other resources. If you cannot pay the tax to the Iron Bank or don’t have enough resources for the Brotherhood without Banners, you are sent to the prison at Castle Black and lose as many resources as you can afford to give."
    },
    {

      "text": "There are two captured spaces. If you land on one of these spaces, you are immediately sent to prison. If you do not currently hold a bounty, you are sent to the prison at Castle Black. However, if you do have a current bounty, you are sent to the prison of the bounty location. You can indicate that you are in prison by placing your game piece in the purple banner at the top of the space. Whilst in prison, you lose track of the whereabouts of your target. You must therefore return the bounty location card to appropriate pile and go to your Little Birds to find your target’s new location.\n\nTo escape prison, you must either pay 2,000 gold to the prison guard or attempt to escape by rolling two 6-sided dice and rolling a double. You must decide which method you are using before rolling. If you do not have enough gold, you must attempt to roll a double. You may make one escape attempt on each of your turns. If you have not rolled a double after three attempts, you remain in prison for the rest of that turn and automatically escape at the start of your following turn. Once you escape, your turn immediately continues as normal and you may make your movement roll."

    {

      "title": "Markets",

      "text": "There are two market spaces (Northern and Southern), where players may trade resources at fixed rates. These rates are described by Tables 1 and 2 in the companion app."
    },
    {

      "title": "Weirwood Tree",
