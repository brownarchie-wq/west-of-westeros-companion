    {
      "num": "7.1",
      "title": "General Item Rules",
      "page": 11,
      "text": "Carrying Items:\nWhen you first obtain an item that has not yet been completed, you carry it with you as you travel. Whilst carrying an incomplete item, it may be lost as a result of a shipwreck, confrontation, or another game effect that causes you to drop an item. You may carry any number of incomplete items at the same time.\n\nCheckpointing Items:\nOnce you have obtained an incomplete item, you may take it to your stronghold to establish a checkpoint before continuing its quest. Once an item has been checkpointed, you may collect it from your stronghold and continue carrying it towards any location required to complete or activate it.\n\nCheckpointing an item is optional. You may instead take an item directly towards its next quest or activation location without first visiting your stronghold. Doing so is quicker, but carries a greater risk if the item is subsequently lost.\n\nIf you lose an incomplete item that has previously been checkpointed, it returns to your stronghold. You must collect it from your stronghold before you can continue its quest. If you lose an incomplete item that has not previously been checkpointed, it returns to its original acquisition location and you must obtain it again before continuing its quest.\n\nOnce your stronghold has been upgraded into a Fortress, the rules for checkpointing items change as described in Section 8.2.\n\nCompleting and Securing Items:\nOnce an item has been completed, it is automatically secured at your stronghold or Fortress. You do not need to physically return to your stronghold after completing or activating an item. A secured item continues to provide its ability as normal. Securing an item represents the completion and safekeeping of that item for game purposes; it does not prevent any abilities associated with the item from continuing to affect your character.\n\nSecured items cannot normally be dropped through shipwrecks or confrontations. However, they remain vulnerable to being stolen during an attack on your stronghold, as described in Section 5.\n\nDropping Items:\nYou may be forced to drop an incomplete item that you are carrying if you are shipwrecked, successfully confronted by another player, or affected by another rule or ability that causes you to drop an item. If the dropped item has previously been checkpointed, it returns to your stronghold. If it has not previously been checkpointed, it returns to its original acquisition location and must be obtained again.\n\nCompleted items are secured and therefore cannot normally be dropped. The Dragon Egg is an exception to these rules. It cannot be checkpointed or secured and, if dropped, returns to the Dragon's Lair as described in Section 8.8."

      "title": "Direwolf",
      "page": 13,
      "text": "To obtain a Direwolf, you must first visit The Land of Always Winter, where you will attempt to gain the trust of a wild Direwolf. Your Cunning level determines how easily you are able to approach the Direwolf. Refer to the table below to determine the roll required on the 20-sided die:\n\nPlayer Cunning Level      Up to 19             20 or above\n\nRequired Roll        16+                    8+\n\nBefore making your taming attempt, you may choose to offer the Direwolf food to improve your chances of success. For every 1,000 food you offer, add +2 to your taming roll. You must decide how much food to offer before rolling the die, and the food is spent regardless of whether your attempt is successful.\n\nAny bonus gained from offering food applies only to the taming attempt made on that turn. If you are unsuccessful, you may make another attempt on your next turn, but any previous food bonus is lost and you must offer additional food if you wish to receive another bonus.\n\nOnce you successfully approach the Direwolf, take the Direwolf item. However, the Direwolf is not yet fully tamed and its special ability does not take effect. You must first tame your Direwolf, by gaining two Bond Points. A Bond Point is gained by completing one of the following feats whilst\nthe untamed Direwolf is travelling with you:\n\n• Defeat a Foe on the outer section of the board.\n• Successfully complete a bounty take down.\n• Successfully establish influence in a Settlement.\n• Successfully confront another player.\n\nYour two Bond Points must be gained from two different feats. For example, defeating two different Foes would only provide one Bond Point, whereas defeating a Foe and successfully confronting another player would provide two.\n\nOnce you have gained your second Bond Point, the Direwolf becomes fully tamed and its ability is immediately activated. Your Direwolf becomes your travelling companion, protecting you from enemies on the road. If you encounter a Foe space on the outer section of the board, the Foe is automatically defeated by your Direwolf and you can continue unscathed."
    },
    {
      "num": "8.4",
      "title": "Gemstone",
      "page": 14,
      "text": "There are 6 different types of gemstones: five of them embody each of the five attributes (these gemstones increase the associated attribute by 10 levels), and there is one protean gemstone (which equally increases all attributes by 2 levels). The colours of each gemstone are as follows:\n\n• Magic:             Pink\n• Intelligence:      Blue\n• Combat:            Red\n• Stealth:           Black\n• Cunning:           Green\n• Protean:           Clear\n\nTo obtain a gemstone, you must hire a salvage crew who will retrieve it for you. You can hire a crew from any of the ports around the outer board. Once you have assembled your crew, you must sail them to the whirlpools around Dragon Island, where they will retrieve your gemstone.\n\nYou pay your crew for the amount of time they spend aboard your ship, so the longer you take, the more expensive the venture. Whilst sailing with a crew, keep a tally of the number of turns you spend with them on board. This includes the turns spent moving over land, or when shipwrecked, and also the turns spent returning them to one of the ports on the outer board once you have got your gemstone. You can use this tally to determine what you owe them at the end of your voyage. You pay your crew with resources of your choosing, so long as the total matches the price they charge. If you cannot afford the full amount when the crew returns to port, you must pay as much as you can. Any unpaid amount becomes a debt to the crew. Until this debt has been cleared, any resources you subsequently gain are automatically paid to the crew, reducing the debt by the same amount. You may continue the Gemstone quest while this debt remains outstanding.\n\nSalvage crews have varying degrees of experience, and the better ones will demand a higher price. To recover a gemstone, you must roll the 20-sided die above a certain number, and this number is determined by the experience level of your crew.\n\nExperienced Crew   Cost = 300 resources per turn   Required roll = 13+\n\nInexperienced Crew     Cost = 100 resources per turn   Required roll = 18+\n\nOnce you are positioned over one of the whirlpools, you may continue to roll the 20-sided die until you find a gemstone (i.e. keep rolling all in one turn). Remember to count how many rolls it takes you to recover a gemstone, as this will be added to the number of turns you have taken.\n\nOnce you roll the required number or higher, you can then randomly select one of the gemstones. If you do not wish to keep your selected gemstone, you may return it to the whirlpool and continue to search for the gemstone you desire on your next turn.\n\nThe gemstone is activated by visiting the Priestess from Asshai, who will enchant it. Only once it has been activated will the associated attribute(s) be added to your total."
    },
    {
      "num": "8.5",
      "title": "Knights of the Vale",
      "page": 15,
      "text": "To gain the allegiance of the Knights of the Vale, you must return a high value prisoner to House Arryn. These escaped prisoners are hiding out in Settlements on the inner map. To flush one out, you must successfully establish influence in a Settlement and withdraw an escaped prisoner card. This triggers the prisoner to break from cover and attempt to run away. You must give chase to catch them.\n\nTo start, place one of the transparent turquoise cubes on the settlement where you found the escaped prisoner. The direction that the prisoner runs is determined by rolling the 6-sided die, in the same manner as with a storm. On the first turn, you roll the 20-sided die and count out the number of spaces that they travel in the specified direction. You then travel as normal to try and catch them. On subsequent turns, you again determine the direction they travel, then roll two 6-sided dice to determine how far they travel. You must chase them down and land on a tile next to them (whilst in the same terrain as them) in order to apprehend them. Note that the escaped prisoner can travel directly from water to land and vice versa without waiting. If the prisoner enters a neutral Settlement, a Settlement in another player’s network, or another player’s Stronghold, you lose them and need to find another escaped prisoner. If they enter a Settlement in your network or your Stronghold, you capture them. The escaped prisoner is unaffected by all other special-tile effects (e.g. whirlpools, ruins, etc.).\n\nOnce you catch your prisoner, you take the transparent turquoise cube. You must return it to House Arryn by visiting the Sky Cell space on the outer board. As a thank you for returning the prisoner, Lady Arryn pledges her Knights of the Vale to you, and so you receive the horse item. Once you have the Knights of the Vale on your side, you may call on them to carry out one Stronghold Attack against another player as described in Section 5. You do not need to assemble Hired Blades for this attack and it does not cost you any food."
    },
    {
      "num": "8.6",
      "title": "Iron Ship",
      "page": 15,
      "text": "Upgrading your boat into an Iron Ship costs 15,000 gold and 25,000 wood. This upgrade is done by visiting the Euron’s Shipyard on the outer section of the board. Once you have obtained your Iron Ship item, you will be unaffected by storms."
    },
    {
      "num": "8.7",
      "title": "Valyrian Steel Sword",
      "page": 15,
      "text": "You must first obtain some dragon glass to infuse into your blade. To obtain a dragon glass shard, you must visit every tile in the ancient ruins. Remember, travelling too quickly in the ancient ruins will alert the stone men who will give you greyscale.\n\nOnce obtained, the shard is taken to Gendry’s Foundry, where he forges it into a Valyrian steel sword, earning you the Valyrian steel sword item. Once you have your Valyrian steel sword, you only need to be within 5 tiles of another player before you can confront them."
    },
    {
      "num": "8.8",
      "title": "Dragon Egg",
      "page": 15,
      "text": "The rarest and most difficult item to obtain is the dragon egg. There is only one dragon egg available, so once a player has stolen the egg, it is advisable that the other players try and confront them. Once you hatch your dragon egg you will become the dominant force in the west, and you win the game.\n\nThe dragon’s lair is located on a volcanic island at the centre of the map. To enter the Dragon's Lair, you must have completed all seven other item quests, including upgrading your Stronghold into a Fortress. You must pass the whirlpools that surround the island by landing on one of them and rolling a 1, 2, 3, or 4 on the 6-sided die.\n\nOnce successfully past the whirlpools, travelling onto the volcanic island takes one turn. Now you are on the island, you must try and obtain the egg. To do this, you must pass the mother dragon. Once you are facing the dragon, you have one initial attempt to steal the egg. For this attempt, you must roll a 20 on the 20-sided die. If you are unsuccessful on this attempt, you may have one more attempt per attribute that is level 30 or above. For each of these attempts, you only need to roll a 13 or above to defeat the dragon. If you are still unsuccessful after all subsequent attempts, the mother dragon picks you up and flies you back to your Fortress, from which you can embark on your journey to face the dragon once again. However, your ship is damaged in the process, requiring you to make repairs.\n\nOnce you have successfully stolen the egg, your final action will be to hatch it in the Dragon Pit on the outer board. The Egg cannot be checkpointed or secured at your Fortress and, if dropped, returns to the Dragon's Lair.\n\nOnce you have hatched your egg, you are the winner of the game, and the ruler of the West."
    }

    return bountyStageShell('Explore the ruins','Your next movement','Roll one physical d6. You may revisit tiles during the same turn. Select its result below.',smallDieChoices('ruins-roll',s.roll,!!s.roll,1,6)+'<p class="small muted">'+(totals().stealth>=15?'Your Stealth is 15 or above: only a 6 alerts the Stone Men.':'A 5 or 6 alerts the Stone Men, who give you Greyscale.')+(state.statuses.greyscale?' Greyscale is active: halve movement and round up.':'')+'</p><button class="primary wide-action" data-action="ruins-resolve" '+(!s.roll?'disabled':'')+'>Determine movement & danger</button>');
  }

  function strongholdCheckpointHtml(){
    var formed=state.settlementFormed||state.items.city.completed,keys=carriedCheckpointItems(),pending=keys.filter(function(k){return !state.items[k].checkpointed;}),names={secrets:'Secrets of the Hidden World',direwolf:'Untamed Direwolf',gemstone:'Gemstone',sword:'Dragon glass'},home=state.items.city.completed?'Fortress':'Stronghold';
    var content='<div class="checkpoint-box"><h3>Checkpoint carried Items</h3><p class="small muted">Visit your own '+home+' to set a return point for incomplete Items. You can then keep carrying them. If dropped later, collect them from this checkpoint before continuing their quests.</p>';

    if(pending.length)content+='<button class="'+(strongholdVisitConfirmed?'status-toggle active':'ghost')+' wide-action" data-action="stronghold-arrival" aria-pressed="'+strongholdVisitConfirmed+'">'+(strongholdVisitConfirmed?'Arrival confirmed ✓':'I’m at my '+home)+'</button><p class="tiny muted">Confirm only when your piece is at your own '+home+', rather than another Settlement in your network.</p><button class="primary wide-action" data-action="stronghold-checkpoint-all" '+(!strongholdVisitConfirmed?'disabled':'')+'>Checkpoint all '+pending.length+' carried Item'+(pending.length===1?'':'s')+'</button>';
    else if(keys.length)content+='<p class="small muted">All carried Items already have checkpoints'+(state.items.city.completed?' through your Fortress':'')+'.</p>';
    return content+'</div>';
  }
  function openGuideModal(titleText,html){openModal(titleText,'<div class="guide-label">Gameplay guide</div>'+html);modal.classList.add('guide-mode');}
  function bountyRequiredRoll(){
    var c=currentBountyCharacter(),a=chosenBountyDefenceAttr(c);if(!c||!a||!state.bounty.targetRollSet)return null;
    return Math.floor(num(state.bounty.targetD20)+num(c.attrs[a])-num(totals()[a])-num(state.bounty.intel))+1;
  }
  function combinedBountyAttemptHtml(){
    var b=state.bounty,c=currentBountyCharacter(),attr=chosenBountyDefenceAttr(c),choices=bountyDefenceChoices(c),remaining=bountyDaysRemaining(),required=bountyRequiredRoll();
    var summary='<div class="workflow-summary"><div><span>Days left in this location</span><strong>'+remaining+'</strong></div><div><span>Intel bonus</span><strong>+'+b.intel+'</strong></div></div>';
    if(remaining<=0)return bountyStageShell('Bounty expired','The target has left','Return the target and location cards to their decks.','<button class="primary wide-action" data-action="bounty-expire-clear">Clear lost bounty</button>');
    if(b.lastResult==='failure')return bountyStageShell('Attempt failed','Decide your next attempt','The defending attribute stays fixed for the rest of this target’s stay.',summary+'<div class="stage-actions"><button class="primary" data-action="bounty-next-attempt">Attempt again</button>'+(remaining>1?'<button data-action="bounty-retry-intel">Gather 1 more day of Intel</button>':'')+'</div>');
    if(!b.targetRollSet)return bountyStageShell('Stage 5 of 6','Reveal defence','Reveal the defending attribute and defence value before rolling your physical d20. The first reveal selects the defending attribute and a value from 1–20; later attempts keep the same attribute.',summary+(b.defenceReady&&attr?'<p class="small muted">Defending attribute retained: '+ATTR_LABEL[attr]+'.</p>':'')+'<button class="primary wide-action" data-action="bounty-reveal-attempt">Reveal defence value</button>');
    var details='<div class="workflow-summary"><div><span>Target’s selection</span><strong>'+num(b.targetD20)+'</strong></div>'+(attr?'<div><span>Target’s '+ATTR_LABEL[attr]+'</span><strong>'+num(c.attrs[attr])+'</strong></div><div><span>Target total</span><strong>'+(num(b.targetD20)+num(c.attrs[attr]))+'</strong></div><div><span>Your '+ATTR_LABEL[attr]+' + Intel</span><strong>'+num(totals()[attr])+' + '+num(b.intel)+'</strong></div>':'')+'</div>';
    if(choices.length>1&&!attr)details+='<p class="small muted">The target’s highest attribute is tied. Choose which tied attribute defends before rolling your die.</p>'+choiceButtons(choices,b.defenceAttr,'bounty-def-attr',function(a){return ATTR_LABEL[a]+' '+c.attrs[a];},'attr-choice');
    if(b.tier==='Low'&&hasAbility('Valar Morghulis')&&!b.defenceReselectUsed&&num(b.attemptsUsed)===0)details+='<button class="ghost wide-action" data-action="bounty-reselect-defence">Use Valar Morghulis · select defence again</button>';
    if(required!==null){
      details+=(required>1&&required<=20?diceReferenceHtml(['d20']):'')+'<div class="big-target"><span>Your physical d20 needs</span><strong>'+(required<=1?'Any result':required>20?'More than 20':required+'+')+'</strong></div><p class="small muted">'+(required<=1?'Every d20 result beats this target. Confirm the success below.':required>20?'This attempt needs '+required+' or higher, so no d20 result can succeed. Record the failed attempt.':'Roll your physical d20 now. A '+required+' or higher succeeds; '+(required-1)+' or lower fails. Your attribute and Intel are already included.')+'</p><div class="choice-grid two-choice"><button class="primary" data-action="bounty-record-result" data-result="success" '+(required>20?'disabled':'')+'>I succeeded</button><button class="danger" data-action="bounty-record-result" data-result="failure" '+(required<=1?'disabled':'')+'>I failed</button></div>';
    }
    return bountyStageShell('Stage 5 of 6','Make your physical takedown attempt','The target’s defence is set. Resolve the attempt on the table, then record whether you succeeded.',summary+details);
  }
  function startNextBountyAttempt(gather){
    var b=state.bounty;if(b.lastResult!=='failure'||bountyDaysRemaining()<1)return;
    if(gather){if(bountyDaysRemaining()<2)return;b.intel++;}
    b.stage='roll';b.targetRollSet=false;b.playerRollSet=false;b.lastResult='';closeModal();commit(false);render();
  }
  function recordPhysicalBountyResult(success){
    var b=state.bounty,required=bountyRequiredRoll();if(['defence','roll'].indexOf(b.stage)<0||required===null||b.lastResult==='failure'||bountyDaysRemaining()<1)return;
    if(success&&required>20||!success&&required<=1)return;
    b.playerRollSet=false;
    if(success){b.lastResult='success';b.stage='outcome';awardDirewolfBond('Bounty takedown');commit(true,'Bounty takedown succeeded on the physical d20.');toast('Takedown successful. Choose assassination or blackmail.','good');}
    else{b.lastResult='failure';b.attemptsUsed=num(b.attemptsUsed)+1;b.targetRollSet=false;b.stage=bountyDaysRemaining()>0?'roll':'expired';commit(true,'Bounty takedown failed; one day used.');toast(bountyDaysRemaining()>0?'Attempt failed. Choose whether to try again or gather more Intel.':'The target’s stay has ended. Return both bounty cards.','warn');}
  }

  function openArtworkManager(firstRun){

  }
  var WALKTHROUGH = [
    {title:'Welcome to West of Westeros',html:'<p>Welcome, assassin. Build your power through bounties, alliances and dangerous journeys across the West.</p><p>This companion keeps track of your character and helps resolve the events you encounter. Your pieces, cards and dice bring the adventure to life on the physical board.</p><p>Begin with this short introduction to the game.</p>'},
    {title:'The aim of the game',image:'guide-overview',html:'<p>You are a lone assassin building power and influence across the West. Your long-term goal is to complete the <strong>seven prerequisite Item quests</strong>, take the Dragon Egg from the Dragon’s Lair, and hatch it at the Dragon Pit.</p><p>There is no fixed route. Bounties, resources, your network and Item quests can be pursued in the order that best suits where you are on the board.</p>'},
    {title:'Moving around the board',image:'guide-movement',html:'<p>You begin on the <strong>Little Birds</strong> space nearest to you. On the outer board, choose your direction and whether to roll one or two d6 before rolling. Two dice means moving the exact total; one die normally lets you stop anywhere up to the roll.</p><p>Ports take you to the inner board, where movement changes between land and water. The app will surface the detailed rule when a special movement situation matters.</p>'},
    {title:'Hunting bounties',image:'guide-bounty',html:'<p>Little Birds give you a <strong>target</strong> and a <strong>location</strong>. Travel there, find out how many days the target will remain, then spend those days gathering intel or attempting a takedown.</p><p>After a successful takedown, assassinate the target to gain their Face and attributes, or blackmail them for resources. The Bounties page handles the calculations and keeps the current target together in one place.</p>'},
    {title:'Stronghold and network',image:'guide-network',html:'<p>On the inner board you can establish one <strong>Stronghold</strong>, your hidden base of operations. Bring an incomplete Item here to set a checkpoint: if dropped later, it returns here for collection instead of its original location. You can keep carrying it after checkpointing. Completed Items become secured automatically. Your Stronghold also counts as a network location for resource payouts.</p><p>You can also establish influence in <strong>Settlements</strong>. Each Settlement and your Stronghold count as one share of 1,000 of the resource you land on at a Resource Space (minimum payout 1,000). For example, two Settlements plus a Stronghold give 3,000 per Resource Space before ability bonuses.</p>'},
    {title:'Items and other players',image:'guide-items',html:'<p>The seven prerequisite Items are separate quests and can be completed in any order. Some incomplete Items are carried and may be checkpointed at your Stronghold; once completed, Items are secured automatically unless their own rule says otherwise.</p><p>You can also confront other players on the inner board and, later, launch Stronghold Attacks. Each assistant gives you only the instructions needed for the current stage.</p>'},
    {title:'Winning the game',image:'guide-egg',html:'<p>Once all seven prerequisite Item quests are complete, you may enter the <strong>Dragon’s Lair</strong> and attempt to take the Dragon Egg.</p><p>The Egg cannot be checkpointed or secured. If it is dropped it returns to the Lair. Reach the Dragon Pit on the outer board and hatch the Egg to win.</p>'},
    {title:'First, set up your character',html:'<p>Your first task is to <strong>set up your character</strong>. On the Game page, choose <strong>Set up character</strong>, enter your name and distribute exactly <strong>15 starting points</strong> across the five attributes.</p><p>Once you confirm your character, a short opening-game guide will explain your first bounty and how to take your first moves.</p>'}
  ];

  var CONTEXT_TUTORIALS = {
    bounty:{title:'Bounties',query:'3.1 Little Birds',image:'tip-bounty',html:'<p class="context-guide-copy">Little Birds give you a target and a location. Travel to that city, then roll a d10 to find out how many days the target will remain there. Each available day can either be spent gathering intel, which adds +1 to your later takedown rolls, or making a takedown attempt.</p><p class="context-guide-copy">Low-tier targets defend with one attribute chosen by a d6; high-tier targets use their highest attribute. You and the target then roll d20 + the matching attribute, with any intel added to your total. You must beat the target; a tie fails. After a successful takedown, assassinate to gain the Face and its attributes, or blackmail the target for resources.</p>'},
    items:{title:'Item quests',query:'7.1 General Item Rules',image:'tip-items',html:'<p class="context-guide-copy">The seven prerequisite Items are separate quests and can be pursued in any order. Most incomplete Items travel with you and can be lost through certain effects, so you may take them to your Stronghold to establish a checkpoint before continuing the quest.</p><p class="context-guide-copy">Once an Item is completed it is normally secured automatically at your Stronghold or Fortress and its ability becomes active. The Fortress and Iron Ship are permanent upgrades, while the Dragon Egg follows its own final-objective rules.</p>'},
    stronghold:{title:'Your Stronghold',query:'4.2 Forming your Stronghold',image:'tip-stronghold',html:'<p class="context-guide-copy">Your Stronghold is your hidden base on the inner board. You may establish only one, on a valid inland tile within 15 tiles of the Dragon’s Lair and at least three tiles from another player’s Stronghold.</p><p class="context-guide-copy">Bring a carried incomplete Item here to set its checkpoint. You may keep carrying it afterwards. If it is dropped, it returns here instead of its original location, and you must collect it before continuing its quest.</p><p class="context-guide-copy">Completed Items are secured automatically: their abilities stay active and ordinary shipwrecks or confrontations cannot make you drop them. Secured Items can still be stolen in a Stronghold Attack. Your Stronghold also counts as one network location for Resource Space payouts, and is normally where you declare a Stronghold Attack.</p>'},
    settlement:{title:'Settlement influence',query:'4.3 Settlements',image:'tip-settlement',html:'<p class="context-guide-copy"><strong>Control Settlements to collect more resources from Resource Spaces.</strong> Each Settlement in your network counts towards your Resource Space payout: 1,000 of the resource you land on per Settlement, plus one share if you have established your Stronghold. The minimum payout is 1,000 even with no network. For example, two Settlements and a Stronghold give 3,000 whenever you land on a Resource Space, before any ability bonuses.</p><p class="context-guide-copy">Pay 500 Gold before trying a neutral Settlement, or 1,000 Gold before trying to take another player’s Settlement. Roll your d10 + Combat against the Settlement’s d20 + your Suspicion. You must beat its total; a tie fails. The Settlement’s value can be selected automatically in the assistant or entered from a physical d20.</p><p class="context-guide-copy">On success, place your coloured cube over the Settlement (replacing the previous owner’s cube if needed). It now counts towards every future Resource Space payout. A neutral Settlement also gives a red reward card; a takeover offers the listed choice of reward. Red resource cards give Wood, Stone and Food, excluding Gold.</p>'},
    prison:{title:'Prison',query:'3.6 Captured',image:'tip-prison',html:'<p class="context-guide-copy">Any bounty you are carrying is lost when you are sent to prison: return its target and location cards to their decks. After escaping, visit Little Birds for a new bounty.</p><p class="context-guide-copy">While imprisoned you cannot move. On each of your turns, either pay 2,000 Gold to the guard or try to escape by rolling a double on two d6. Decide which method you are using before rolling.</p><p class="context-guide-copy">If three double attempts fail, you remain imprisoned for that turn and escape automatically at the start of your following turn.</p>'},
    shipwreck:{title:'Shipwrecks',query:'4.4 Shipwrecks',image:'tip-shipwreck',html:'<p class="context-guide-copy">When you explore a Shipwreck, draw one physical card from the Shipwreck deck. Most cards give Gold; the remaining cards are assassination weapons.</p><p class="context-guide-copy">An assassination weapon is kept until you use it on a successful assassination. Using one unlocks that Face’s special ability, and the weapon is then returned to the Shipwreck deck.</p>'},
    foe:{title:'Foe encounters',query:'3.4 Foes',image:'tip-foe',html:'<p class="context-guide-copy">Each Foe tests one specific attribute: White Walkers use Stealth, King’s Road Thieves use Cunning, the Witch from the East uses Magic, and the Bear Attack uses Combat.</p><p class="context-guide-copy">First reveal a random Foe value from 1–20, or use a physical d20. Then roll your physical d10 and add the relevant attribute. You must finish with the higher total; a tie or lower result means you are injured and miss your next turn.</p>'},
    confrontation:{title:'Confronting another player',query:'6 Confronting Another Player',image:'tip-confrontation',html:'<p class="context-guide-copy">On the inner board, you may confront another player when you are in range and they are not protected inside their Stronghold or a Settlement in their network. Both players roll a d6; matching numbers mean the confrontation succeeds.</p><p class="context-guide-copy">A successful initiator may steal a Face, steal d6 × 1,000 of one resource, or force one carried incomplete Item to be dropped. The resulting confrontation cooldown depends on whether the confrontation succeeded and who initiated it.</p>'},
    strongholdAttack:{title:'Stronghold Attacks',query:'5 Attacking Another Player’s Stronghold',image:'tip-stronghold-attack',html:'<p class="context-guide-copy">To launch a normal Stronghold Attack, assemble Hired Blades and declare the attack while at your Stronghold. Travel to the defender’s Stronghold; if they return before you arrive, the attack ends empty-handed.</p><p class="context-guide-copy">If you arrive while they are away, you begin taking resources each turn for up to 15 of your turns. If the defender returns during that time, you duel with matching d6 rolls for a secured Item. If they remain away for all 15 turns, you may take an eligible secured Item without the duel.</p>'},
    direwolf:{title:'Direwolf quest',query:'8.3 Direwolf',image:'tip-direwolf',html:'<p class="context-guide-copy">At The Land of Always Winter, your Cunning determines the d20 roll needed to approach a Direwolf. Before rolling, you may offer Food; every 1,000 Food gives +2 to that attempt and is spent whether you succeed or fail.</p><p class="context-guide-copy">After a successful approach, the Direwolf is not fully tamed. Gain two Bond Points from two different feats: defeat a Foe, complete a bounty takedown, establish Settlement influence, or confront another player. The second different Bond activates the Direwolf.</p>'},
    gemstone:{title:'Gemstone quest',query:'8.4 Gemstone',image:'tip-gemstone',html:'<p class="context-guide-copy">Hire either an experienced or inexperienced salvage crew at a port, then take them to the whirlpools around Dragon Island. You pay for every travel turn, every search roll, and the journey back to a port.</p><p class="context-guide-copy">Search by rolling the required d20 result until a Gemstone is found. You may reject it and continue searching next turn. Once kept, return the crew and settle their bill using resources of your choosing. If you cannot pay the full bill, the unpaid amount becomes a debt and future resources you gain go to the crew until it is cleared. Then take the Gemstone to the Priestess from Asshai to activate it unless a special ability changes that step.</p>'},
    knights:{title:'Knights of the Vale quest',query:'8.5 Knights of the Vale',image:'tip-knights',html:'<p class="context-guide-copy">An escaped-prisoner reward starts a chase from the Settlement where the prisoner was found. Reveal the first prisoner movement in the assistant: it selects one of six directions and a distance of 1–20 tiles. On later turns, reveal a new direction and a distance found by adding two independent 1–6 selections.</p><p class="context-guide-copy">Catch the prisoner by becoming adjacent while in the same terrain. If they enter a neutral or enemy network location you lose them; if they enter your network or Stronghold you capture them. Return the prisoner to the Sky Cell to gain the Knights of the Vale and one free Stronghold Attack.</p>'},
    dragonEgg:{title:'The Dragon Egg',query:'8.8 Dragon Egg',image:'tip-egg',html:'<p class="context-guide-copy">The Dragon Egg is the final objective and can only be attempted after all seven prerequisite Item quests are complete. Pass one of the whirlpools surrounding Dragon Island, enter the Lair, then face the mother dragon.</p><p class="context-guide-copy">Your first attempt requires a natural 20. If it fails, each attribute at 30 or above gives one further 13+ attempt. Once taken, the Egg must be carried to the Dragon Pit to win; it cannot be checkpointed or secured and returns to the Lair if dropped.</p>'}
  };

  var PAGED_GUIDES = {
    stronghold:{title:'Your Stronghold',query:'4.2 Forming your Stronghold',pages:[
      {title:'Choose your base',html:'<p>You may establish <strong>one Stronghold</strong>. Choose a tile fully surrounded by land, within 15 tiles of the Dragon’s Lair and at least three tiles from another player’s Stronghold.</p><p>Move there on the physical board, place your Stronghold marker, then confirm its establishment in the assistant.</p>'},
      {title:'Increase resource income',html:'<p>Your established Stronghold counts as one location in your resource network. Each controlled Settlement adds another.</p><p>On a Resource Space, collect <strong>1,000 of that resource per network location</strong>, with a minimum payout of 1,000, before ability bonuses.</p>'},
      {title:'Checkpoint a carried Item',html:'<p>Visit your Stronghold while carrying an unfinished Item and set its checkpoint. You may continue carrying it afterwards.</p><p>If you drop it before completing the quest, it returns to your Stronghold instead of its original location. Travel back to collect it before continuing. <strong>The Dragon Egg cannot be checkpointed.</strong></p>'},
      {title:'Secure completed Items',html:'<p>Finishing an Item quest automatically secures the Item and activates its ability. You do not need to return home afterwards.</p><p>Ordinary shipwrecks and confrontations cannot make you drop secured Items, although eligible Items can be stolen in a <strong>Stronghold Attack</strong>.</p>'},
      {title:'Upgrade and defend your base',html:'<p>Visit <strong>Bran the Builder</strong> to upgrade your Stronghold into a Fortress. The Fortress automatically checkpoints unfinished Items that can be checkpointed.</p><p>You normally declare Stronghold Attacks from your own base. The separate Stronghold Attack guide explains hiring blades, travelling to the defender and resolving the attack.</p>'}
    ]},
    settlement:{"title": "Settlement influence", "query": "4.3 Settlements", "pages": [{"title": "Grow your resource income", "html": "<p><strong>Controlling Settlements increases what you collect from Resource Spaces.</strong> Each Settlement in your network and your established Stronghold count as one share of 1,000 of the resource you land on. The minimum payout is 1,000.</p><p>For example, two Settlements plus your Stronghold give <strong>3,000 per Resource Space</strong>, before ability bonuses.</p>"}, {"title": "Pay before the attempt", "html": "<p>Pay <strong>500 Gold</strong> to try a neutral Settlement, or <strong>1,000 Gold</strong> to try to take another player’s Settlement. The Gold is spent even if you fail or abandon the attempt.</p>"}, {"title": "Overcome its defence", "html": "<p>First reveal the Settlement’s defence value and add your <strong>Suspicion</strong> to it. Then roll your physical d10 and add your <strong>Combat</strong>.</p><p>Your total must be higher; a tie fails. If you fail to take over another player’s Settlement, wait five turns before trying that Settlement again.</p>"}, {"title": "Claim the Settlement and reward", "html": "<p>Place your coloured cube over the Settlement, replacing the previous owner’s cube where applicable. It now counts towards your future Resource Space payouts.</p><p>A neutral Settlement gives a red reward card: +500 or +1,000 each of <strong>Wood, Stone and Food</strong> (no Gold), or an escaped prisoner. A takeover offers the choice shown in the assistant.</p>"}]},
    openingGame:{"title": "Your opening turns", "query": "2 Starting the Game", "pages": [{"title": "Place the resource drops", "html": "<p>Together, decide how many <strong>opaque red Resource Drop cubes</strong> to use. Divide them between the players, then each player places their share on resource tiles of their choice in the <strong>inner section of the board</strong>.</p><p>The tile underneath each cube determines which resource it contains. Leave the cubes there until someone explores the drop, then remove that cube after its resources have been collected.</p>"}, {"title": "Take your starting place", "html": "<p>Place your player token on the <strong>Little Birds space nearest to you</strong>. The youngest player takes the first turn, then play passes clockwise.</p><p>You receive your first bounty immediately, before setting off around the board.</p>"}, {"title": "Choose the first bounty", "html": "<p>Look at the <strong>top three low-tier character cards</strong> and choose one target. Then draw a <strong>purple bounty-location card</strong> to find out which city they are in.</p><p>Record these on the Bounties page. The next player may begin their turn while you choose the cards. Once you have your bounty, you can begin travelling towards its city.</p>"}, {"title": "Decide before rolling", "html": "<p>Before each outer-board movement roll, announce <strong>clockwise or anticlockwise</strong> and choose <strong>one d6 or two d6</strong>.</p><p>One die gives more control over where you stop; two dice can carry you further. Make both decisions before rolling.</p>"}, {"title": "Move your piece", "html": "<p>With <strong>two d6</strong>, add their results and move that exact number of spaces in your chosen direction.</p><p>With <strong>one d6</strong>, you may move any number of spaces up to the result. However, if the full roll lands on a <strong>red-banner detrimental space</strong>, you must land there rather than stopping short to avoid it.</p><p>Players may share a space and pass each other.</p>"}, {"title": "Resolve your landing", "html": "<p>Follow the space you land on. A Resource Space supplies resources; a Raid offers a chance to steal Gold; a Foe tests an attribute. Red-banner spaces include Foes, Brotherhood Without Banners, Iron Bank Tax and Captured.</p><p>Choose <strong>I landed on a space…</strong> on the Game page, then select the space to open its instructions or assistant.</p>"}, {"title": "When you reach the target", "html": "<p>At the city named on your bounty card, return to Bounties and confirm your arrival. Roll the <strong>d10</strong> to find out how long the target stays, then decide how many days to spend on Intel or takedown attempts.</p><p>The Bounty guide explains that sequence in detail. For now, choose your first target and location.</p>"}], "finalAction": "opening-bounty", "finalLabel": "Go to Bounties"},
    innerBoard:{"title": "Navigating the inner board", "query": "4.1 Movement", "pages": [{"title": "A Port gives you a choice", "html": "<p><strong>You do not have to enter the inner board.</strong> You may stay on the outer section and continue around it normally on your next turn.</p><p>If you choose to enter, wait until your <strong>next turn</strong>, roll for water movement and start counting from the water tile nearest your token. Ports let you move between the sections as often as you wish.</p>"}, {"title": "Sail across water", "html": "<p>For normal water movement, choose a <strong>d10 or d20</strong>. The result represents the wind and sets your maximum movement. Move in any direction, stopping after any number of tiles up to that result.</p><p>The d20 can take you further, but a <strong>19 or 20 starts a storm</strong>.</p>"}, {"title": "When a storm strikes", "html": "<p>Open the <strong>Storm assistant</strong> from I landed on a space… → Inner board. Select whether your movement die showed 19 or 20, then press <strong>Reveal storm movement</strong>.</p><p>The assistant selects a direction at random. After a 19, the distance is 1–6 tiles. After a 20, it adds two independent 1–6 selections. Move your piece using the revealed direction and distance.</p>"}, {"title": "Storms and shipwrecks", "html": "<p>At the map’s edge, reflect the storm’s direction and continue moving. If the storm carries you onto land, you become <strong>shipwrecked</strong> and drop any incomplete Items you carry, following their checkpoint rules.</p><p>Repairs cost <strong>2,000 Gold</strong>. Until you can pay, use only one d6 for water movement. The Iron Ship prevents storms from affecting you; other abilities may change repair costs.</p>"}, {"title": "Travel on land and cross the coast", "html": "<p>On normal land, roll the <strong>d20</strong>. Move in any direction and stop after any number of tiles up to the roll.</p><p>To switch between land and water, <strong>stop on a tile bordering the other terrain</strong>. On your next turn, roll the appropriate die and start counting from the adjacent tile of the new terrain.</p>"}, {"title": "Watch for whirlpools", "html": "<p>When you land on a whirlpool, open its assistant through <strong>I landed on a space…</strong> and select <strong>Reveal whirlpool outcome</strong>.</p><p>You have a two-in-three chance of crossing safely and continuing any remaining movement. Otherwise you are pulled under. Select <strong>Reveal whirlpool exit</strong>, count that many whirlpools clockwise around the map, excluding those around Dragon Island, and end your turn at the exit.</p><p>Secrets of the Hidden World lets you choose the exit instead.</p>"}, {"title": "Build a base and pursue quests", "html": "<p>You may establish one <strong>Stronghold</strong> on a tile fully surrounded by land, within 15 tiles of the Dragon’s Lair and at least three tiles from other Strongholds.</p><p>Influence Settlements to increase the resources you collect from Resource Spaces: each Settlement and your Stronghold count as one share of 1,000 of the resource you land on (minimum payout 1,000). Explore Shipwrecks for cards, and approach Resource Drops on adjacent tiles. Your <strong>Items</strong> page contains each quest and its current progress.</p><p>Use the physical board to choose your route. You can return to the outer section through a Port whenever it suits your plans.</p>"}], "finalAction": "port-summary", "finalLabel": "Back to Port"},
    bounty:{"title": "Bounties", "query": "3.1 Little Birds", "pages": [{"title": "1. Choose your target", "html": "<p>At a <strong>Little Birds</strong> space, look at the <strong>top three low-tier character cards</strong> and select one target. You may choose high tier once all five attributes are level 10 or above; high tier gives the top card only, unless an ability offers a choice.</p><p>If you decline every available target, return the cards to the bottom of their decks and end your turn. You may choose again next turn.</p>"}, {"title": "2. Discover their location", "html": "<p>On the same turn, draw a <strong>purple bounty-location card</strong>. It names one of the eight cities where your target was sighted. Begin travelling there on your next turn.</p>"}, {"title": "3. Find out how long they stay", "html": "<p>When you arrive, roll the <strong>d10</strong>. Its result is the number of days the target remains. A 0 means they have already left: keep the target and revisit Little Birds for a new location.</p>"}, {"title": "4. Choose intel or attempts", "html": "<p>Each available day buys either <strong>one takedown attempt</strong> or <strong>one point of Intel</strong>. Each Intel point adds +1 to your takedown total for this stay. Leave at least one day to make an attempt.</p><p>These days represent activity within the city. All your attempts and Intel gathering happen within the <strong>same game turn</strong>.</p>"}, {"title": "5. Reveal their defence", "html": "<p>Press <strong>Reveal defence value</strong> to select the defending attribute and a value from 1–20 together. Low tier has six equally likely outcomes: Magic, Intelligence, Combat, Stealth, Cunning or the target’s highest attribute. High tier always uses the highest attribute.</p><p>Choose between tied highest attributes if needed. The attribute stays fixed throughout the target’s stay; later attempts reveal only a new defence value.</p>"}, {"title": "6. Make your physical attempt", "html": "<p>The target’s total is its revealed value plus its defending attribute. Your matching attribute and Intel reduce the physical d20 result you need. <strong>You must beat the target’s total; a tie fails.</strong></p><p>The assistant shows the exact minimum result, such as <strong>12+</strong>. Roll your physical d20 on the table, then press <strong>I succeeded</strong> or <strong>I failed</strong>. You do not need to enter the number.</p><p>A failed attempt uses one day. Try again or gather more Intel while days remain. If the stay ends, return both bounty cards.</p>"}, {"title": "7. Assassinate or blackmail", "html": "<p>After a success, <strong>assassinate</strong> to keep the Face and gain its attributes. Playing a held assassination weapon also unlocks its ability and consumes the weapon. Suspicion rises by 1 for low tier or 2 for high tier.</p><p>Alternatively, <strong>blackmail</strong> for one resource: roll a d10 for low tier or d20 for high tier and multiply by <strong>500</strong>. Return the target card after blackmail, and return the location card when the bounty ends.</p>"}]},
    weirwood:{"title": "Weirwood", "query": "3.8 Weirwood Tree", "pages": [{"title": "Draw a card", "html": "<p>When you land on a Weirwood space, draw one physical <strong>Weirwood card</strong> and read its instructions.</p>"}, {"title": "Resolve or keep it", "html": "<p>For an immediate card, choose its category and picture. Review the listed resource, bounty, prison or Item changes, carry out any physical movement, then confirm. For a Thief card, enter the amount actually taken and have the other player deduct it. Cards for later use go into your held inventory.</p>"}, {"title": "Use a held card", "html": "<p>Play a held card when its instructions allow. Carry out its effect and mark it used to remove it from your held cards.</p>"}]},
    'item-secrets':{title:'Secrets of the Hidden World',query:'8.1 Secrets of the Hidden World',pages:[
      {title:'Reach the Citadel',html:'<p>Travel to the <strong>Citadel Library</strong>. To enter the restricted section you must pass a memory challenge set by another player.</p>'},
      {title:'Build the word list',html:'<p>The player testing you uses your current Intelligence to determine the challenge length: <strong>30 − Intelligence</strong>, with a minimum of 5 words. They prepare that many single-syllable words and read them at roughly one per second.</p>'},
      {title:'Recall the words',html:'<p>You have <strong>one minute</strong> to recall every required word. Incorrect guesses are allowed, but every word on the list must eventually be recalled. If you fail, try again on a later turn with the same list.</p>'},
      {title:'Complete the Item',html:'<p>Once successful, take Secrets of the Hidden World. Its ability lets you choose which whirlpool you emerge from if you are sucked into one.</p>'}
    ]},
    'item-city':{title:'Fortress',query:'8.2 Fortress',pages:[
      {title:'Prepare the upgrade',html:'<p>Your Fortress is an upgrade to your existing Stronghold. You need <strong>15,000 Gold and 25,000 Stone</strong>.</p>'},
      {title:'Visit Bran the Builder',html:'<p>Travel to <strong>Bran the Builder</strong>, pay the cost and place the physical Fortress miniature over your Stronghold, with your coloured cube showing ownership.</p>'},
      {title:'Automatic checkpoints',html:'<p>Once the Fortress is built, every incomplete Item you currently carry — and every incomplete Item you obtain later — is automatically checkpointed.</p>'},
      {title:'If an Item is lost',html:'<p>An automatically checkpointed incomplete Item returns to your <strong>Fortress</strong> rather than its original acquisition location, making later quests substantially safer.</p>'}
    ]},
    'item-direwolf':{title:'Direwolf',query:'8.3 Direwolf',pages:[
      {title:'Approach the Direwolf',html:'<p>Travel to <strong>The Land of Always Winter</strong>. Your Cunning sets the base d20 target: 16+ up to Cunning 19, or 8+ at Cunning 20 or above.</p>'},
      {title:'Offer Food',html:'<p>Before rolling you may offer Food. Every <strong>1,000 Food adds +2</strong> to that attempt. The Food is spent whether you succeed or fail, and the bonus resets after the attempt.</p>'},
      {title:'Take the untamed Direwolf',html:'<p>A successful approach gives you the Direwolf Item, but its ability is not active yet. It travels with you while you build its trust.</p>'},
      {title:'Gain two different Bonds',html:'<p>Gain Bond Points from <strong>two different feats</strong>: defeat a Foe, complete a bounty takedown, establish Settlement influence, or successfully confront another player. The second different Bond fully tames the Direwolf, which then automatically defeats outer-board Foes.</p>'}
    ]},
    'item-gemstone':{title:'Gemstone',query:'8.4 Gemstone',pages:[
      {title:'Hire a salvage crew',html:'<p>At any Port, hire a salvage crew to find a Gemstone. An <strong>experienced crew</strong> finds one on a d20 result of 13 or higher and charges 300 resources for each travel turn and each search attempt. An <strong>inexperienced crew</strong> needs 18 or higher and charges 100 resources for each travel turn and search attempt. The return journey is charged too.</p>'},
      {title:'Travel to Dragon Island',html:'<p>Every turn the crew spends aboard counts towards the bill, including land movement, shipwrecked turns and the return journey to a Port.</p>'},
      {title:'Search a whirlpool',html:'<p>When positioned over a Dragon Island whirlpool, keep rolling the d20 in the same turn until you succeed. <strong>Every search roll</strong> also counts as one billing unit.</p>'},
      {title:'Keep or reject the Gemstone',html:'<p>After a successful search, <strong>randomly select a physical Gemstone</strong>. You may keep it or return it and resume searching on your next turn. The <strong>Maegi special ability</strong> lets you choose from the Gemstones remaining instead.</p>'},
      {title:'Return, pay and activate',html:'<p>Return the crew to any Port and pay the bill using any mix of resources. Any amount you cannot afford becomes crew debt. Finally, take the Gemstone to the <strong>Priestess from Asshai</strong> to activate its attribute bonus, unless an ability activates it immediately.</p>'}
    ]},
    'item-knights':{title:'Knights of the Vale',query:'8.5 Knights of the Vale',pages:[
      {title:'Reveal an escaped prisoner',html:'<p>An <strong>escaped prisoner</strong> red reward card from Settlement influence starts the quest. Put the turquoise prisoner cube on that Settlement.</p>'},
      {title:'First prisoner movement',html:'<p>Reveal the first movement in the assistant, then move the prisoner cube as shown. One of six directions and a distance of 1–20 tiles are selected at random.</p>'},
      {title:'Continue the chase',html:'<p>On each later prisoner turn, reveal a <strong>fresh movement</strong>. A new direction is selected; the distance is the sum of two independent 1–6 selections. Move the cube, then chase normally. Capture them by becoming adjacent while in the same terrain.</p>'},
      {title:'Safe and unsafe locations',html:'<p>If the prisoner enters your network or Stronghold, you capture them. If they enter a neutral Settlement, another player’s network or another player’s Stronghold, they escape and you must find another prisoner.</p>'},
      {title:'Return to the Sky Cell',html:'<p>Take a captured prisoner to the <strong>Sky Cell</strong>. House Arryn grants the Knights of the Vale, giving you one Stronghold Attack without Hired Blades or Food.</p>'}
    ]},
    'item-ironship':{title:'Iron Ship',query:'8.6 Iron Ship',pages:[
      {title:'Gather the cost',html:'<p>The Iron Ship costs <strong>15,000 Gold and 25,000 Wood</strong>. The Iron Price ability reduces both costs by 5,000.</p>'},
      {title:'Visit Euron’s Shipyard',html:'<p>Travel to <strong>Euron’s Shipyard</strong> on the outer board and pay the required resources to upgrade your existing boat.</p>'},
      {title:'Permanent protection',html:'<p>The Iron Ship is a permanent upgrade. Once obtained, storms no longer affect you.</p>'}
    ]},
    'item-sword':{title:'Valyrian Steel Sword',query:'8.7 Valyrian Steel Sword',pages:[
      {title:'Enter the Ancient Ruins',html:'<p>You must visit <strong>every ruins tile</strong> to find a dragon glass shard. Enter the ruins as you would cross from water onto land: stop on a bordering tile, then enter on your next turn.</p>'},
      {title:'Explore one turn at a time',html:'<p>Inside the ruins, movement uses <strong>one physical d6</strong>. You may revisit tiles during the same turn. Track the tiles you have visited on the physical board; revisits do not count as new tiles.</p><p>The Sword assistant resolves your movement and checks for the Stone Men each turn.</p>'},
      {title:'Beware the Stone Men',html:'<p>A <strong>5 or 6</strong> alerts the Stone Men, who give you Greyscale. At <strong>Stealth 15 or above</strong>, only a 6 alerts them.</p><p>Greyscale halves your travel distance, rounding up an odd result. Visit the <strong>Citadel Library</strong> to be cured. The Immunity special ability prevents Greyscale.</p>'},
      {title:'Obtain and carry dragon glass',html:'<p>After visiting every ruins tile, take a dragon glass shard. Carry it to Gendry’s Foundry. You may checkpoint it at your Stronghold; a Fortress does this automatically.</p>'},
      {title:'Forge and use the Sword',html:'<p>At <strong>Gendry’s Foundry</strong>, forge the shard into the Sword. The <strong>Forger special ability</strong> removes the journey to Gendry.</p><p>Once complete, the Sword lets you initiate confrontations from <strong>within 5 tiles</strong> of another player.</p>'}
    ]},
    'item-egg':{title:'Dragon Egg',query:'8.8 Dragon Egg',pages:[
      {title:'Unlock the final quest',html:'<p>You may only enter the Dragon’s Lair after completing all <strong>seven prerequisite Item quests</strong>, including upgrading your Stronghold into a Fortress.</p>'},
      {title:'Cross the surrounding whirlpool',html:'<p>Land on a whirlpool around Dragon Island and select <strong>Reveal whirlpool outcome</strong> in the Egg assistant. Safe passage lets you enter the volcanic island on your next turn; being pulled under ends your turn at another whirlpool.</p>'},
      {title:'Face the mother dragon',html:'<p>Your initial d20 attempt normally requires a natural 20. If it fails, each current attribute at level 30 or above gives one further attempt needing 13+.</p>'},
      {title:'Failure and another attempt',html:'<p>If all attempts fail, the mother dragon returns you to your Fortress and damages your ship. You may make the journey and try again later.</p>'},
      {title:'Carry the Egg to victory',html:'<p>The Egg cannot be checkpointed or secured. If dropped it returns to the Lair. Carry it to the <strong>Dragon Pit</strong> and hatch it to win.</p>'}
    ]},
    raid:{"title": "City Raid", "query": "3.2 Raid", "pages": [{"title": "Choose where to steal Gold", "html": "<p>A raid targets the nearest city. There are <strong>five areas</strong>, each requiring its <strong>own specific attribute</strong> to steal Gold. Choose the order, and attempt each area only once during a raid.</p>"}, {"title": "Temple · Magic", "html": "<p><strong>Magic</strong> lets you summon demonic visions into the priestesses’ minds. While they are distracted, slip into the temple treasury undetected and steal its Gold.</p>"}, {"title": "Repository · Intelligence", "html": "<p><strong>Intelligence</strong> helps you locate and disarm the traps protecting the royal repository hidden beneath the palace. Outwit those defences to reach the treasure.</p>"}, {"title": "Vault · Combat", "html": "<p><strong>Combat</strong> lets you incapacitate the guards protecting the city’s vault, clearing a path to the Gold inside.</p>"}, {"title": "Market · Stealth", "html": "<p><strong>Stealth</strong> lets you slip through the crowded markets unnoticed, pickpocketing local merchants as you pass.</p>"}, {"title": "Royal Bedchambers · Cunning", "html": "<p><strong>Cunning</strong> lets you impersonate a servant, walk past the royal sentries and steal the queen’s jewellery from her bedchambers.</p>"}, {"title": "Roll for the chosen area", "html": "<p>The required total is <strong>30 minus that area’s attribute</strong>, with a minimum of 10. Roll the <strong>d10 and d20 together</strong> and add their results. Meet or beat the requirement, then press <strong>Success</strong>; otherwise press <strong>Failure</strong>.</p>"}, {"title": "Leave or risk another area", "html": "<p>After each success, leave with your winnings or risk another unvisited area. Your winnings become increasingly larger as you successfully raid more areas.</p><p>If any attempt fails, the city guards force you to flee and you lose the entire unbanked haul. On your next turn, continue travelling; you cannot reattempt a raid on that turn.</p>"}]},
    confrontation:{title:'Confrontation',query:'6 Confronting Another Player',pages:[
      {title:'When you can confront',html:'<p>Confrontations take place on the inner board. Normally you must be adjacent; the Valyrian Steel Sword extends an initiating player’s range to within 5 tiles. A player inside their Stronghold or a Settlement in their network cannot be confronted.</p>'},
      {title:'Roll for success',html:'<p>Both players roll one physical d6. If the numbers match, the confrontation succeeds. Intimidation, Swordsman and Woman Warrior can give the initiating player another attempt.</p>'},
      {title:'Choose the consequence',html:'<p>A successful initiator may steal a Face, steal <strong>d6 × 1,000</strong> of one resource, or force one carried incomplete Item to be dropped.</p>'},
      {title:'Apply the cooldown',html:'<p>After a successful confrontation, the initiating player waits 5 turns before initiating another; the confronted player waits 1. After an unsuccessful confrontation, everyone involved waits 1 turn.</p>'}
    ]},
    strongholdAttack:{title:'Stronghold Attack',query:'5 Attacking Another Player’s Stronghold',pages:[
      {title:'Assemble Hired Blades',html:'<p>Normally you must be in your Stronghold to declare the attack. Your first Hired Blades cost 10,000 Food; each later group costs 5,000 more. The Knights of the Vale can provide one free attack.</p>'},
      {title:'Travel to the defender',html:'<p>After declaring the attack, travel to the defending Stronghold. If its owner returns before you reach an adjacent tile, the attack is called off and you leave empty-handed.</p>'},
      {title:'Infiltrate while they are away',html:'<p>If you arrive while the defender is absent, begin taking resources each turn. A lone attacker takes 500 of each resource; allied attackers who both arrive take 300 each. Continue until the defender returns or 15 of your turns pass.</p>'},
      {title:'Steal a secured Item',html:'<p>If 15 turns pass without the defender returning, choose an eligible secured Item without a duel. If they return earlier, both sides use the matching-d6 duel to determine whether the attacker can steal.</p>'},
      {title:'What can be stolen',html:'<p>You cannot steal the Fortress, Iron Ship or Dragon Egg, or an Item you already possess. A stolen Item is received <strong>completed and secured</strong>, with its benefit available immediately.</p>'}
    ]}
  };
  function openPagedGuide(key,index,firstUse){
    var g=PAGED_GUIDES[key];if(!g)return false;
    if(firstUse&&!tutorialSeen('paged-'+key))markTutorialSeen('paged-'+key);
    index=Math.max(0,Math.min(g.pages.length-1,num(index)));var page=g.pages[index];
    var dots=g.pages.map(function(_,i){return '<span class="walkthrough-dot '+(i===index?'active':'')+'"></span>';}).join('');
    var guideArt=key==='innerBoard'&&index===0?portPhoto(true,'Port on the outer board'):key==='innerBoard'&&index===1?componentReferenceHtml('player-piece','Your player piece','Move this piece across the physical board using the distance revealed by your movement die.'):key==='openingGame'&&index===0?componentReferenceHtml('resource-drop','Resource Drop cubes','Place these opaque red cubes on inner-board resource tiles.'):'';
    var finalButton=g.finalAction?'<button class="primary" data-modal-action="'+esc(g.finalAction)+'">'+esc(g.finalLabel)+'</button>':'<button class="primary" data-modal-close="1">Got it</button>';
    var controls='<div class="modal-actions">'+(index>0?'<button class="ghost" data-modal-action="paged-guide" data-guide-key="'+esc(key)+'" data-step="'+(index-1)+'">Back</button>':'<button class="ghost" data-modal-action="open-rule" data-query="'+esc(g.query)+'">Full rule</button>')+(index<g.pages.length-1?'<button class="primary" data-modal-action="paged-guide" data-guide-key="'+esc(key)+'" data-step="'+(index+1)+'">Next</button>':finalButton)+'</div>';
    openGuideModal(g.title+' · '+page.title,'<div class="walkthrough-shell"><div class="walkthrough-progress"><strong>'+(index+1)+' of '+g.pages.length+'</strong><div class="walkthrough-dots">'+dots+'</div></div>'+guideArt+'<div class="walkthrough-copy">'+page.html+'</div>'+controls+'</div>');
    return true;
  }
  function firstUseGuideKey(key){return 'paged-'+key;}
  function maybeOpenActivityGuide(key){
    if(PAGED_GUIDES[key]){if(tutorialSeen(firstUseGuideKey(key)))return false;markTutorialSeen(firstUseGuideKey(key));return openPagedGuide(key,0,false);}
    if(CONTEXT_TUTORIALS[key])return openContextTutorial(key,false);
    if(HELP[key]&&!tutorialSeen('help-'+key)){markTutorialSeen('help-'+key);openHelp(key);return true;}
    return false;
  }

  function tutorialSeen(key){return !!(state.tutorialsSeen&&state.tutorialsSeen[key]);}
  function markTutorialSeen(key){if(!state.tutorialsSeen)state.tutorialsSeen={};state.tutorialsSeen[key]=true;saveState();}
  function openContextTutorial(key,force){
    if(PAGED_GUIDES[key]){if(!force&&tutorialSeen(firstUseGuideKey(key)))return false;return openPagedGuide(key,0,!force);}
    var tip=CONTEXT_TUTORIALS[key];if(!tip)return false;
    if(!force&&tutorialSeen(key))return false;
    markTutorialSeen(key);
    openGuideModal(tip.title,guideImageHtml(tip.image,tip.title)+tip.html+'<div class="modal-actions"><button class="ghost" type="button" data-modal-action="open-rule" data-query="'+esc(tip.query)+'">Full rule</button><button class="primary" type="button" data-modal-close="1">Got it</button></div>');
    return true;
  }
  function maybeContextTutorial(key){return false;}
  function scheduleViewTutorial(){/* Context help is non-blocking. */}
  function inlineGuide(key,label){return '';}

  function openWalkthrough(index,firstRun){
    if(firstRun&&!state.walkthroughSeen){state.walkthroughSeen=true;state.guideSeen=true;saveState();}
    index=Math.max(0,Math.min(WALKTHROUGH.length-1,num(index)));

  function itemStatus(k){

    if(k==='gemstone'&&state.tools.crewBillDue!==null)return 'Crew bill pending · '+fmt(crewBillAmount());
    if(k==='gemstone'&&!i.completed&&!i.obtained&&state.tools.crewStage!=='choose')return 'Expedition in progress';
    if(k==='knights'&&!i.completed&&state.tools.knightsStage==='return')return 'Prisoner captured · return to Sky Cell';

    if(k==='direwolf'&&i.obtained&&!i.completed)return 'Taming · '+i.bonds.length+'/2 Bonds'+(i.checkpointed?' · checkpointed':'');
    if(k==='city'||k==='ironship')return i.completed?'Completed':(k==='city'?state.tools.cityArrived:state.tools.shipArrived)?'At upgrade location':'Not started';

function itemOwnedForWar(k){
  var s=state.items[k];if(!s)return false;
  if(k==='secrets'||k==='direwolf'||k==='gemstone')return !!(s.obtained||s.completed);
  if(k==='knights')return !!s.completed;
  if(k==='sword')return !!s.completed;
  return true;
}
function applyStolenItem(k){
  if(k==='secrets'){state.items.secrets.obtained=true;state.items.secrets.completed=true;state.items.secrets.checkpointed=true;}
  else if(k==='direwolf'){state.items.direwolf.obtained=true;state.items.direwolf.completed=true;state.items.direwolf.checkpointed=true;state.items.direwolf.bonds=['Stolen completed Item'];}
  else if(k==='gemstone'){state.items.gemstone.lost=false;state.items.gemstone.lostType='';state.items.gemstone.obtained=true;state.items.gemstone.completed=true;state.items.gemstone.checkpointed=true;state.items.gemstone.type=state.tools.warLootGemType||state.items.gemstone.type||'Protean';}
  else if(k==='knights'){state.items.knights.completed=true;state.items.knights.used=false;}
  else if(k==='sword'){state.items.sword.dragonGlass=true;state.items.sword.completed=true;}
}

  function findRuleSection(query){

  function formatRuleText(text){
    var lines=String(text||'').replace(/\r/g,'').split('\n'),html='',para=[],listOpen=false;
    function flushPara(){if(para.length){html+='<p>'+esc(para.join(' ').replace(/\s+/g,' ').trim())+'</p>';para=[];}}
    function closeList(){if(listOpen){html+='</ul>';listOpen=false;}}
    for(var i=0;i<lines.length;i++){
      var raw=lines[i],trim=raw.trim();
      if(!trim){flushPara();closeList();continue;}
      if(trim.charAt(0)==='•'){
        flushPara();if(!listOpen){html+='<ul>';listOpen=true;}html+='<li>'+esc(trim.replace(/^•\s*/,''))+'</li>';continue;
      }
      if(/^[A-Z][^.!?]{1,70}:$/.test(trim)){
        flushPara();closeList();html+='<h4>'+esc(trim)+'</h4>';continue;
      }
      if(/^\d\s*=/.test(trim)&&trim.length<100){flushPara();closeList();html+='<div class="rule-data-line">'+esc(trim)+'</div>';continue;}
      para.push(trim.replace(/-\s*$/,''));
    }
    flushPara();closeList();return html;
  }

  view.addEventListener('click',handleActivityClick);

  function handleActivityChange(e){
    beginUndoAction();var el=e.target;

    if(paymentResource&&RESOURCES.indexOf(paymentResource)>=0&&state.tools.crewBillDue!==null){var otherSelected=crewPaymentTotal()-crewPaymentFor(paymentResource);state.tools.crewPayment[paymentResource]=Math.min(Math.max(0,num(el.value)),Math.max(0,num(state.resources[paymentResource])),Math.max(0,crewBillAmount()-otherSelected));commit(false);render();return;}
    if(el.getAttribute('data-resource-input')){var key=el.getAttribute('data-resource-input'),oldVal=Math.max(0,num(state.resources[key])),newVal=Math.max(0,num(el.value));if(newVal>oldVal){applyResourceGain(key,newVal-oldVal);}else state.resources[key]=newVal;commit(false);el.value=state.resources[key];}

  view.addEventListener('change',handleActivityChange);
  activityBody.addEventListener('change',handleActivityChange);
  function handleActivityInput(e){

  view.addEventListener('toggle',function(e){

  modalBody.addEventListener('click',function(e){

    if(a==='defence-physical-select'){if(state.bounty.defenceReady||state.bounty.stage!=='defence')return;var dv=num(btn.getAttribute('data-value'));if(dv<1||dv>6)return;state.bounty.defenceRoll=dv;state.bounty.defenceReady=true;state.bounty.defenceAuto=false;state.bounty.defenceAttr='';closeModal();commit(false);render();return;}
    if(a==='bounty-d20-select'){if(btn.getAttribute('data-die')!=='player'&&npcRollLocked('bounty'))return;var dw=btn.getAttribute('data-die')==='player'?'player':'target',dv=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));if(dw==='player'){state.bounty.playerD20=dv;state.bounty.playerRollSet=true;}else{state.bounty.targetD20=dv;state.bounty.targetRollSet=true;state.bounty.targetRollAuto=false;}closeModal();commit(false);render();return;}
    if(a==='blackmail-d20-select'){state.bounty.blackmailRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.bounty.blackmailRollSet=true;closeModal();commit(false);render();return;}
    if(a==='inventory-weirwood-use'){useHeldWeirwood(btn.getAttribute('data-weirwood'));return;}
    if(a==='settlement-d20-select'){if(npcRollLocked('village'))return;state.tools.villageTargetRollAuto=false;state.tools.villageTargetRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.villageTargetRollSet=true;closeModal();commit(false);render();return;}
    if(a==='foe-d20-select'){if(npcRollLocked('foe'))return;state.tools.foeTargetRollAuto=false;state.tools.foeTargetRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.foeTargetRollSet=true;closeModal();commit(false);render();return;}
    if(a==='wolf-d20-select'){state.tools.wolfRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.wolfRollSet=true;closeModal();commit(false);render();return;}
    if(a==='crew-d20-select'){state.tools.crewSearchRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.crewSearchRollSet=true;closeModal();commit(false);render();return;}
    
    if(a==='dragon-initial-select'){state.tools.dragonInitialRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.dragonInitialRollSet=true;closeModal();commit(false);render();return;}

    if(a==='space-iron-bank-apply'){
      var il=hasAbility('Master of Coin')?2000:4000,ig=state.resources.gold,ip=ig<il,ia=Math.min(ig,il);state.resources.gold=Math.max(0,ig-il);

  }
