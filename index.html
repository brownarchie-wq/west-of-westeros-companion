    {
      "num": "3.10",
      "title": "Ports",
      "page": 6,
      "text": "Finally, there are four ports (one at each corner), which allow you to travel onto the inner map section of the board. You can move between the outer and inner sections as often as you wish. Once you have landed on a port, you must wait until your next turn, where you will roll and start counting from the water tile closest to your token."
    },
    {
      "num": "4",
      "title": "Navigating the Inner Section",
      "page": 7,
      "text": ""
    },
    {
      "num": "4.1",
      "title": "Movement",
      "page": 7,
      "text": "On water, you may choose to roll the 10-sided die, or the 20-sided die. The number rolled determines the strength of the wind that blows you (how many tiles you may move). You may move in any direction you wish, for as many tiles as you wish, from 1 up to the number on your die. However, if you roll either 19 or 20, a storm gathers. A single 6-sided die is then rolled to\ndetermine which direction you will be blown in by the storm, as follows:\n\n1 = North             2 = North-East        3 = South-East\n4 = South             5 = South-West        6 = North-West\n\nTo determine the number of tiles the storm blows you, you must roll either one or two dice. If a 19 was rolled, you roll one 6-sided die, and if a 20 was rolled, you roll two 6-sided dice. If you are blown to the edge of the map, you are reflected and continue being blown by the storm. However, if you meet land during a storm, you become shipwrecked. You then need to pay for boat repairs, which cost 2,000 gold. If you don’t have enough gold to pay for boat repairs, you must only use one 6-sided die when crossing water, until you can afford repairs. You also drop any incomplete items that you are carrying (see section 7.1 for dropping items).\n\nOn land, you roll the 20-sided die and, in a similar fashion to on water, you may move in any direction you wish, for as many tiles as you wish, from 1 up to the number of your die.\n\nTo travel from water onto land, or vice versa, you must stop on a water-to-land, or land-to-water, bordering tile. On the next turn, you roll the appropriate dice and start counting your move on the adjacent land or water tile."
    },
    {
      "num": "4.2",
      "title": "Forming your Stronghold",
      "page": 7,
      "text": "The first thing you may wish to do on the inner section of the board is establish your Stronghold. Your Stronghold acts as a hidden base of operations, containing safehouses, stores, trusted contacts and retainers. This is done by moving your piece to a land tile of your preference on the inner board. The tile must be within 15 tiles of the “Dragon’s Lair” tile at the centre of the map, and must be fully surrounded by land tiles (i.e. not on the coastline etc.). Your Stronghold is indicated by placing your coloured pawn on the map. Two players may not place their Strongholds within three tiles of each other.\n\nYour Stronghold provides safekeeping of your Items, which will be addressed in Section 7.1. You may only have one Stronghold for the entire game, so pick where to place it wisely."
    },
    {
      "num": "4.3",
      "title": "Settlements",
      "page": 7,
      "text": "Settlements across the West provide access to local supplies, contacts and information. To establish influence in a neutral Settlement, you must pay 500 gold to local agents and mercenaries who will help overcome any resistance. To determine whether you are successful, you and the Settlement\n\n(played by the player to your left, or by the player whose network the Settlement belongs to) need to roll dice. You roll a 10-sided die and add your Combat level to it. The Settlement rolls a 20-sided die and adds your Suspicion level. Whoever has the highest total number wins. If it is a tie, you fail to establish influence.\n\nYour Suspicion level increases as assassinations take place across Westeros, causing communities to become increasingly wary of strangers and strengthen their defences. Each time you assassinate a Low Tier character, your Suspicion increases by 1, and each time you assassinate a High Tier character, it increases by 2. Blackmail does not increase Suspicion, and Suspicion is not reduced if you later discard, trade or lose a Face.\n\nIf successful, randomly select your reward from the deck of 8 red reward cards. There are 6 resource cards and 2 escaped prisoner cards. Resource cards give you either 500 or 1,000 of each resource (except gold). More detail about escaped prisoner cards is given in Section 8.5. The Settlement also becomes part of your network; place one of your clear coloured cubes over it to represent your influence there. Settlements in your network increase the resources you earn when landing on resource spaces on the outer board (see Section 3.3). If unsuccessful, you may attempt to establish influence there again on your next turn.\n\nYou can also attempt to take over the influence of another player by entering a tile adjacent to a Settlement in their network. This costs 1,000 gold and is resolved in the same way using your current Suspicion level. If successful, replace their coloured cube with one of your own and the Settlement becomes part of your network instead. You can also choose between stealing 2,000 of each of their resources, or taking a red reward card if you are still looking for an escaped prisoner. If unsuccessful, you must wait at least five turns before attempting to take over that Settlement again."
    },
    {
      "num": "4.4",
      "title": "Shipwrecks",
      "page": 8,
      "text": "In coastal regions, there are shipwrecks that can be explored. If you land on a shipwreck tile, you can randomly select a card from the deck of 9 shipwreck cards (blue coloured card). There are 6 gold cards and 3 assassination weapon cards. Assassination weapon cards are explained in section 3.1."
    },
    {
      "num": "4.5",
      "title": "Whirlpools",
      "page": 8,
      "text": "If you land on a whirlpool, you must roll a single 6-sided die to determine the strength of the whirlpool’s suction. If you roll a 1, 2, 3, or 4, you safely travel over the whirlpool and continue moving the number of spaces left from your original roll.\n\nIf you roll a 5 or 6, you are pulled into the whirlpool, transporting you to another random whirlpool, where your turn ends. The whirlpool you emerge at is determined by rolling two 6-sided dice, counting around the map in a clockwise direction (excluding the whirlpools around Dragon Island at the centre of the map)."
    },
    {
      "num": "4.6",
      "title": "Ancient Ruins",
      "page": 8,
      "text": "The West is home to the ruins of an ancient city, reminiscent of Old Valyria. To enter this fallen city is the same as travelling from water onto land. However, once in the ruins, you can only roll one 6-sided die. Whilst moving through the ruins, you are allowed to revisit spaces on the same turn. Scattered amongst the ruins are shards of dragon glass, the material that is infused with steel to make Valyrian steel. You will need to acquire some dragon glass in order to make your Valyrian steel sword (one of the 8 items you need to collect to win). More detail about the Valyrian steel sword is given in Section 8.7.\n\nYou must make sure to travel slowly and quietly in this city, as it is home to more than just dragon glass. If you roll a 5 or 6, you travel too quickly and make too much noise, alerting a group of Stone Men. They attack you, giving you greyscale in the process. However, if your stealth attribute level is 15 or above, then you must roll a 6 to alert the Stone Men.\n\nIf you get greyscale, your travel distance is halved. If the movement roll is an odd number, the half is rounded up. To cure greyscale, you must visit the Citadel Library, where the maesters can treat you."
    },
    {
      "num": "4.7",
      "title": "Resource Drops",
      "page": 9,
      "text": "You can visit a resource drop by landing on an adjacent tile. To determine the amount of resources you gain from the drop, you must roll a 10-sided die. The number rolled is multiplied by 1,000 to dictate the amount of resources gained. The location of the cube determines which resource you\nobtain as follows:\n\nGold:                  Wood:                   Stone:                Food:        &\n\nOnce a resource drop has been explored, the cube is removed from the board."
    },
    {
      "num": "5",
      "title": "Attacking Another Player’s Stronghold",
      "page": 9,
      "text": "Before you can declare a Stronghold Attack against another player, you need to assemble a group of Hired Blades. These are temporary recruits brought together to infiltrate and attack another player’s Stronghold rather than a permanent army. Your first group of Hired Blades costs 10,000 food to provision. Whilst located in your Stronghold, you can verbally declare a Stronghold Attack against another player. You can declare Stronghold Attacks as many times as you wish during the game, but once an attack is over your Hired Blades disperse and another group must be assembled before declaring another. Each subsequent group costs an additional 5,000 food, as reliable recruits become harder to find and surviving fighters demand greater payment (e.g. the first group costs 10,000 food, the second costs 15,000 food, etc.).\n\nAfter declaring a Stronghold Attack, you must travel to the other player’s Stronghold. If the defending player returns to their Stronghold before you reach a tile adjacent to it, the attack is called off and you must leave empty handed.\n\nIf you reach a tile adjacent to their Stronghold whilst the defending player is absent, your Hired Blades begin infiltrating it and you take 500 of each of their resources per turn, starting on the turn that you arrive. This continues until the defending player returns to their Stronghold, or until 15 of your turns have elapsed. If the defending player does not return within 15 of your turns, you may steal one of their secured Items without needing to duel for it.\n\nIf the defending player arrives within those 15 turns, you then have the opportunity to duel them for one of their secured Items. This is done by both players rolling a 6-sided die. If you both roll the same number, you can steal a secured Item of your choosing. An Item may not be stolen if you already possess one of the same Item. You may not steal the City, the Iron Ship, or the Dragon Egg.\n\nIf an Item is stolen during a Stronghold Attack, the attacking player receives the Item in its completed state. The stolen Item is immediately secured at the attacking player’s Stronghold or City and its ability becomes available to them. The player who lost the Item no longer possesses or receives the benefits of that Item. They must return to the Item’s original acquisition location and complete its quest again before they can regain it. If another player has declared a Stronghold Attack against you, you may not declare one against another player until the current attack is over.\n\nYou may also form an allegiance with one other player, where both of you declare a Stronghold Attack against another player. In this situation, you must both be in your respective Strongholds at the same time to declare the attack. The same rules apply, except both attacking players must be adjacent to the defending Stronghold before any resources are taken.\n\nIf the defending player arrives whilst there is only one attacking player at their Stronghold, the late attacking player must leave empty handed, and the prompt attacking player continues to duel for an Item as normal.\n\nIf both attackers arrive before the defender, each attacking player receives 300 of each resource per turn. When duelling for an Item, each attacking player can attempt to steal an Item in the same manner as before; however, only one attacking player needs to win in order for both to steal an Item. If the duel is won, the player who arrived at the Stronghold first can pick the Item they take first."
    },
    {
      "num": "6",
      "title": "Confronting Another Player",
      "page": 10,
      "text": "It is possible to steal a Face or resources from another player if you confront them. Alternatively, you can make them drop one incomplete item that they are carrying.\n\nTo confront another player, you must land on the tile next to the person you wish to confront. This can only be done on the inner section of the board, either on land or at sea (but not if a player is in their stronghold or a settlement in their network). You then both roll one 6-sided die. To be successful, you must both roll the same number.\n\nIf you are successful, you can either steal a face of your choice from the other player, or steal an amount of resources from them. The amount of resources is determined by rolling a 6-sided die. Multiply the roll by 1000, and take that amount of one resource type from them.\n\nAlternatively, if they are carrying an incomplete item, you can make them drop it instead. The item returns to its checkpoint, or to its original acquisition location if it has never been checkpointed, as described in Section 7.1.\n\nIf the initiating player was successful in their confrontation, they must wait five turns before initiating another confrontation, whilst the confronted player must only wait one turn. All players involved in an unsuccessful confrontation must wait one turn before initiating another confrontation."
    },
    {
      "num": "7",
      "title": "Items",
      "page": 11,
      "text": "The items discussed throughout this rulebook are obtained and completed as described in Section 8. Some items require a separate activation stage after they have been obtained, whilst others do not. Where an item requires activation, its ability will not take effect until it has been activated. An item is considered completed once it has been activated, where activation is required, or once its acquisition quest has been completed for items that do not require a separate activation stage.\n\nThe companion app is used to track which items you have obtained, whether they have been checkpointed, whether they are currently being carried or secured, and whether they have been completed.\n\nThe City and Iron Ship are permanent upgrades rather than carried items and therefore do not follow the normal rules for carrying, checkpointing or dropping items. The Dragon Egg is also subject to its own special rules, as described in Section 8.8."
    },
    {
      "num": "7.1",
      "title": "General Item Rules",
      "page": 11,
      "text": "Carrying Items:\nWhen you first obtain an item that has not yet been completed, you carry it with you as you travel. Whilst carrying an incomplete item, it may be lost as a result of a shipwreck, confrontation, or another game effect that causes you to drop an item. You may carry any number of incomplete items at the same time.\n\nCheckpointing Items:\nOnce you have obtained an incomplete item, you may take it to your stronghold to establish a checkpoint before continuing its quest. Once an item has been checkpointed, you may collect it from your stronghold and continue carrying it towards any location required to complete or activate it.\n\nCheckpointing an item is optional. You may instead take an item directly towards its next quest or activation location without first visiting your stronghold. Doing so is quicker, but carries a greater risk if the item is subsequently lost.\n\nIf you lose an incomplete item that has previously been checkpointed, it returns to your stronghold. You must collect it from your stronghold before you can continue its quest. If you lose an incomplete item that has not previously been checkpointed, it returns to its original acquisition location and you must obtain it again before continuing its quest.\n\nOnce your stronghold has been upgraded into a City, the rules for checkpointing items change as described in Section 8.2.\n\nCompleting and Securing Items:\nOnce an item has been completed, it is automatically secured at your stronghold or City. You do not need to physically return to your stronghold after completing or activating an item. A secured item continues to provide its ability as normal. Securing an item represents the completion and safekeeping of that item for game purposes; it does not prevent any abilities associated with the item from continuing to affect your character.\n\nSecured items cannot normally be dropped through shipwrecks or confrontations. However, they remain vulnerable to being stolen during an attack on your stronghold, as described in Section 5.\n\nDropping Items:\nYou may be forced to drop an incomplete item that you are carrying if you are shipwrecked, successfully confronted by another player, or affected by another rule or ability that causes you to drop an item. If the dropped item has previously been checkpointed, it returns to your stronghold. If it has not previously been checkpointed, it returns to its original acquisition location and must be obtained again.\n\nCompleted items are secured and therefore cannot normally be dropped. The Dragon Egg is an exception to these rules. It cannot be checkpointed or secured and, if dropped, returns to the Dragon's Lair as described in Section 8.8."
    },
    {
      "num": "8",
      "title": "Quests to Obtain and Complete the Items",
      "page": 12,
      "text": ""
    },
    {
      "num": "8.1",
      "title": "Secrets of the Hidden World",
      "page": 12,
      "text": "You can take this book from the Citadel Library if you can prove to the maesters of the citadel that you are worthy of entering the restricted section of the library. To prove your merit, you must remember a list of single-syllable words set by the maesters. In this situation, the player to your left will take the role of the maesters, and will be responsible for setting the words for you to remember.\n\nTo determine the number of words you must remember, look at your intelligence level and minus this number from 30. The minimum number of words you need to remember is 5. The player responsible for setting your words must write them down and read them to you slowly, at roughly one word per second. You have 1 minute to recall the words once they have been read. All other players must remain silent during this minute.\n\nIf you fail to remember them all, you can try again on your next turn, with the same words being read to you again in the same order. If you leave the Citadel Library and return later with a higher\n\nintelligence level, the number of words you need to remember is reduced accordingly from the original list. When guessing, you are allowed to suggest incorrect words, but you need to recite all of your set words to succeed.\n\nOnce you have the book, you can learn about the mysterious forces responsible for whirlpools and can therefore navigate to a whirlpool of your choosing should you be sucked into one."
    },
    {
      "num": "8.2",
      "title": "City",
      "page": 13,
      "text": "To upgrade your stronghold into a City costs: 15,000 gold, and 25,000 stone. The upgrade is done by visiting Bran the Builder. Place the city item on the board, covering the 7 tiles around your stronghold, and place one of your transparent coloured cubes on top to signify that it is yours.\n\nOnce you have upgraded your stronghold into a City, all incomplete items you currently carry, and any subsequently obtained, become automatically checkpointed. You therefore no longer need to physically return to your City to establish a checkpoint. You may continue carrying the item towards its next quest or activation location, but if you lose it before completion, it will return to your City rather than its original location."
    },
    {
      "num": "8.3",
      "title": "Direwolf",
      "page": 13,
      "text": "To obtain a Direwolf, you must first visit The Land of Always Winter, where you will attempt to gain the trust of a wild Direwolf. Your Cunning level determines how easily you are able to approach the Direwolf. Refer to the table below to determine the roll required on the 20-sided die:\n\nPlayer Cunning Level      Up to 19             20 or above\n\nRequired Roll        16+                    8+\n\nBefore making your taming attempt, you may choose to offer the Direwolf food to improve your chances of success. For every 1,000 food you offer, add +2 to your taming roll. You must decide how much food to offer before rolling the die, and the food is spent regardless of whether your attempt is successful.\n\nAny bonus gained from offering food applies only to the taming attempt made on that turn. If you are unsuccessful, you may make another attempt on your next turn, but any previous food bonus is lost and you must offer additional food if you wish to receive another bonus.\n\nOnce you successfully approach the Direwolf, take the Direwolf item. However, the Direwolf is not yet fully tamed and its special ability does not take effect. You must first tame your Direwolf, by gaining two Bond Points. A Bond Point is gained by completing one of the following feats whilst\nthe untamed Direwolf is travelling with you:\n\n• Defeat a Foe on the outer section of the board.\n• Successfully complete a bounty take down.\n• Successfully establish influence in a Settlement.\n• Successfully confront another player.\n\nYour two Bond Points must be gained from two different feats. For example, defeating two different Foes would only provide one Bond Point, whereas defeating a Foe and successfully confronting another player would provide two.\n\nOnce you have gained your second Bond Point, the Direwolf becomes fully tamed and its ability is immediately activated. Your Direwolf becomes your travelling companion, protecting you from enemies on the road. If you encounter a Foe space on the outer section of the board, the Foe is automatically defeated by your Direwolf and you can continue unscathed."
    },
    {
      "num": "8.4",
      "title": "Gemstone",
      "page": 14,
      "text": "There are 6 different types of gemstones: five of them embody each of the five attributes (these gemstones increase the associated attribute by 10 levels), and there is one protean gemstone (which equally increases all attributes by 2 levels). The colours of each gemstone are as follows:\n\n• Magic:             Pink\n• Intelligence:      Blue\n• Combat:            Red\n• Stealth:           Black\n• Cunning:           Green\n• Protean:           Clear\n\nTo obtain a gemstone, you must hire a salvage crew who will retrieve it for you. You can hire a crew from any of the ports around the outer board. Once you have assembled your crew, you must sail them to the whirlpools around Dragon Island, where they will retrieve your gemstone.\n\nYou pay your crew for the amount of time they spend aboard your ship, so the longer you take, the more expensive the venture. Whilst sailing with a crew, keep a tally of the number of turns you spend with them on board. This includes the turns spent moving over land, or when shipwrecked, and also the turns spent returning them to one of the ports on the outer board once you have got your gemstone. You can use this tally to determine what you owe them at the end of your voyage. You pay your crew with resources of your choosing, so long as the total matches the price they charge.\n\nSalvage crews have varying degrees of experience, and the better ones will demand a higher price. To recover a gemstone, you must roll the 20-sided die above a certain number, and this number is determined by the experience level of your crew.\n\nExperienced Crew   Cost = 300 resources per turn   Required roll = 13+\n\nInexperienced Crew     Cost = 100 resources per turn   Required roll = 18+\n\nOnce you are positioned over one of the whirlpools, you may continue to roll the 20-sided die until you find a gemstone (i.e. keep rolling all in one turn). Remember to count how many rolls it takes you to recover a gemstone, as this will be added to the number of turns you have taken.\n\nOnce you roll the required number or higher, you can then randomly select one of the gemstones. If you do not wish to keep your selected gemstone, you may return it to the whirlpool and continue to search for the gemstone you desire on your next turn.\n\nThe gemstone is activated by visiting the Priestess from Asshai, who will enchant it. Only once it has been activated will the associated attribute(s) be added to your total."
    },
    {
      "num": "8.5",
      "title": "Knights of the Vale",
      "page": 15,
      "text": "To gain the allegiance of the Knights of the Vale, you must return a high value prisoner to House Arryn. These escaped prisoners are hiding out in Settlements on the inner map. To flush one out, you must successfully establish influence in a Settlement and withdraw an escaped prisoner card. This triggers the prisoner to break from cover and attempt to run away. You must give chase to catch them.\n\nTo start, place one of the transparent turquoise cubes on the settlement where you found the escaped prisoner. The direction that the prisoner runs is determined by rolling the 6-sided die, in the same manner as with a storm. On the first turn, you roll the 20-sided die and count out the number of spaces that they travel in the specified direction. You then travel as normal to try and catch them. On subsequent turns, you again determine the direction they travel, then roll two 6-sided dice to determine how far they travel. You must chase them down and land on a tile next to them (whilst in the same terrain as them) in order to apprehend them. Note that the escaped prisoner can travel directly from water to land and vice versa without waiting. If the prisoner enters a neutral Settlement, a Settlement in another player’s network, or another player’s Stronghold, you lose them and need to find another escaped prisoner. If they enter a Settlement in your network or your Stronghold, you capture them. The escaped prisoner is unaffected by all other special-tile effects (e.g. whirlpools, ruins, etc.).\n\nOnce you catch your prisoner, you take the transparent turquoise cube. You must return it to House Arryn by visiting the Sky Cell space on the outer board. As a thank you for returning the prisoner, Lady Arryn pledges her Knights of the Vale to you, and so you receive the horse item. Once you have the Knights of the Vale on your side, you may call on them to carry out one Stronghold Attack against another player as described in Section 5. You do not need to assemble Hired Blades for this attack and it does not cost you any food."
    },
    {
      "num": "8.6",
      "title": "Iron Ship",
      "page": 15,
      "text": "Upgrading your boat into an Iron Ship costs 15,000 gold and 25,000 wood. This upgrade is done by visiting the Euron’s Shipyard on the outer section of the board. Once you have obtained your Iron Ship item, you will be unaffected by storms."
    },
    {
      "num": "8.7",
      "title": "Valyrian Steel Sword",
      "page": 15,
      "text": "You must first obtain some dragon glass to infuse into your blade. To obtain a dragon glass shard, you must visit every tile in the ancient ruins. Remember, travelling too quickly in the ancient ruins will alert the stone men who will give you greyscale.\n\nOnce obtained, the shard is taken to Gendry’s Foundry, where he forges it into a Valyrian steel sword, earning you the Valyrian steel sword item. Once you have your Valyrian steel sword, you only need to be within 5 tiles of another player before you can confront them."
    },
    {
      "num": "8.8",
      "title": "Dragon Egg",
      "page": 15,
      "text": "The rarest and most difficult item to obtain is the dragon egg. There is only one dragon egg available, so once a player has stolen the egg, it is advisable that the other players try and confront them. Once you hatch your dragon egg you will become the dominant force in the west, and you win the game.\n\nThe dragon’s lair is located on a volcanic island at the centre of the map. To enter the Dragon's Lair, you must have completed all seven other item quests, including upgrading your Stronghold into a City. You must pass the whirlpools that surround the island by landing on one of them and rolling a 1, 2, 3, or 4 on the 6-sided die.\n\nOnce successfully past the whirlpools, travelling onto the volcanic island takes one turn. Now you are on the island, you must try and obtain the egg. To do this, you must pass the mother dragon. Once you are facing the dragon, you have one initial attempt to steal the egg. For this attempt, you must roll a 20 on the 20-sided die. If you are unsuccessful on this attempt, you may have one more attempt per attribute that is level 30 or above. For each of these attempts, you only need to roll a 13 or above to defeat the dragon. If you are still unsuccessful after all subsequent attempts, the mother dragon picks you up and flies you back to your city, from which you can embark on your journey to face the dragon once again. However, your ship is damaged in the process, requiring you to make repairs.\n\nOnce you have successfully stolen the egg, your final action will be to hatch it in the Dragon Pit on the outer board. The Egg cannot be checkpointed or secured at your City and, if dropped, returns to the Dragon's Lair.\n\nOnce you have hatched your egg, you are the winner of the game, and the ruler of the West."
    }

  function summariseHistoryChange(before,after){
    var parts=[],a,r;
    if(before.playerName!==after.playerName)parts.push('Player name changed to '+after.playerName);
    if(before.setupComplete!==after.setupComplete&&after.setupComplete)parts.push('Starting attributes confirmed');
    for(a=0;a<ATTRS.length;a++){var ak=ATTRS[a];if(before.baseAttributes[ak]!==after.baseAttributes[ak])parts.push(ATTR_LABEL[ak]+' start '+before.baseAttributes[ak]+' → '+after.baseAttributes[ak]);if(before.manualModifiers[ak]!==after.manualModifiers[ak])parts.push(ATTR_LABEL[ak]+' adjustment '+before.manualModifiers[ak]+' → '+after.manualModifiers[ak]);}
    for(r=0;r<RESOURCES.length;r++){var rk=RESOURCES[r];if(before.resources[rk]!==after.resources[rk])parts.push(RES_LABEL[rk]+' '+fmt(before.resources[rk])+' → '+fmt(after.resources[rk]));}
    if(before.inventory.assassinationWeapons!==after.inventory.assassinationWeapons)parts.push('Assassination weapons '+before.inventory.assassinationWeapons+' → '+after.inventory.assassinationWeapons);
    if(before.faces.length!==after.faces.length){if(after.faces.length>before.faces.length)parts.push('Face added: '+after.faces[after.faces.length-1].name);else parts.push('Face removed');}
    else if(!sameValue(before.faces,after.faces))parts.push('Face/ability state changed');
    if(!sameValue(before.items,after.items))parts.push('Item progress changed');
    if(!sameValue(before.statuses,after.statuses))parts.push('Condition/cooldown changed');
    if(before.suspicion!==after.suspicion)parts.push('Suspicion '+before.suspicion+' → '+after.suspicion);
    if(before.settlementFormed!==after.settlementFormed)parts.push(after.settlementFormed?'Stronghold established':'Stronghold removed');
    if(before.villages!==after.villages)parts.push('Settlements in network '+before.villages+' → '+after.villages);
    if(before.warCount!==after.warCount)parts.push('Stronghold Attacks declared '+before.warCount+' → '+after.warCount);
    if(before.siegeTurns!==after.siegeTurns)parts.push('Stronghold Attack turns '+before.siegeTurns+' → '+after.siegeTurns);
    if(!sameValue(before.weirwoodHeld,after.weirwoodHeld))parts.push('Held Weirwood cards changed');
    if(!sameValue(before.bounty,after.bounty))parts.push(after.bounty.target?'Bounty: '+after.bounty.target+(after.bounty.location?' at '+after.bounty.location:''):'Bounty cleared');
    if(!parts.length)return '';
    return parts.slice(0,4).join(' · ')+(parts.length>4?' · +'+(parts.length-4)+' more change'+(parts.length-4===1?'':'s'):'');
  }

  var CONTEXT_TUTORIALS = {

    items:{title:'Item quests',query:'7.1 General Item Rules',image:'tip-items',html:'<p class="context-guide-copy">You do not need to memorise every Item quest. Open the Item you are pursuing and follow its next available action. In general, an incomplete Item may be <strong>carried</strong>, optionally <strong>checkpointed</strong> at your Stronghold, then becomes <strong>secured</strong> automatically when completed. City, Iron Ship and Dragon Egg have their own exceptions.</p>'},
    stronghold:{title:'Your Stronghold',query:'4.2 Forming your Stronghold',image:'tip-stronghold',html:'<p class="context-guide-copy">Your Stronghold is your hidden base on the inner board. You may establish only one. It provides safekeeping for Items, can be used to checkpoint incomplete Items, counts as one network location for Resource Space payouts, and is the normal place from which Stronghold Attacks are declared.</p>'},

    shipwreck:{title:'Shipwrecks',query:'4.4 Shipwrecks',image:'tip-shipwreck',html:'<p class="context-guide-copy">Draw from the physical shipwreck deck, then record what you found. Gold is added from the amount printed on the card. Assassination weapons are kept in your inventory until used on a successful assassination.</p>'},
    foe:{title:'Foe encounters',query:'3.4 Foes',image:'tip-foe',html:'<p class="context-guide-copy">Choose the Foe shown on the board. The assistant displays the relevant attribute, then you roll a d10 and the Foe rolls a d20. You must beat the Foe total; a tie means you are injured and miss your next turn.</p>'},
    confrontation:{title:'Confronting another player',query:'6 Confronting Another Player',image:'tip-confrontation',html:'<p class="context-guide-copy">Choose whether you are initiating the confrontation or responding to one. Both players roll a d6 and matching numbers mean success. If you initiate successfully, choose a Face, resources, or a carried incomplete Item as the outcome. The assistant records your cooldown.</p>'},
    strongholdAttack:{title:'Stronghold Attacks',query:'5 Attacking Another Player’s Stronghold',image:'tip-stronghold-attack',html:'<p class="context-guide-copy">A normal Stronghold Attack starts by assembling Hired Blades. Travel to the defending Stronghold. Once adjacent while the defender is away, take resources each turn and track up to 15 turns. If the defender returns, duel for a secured Item; if they stay away for all 15 turns, an eligible secured Item can be taken without the duel.</p>'},

    gemstone:{title:'Gemstone quest',query:'8.4 Gemstone',image:'tip-gemstone',html:'<p class="context-guide-copy">Hire a salvage crew at a port, count every travel turn and search roll while they are with you, recover a Gemstone at a Dragon Island whirlpool, return the crew to a port, then activate the Gemstone at the Priestess from Asshai unless an ability says otherwise.</p>'},

  },true);

  modalBody.addEventListener('change',function(e){
    if(e.target.id==='faceCharacter'){var pv=document.getElementById('facePickerPreview');if(pv)pv.innerHTML=facePreviewHtml(e.target.value);}
    if(e.target.id==='imagePackFileModal'&&e.target.files&&e.target.files[0]){e.target.setAttribute('data-file-ready','1');}
  });

  modalBody.addEventListener('input',function(e){
    if(e.target&&e.target.id==='startPlayerName')updateStartAttrModal();
  });

  modalBody.addEventListener('click',function(e){
    var btn=e.target.closest?e.target.closest('button'):null;if(!btn)return;var a=btn.getAttribute('data-modal-action');

    if(a==='ability-peace-confirm'){var pfid=modal.getAttribute('data-ability-face'),pf=findFace(pfid),pc=Math.max(1,Math.min(2,num(btn.getAttribute('data-count')))),pamt=2000*pc,pcost={gold:pamt,wood:pamt,stone:pamt,food:pamt};if(!pf||pf.abilityUsed){closeModal();return;}if(!canPay(pcost)){toast('You need '+fmt(pamt)+' of every resource for '+pc+' attacker'+(pc===1?'':'s')+'.','bad');return;}pay(pcost);pf.abilityUsed=true;modal.removeAttribute('data-ability-face');closeModal();commit(true,pf.abilityName+' ended a Stronghold Attack: '+fmt(pamt)+' of each resource paid.');toast(pf.abilityName+' used. '+fmt(pamt)+' of each resource deducted; the Stronghold Attack ends.','good');return;}
    if(a==='ability-crown-confirm'){var afid=modal.getAttribute('data-ability-face'),af=findFace(afid);if(af){state.faces=state.faces.filter(function(x){return x.id!==afid;});state.resources.gold+=5000;}modal.removeAttribute('data-ability-face');closeModal();commit();toast('Face sacrificed. +5,000 Gold.','good');return;}
    if(a==='ability-moon-confirm'){var mfid=modal.getAttribute('data-ability-face'),mf=findFace(mfid);if(mf){state.faces=state.faces.filter(function(x){return x.id!==mfid;});ATTRS.forEach(function(x){state.manualModifiers[x]-=3;});}modal.removeAttribute('data-ability-face');closeModal();commit();toast('The Moon Door used. Face removed and −3 applied to every attribute.','warn');return;}
    if(a==='ability-terrain-confirm'){var tf=findFace(btn.getAttribute('data-id')),count=Math.max(0,num((document.getElementById('terrainCount')||{}).value)),res=btn.getAttribute('data-resource'),each=num(btn.getAttribute('data-each'));if(tf&&!tf.abilityUsed){state.resources[res]+=count*each;tf.abilityUsed=true;}closeModal();commit();toast('Ability reward applied: +'+fmt(count*each)+' '+RES_LABEL[res]+'.','good');return;}

    if(a==='bounty-d20-select'){var dw=btn.getAttribute('data-die')==='player'?'player':'target',dv=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));if(dw==='player'){state.bounty.playerD20=dv;state.bounty.playerRollSet=true;}else{state.bounty.targetD20=dv;state.bounty.targetRollSet=true;}closeModal();commit(false);render();return;}
    if(a==='blackmail-d20-select'){state.bounty.blackmailRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.bounty.blackmailRollSet=true;closeModal();commit(false);render();return;}
    if(a==='settlement-d20-select'){state.tools.villageTargetRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.villageTargetRollSet=true;closeModal();commit(false);render();return;}
    if(a==='foe-d20-select'){state.tools.foeTargetRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.foeTargetRollSet=true;closeModal();commit(false);render();return;}
    if(a==='wolf-d20-select'){state.tools.wolfRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.wolfRollSet=true;closeModal();commit(false);render();return;}
    if(a==='crew-d20-select'){state.tools.crewSearchRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.crewSearchRollSet=true;closeModal();commit(false);render();return;}
    if(a==='knights-d20-select'){state.tools.knightsDistance=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.knightsDistanceSet=true;closeModal();commit(false);render();return;}
    if(a==='dragon-initial-select'){state.tools.dragonInitialRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.dragonInitialRollSet=true;closeModal();commit(false);render();return;}
    if(a==='dragon-extra-select'){state.tools.dragonExtraRoll=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));state.tools.dragonExtraRollSet=true;closeModal();commit(false);render();return;}
    if(a==='dragon-revive-select'){var rv=Math.max(1,Math.min(20,num(btn.getAttribute('data-value'))));closeModal();if(rv===20){state.items.egg.obtained=true;state.items.egg.hatched=false;state.tools.dragonStage='obtained';commit(true,'Dragon Egg obtained using Revive.');toast('Natural 20. Dragon Egg obtained.','good');}else{commit(false);render();toast('Revive roll failed. Continue with any remaining 13+ attribute attempts.','warn');}return;}
    if(a==='space-citadel-cure'){var ccond=btn.getAttribute('data-condition');if(ccond==='greyscale'||ccond==='poison'){state.statuses[ccond]=false;closeModal();commit(true,(ccond==='greyscale'?'Greyscale':'Poison')+' cured at the Citadel Library.');toast('Condition cured at the Citadel Library.','good');}return;}
    if(a==='space-citadel-secrets'){closeModal();setView('tools');jumpToAnchor('secretsTool');return;}
    if(a==='space-iron-bank-apply'){
      var il=hasAbility('Master of Coin')?2000:4000,ig=state.resources.gold,ip=ig<il,ia=Math.min(ig,il);state.resources.gold=Math.max(0,ig-il);
      if(ip){state.statuses.inPrison=true;state.statuses.prisonAttempts=0;state.tools.prisonStage='choose';}
      closeModal();commit(true,'Iron Bank Tax applied: −'+fmt(ia)+' Gold'+(ip?' and sent to prison':'')+'.');
      if(ip){setView('tools');jumpToAnchor('prisonTool');toast('Sent to Castle Black prison.','warn');}else toast('Iron Bank Tax applied.','warn');return;
    }
    if(a==='space-brotherhood-apply'){
      var bp=state.resources.wood<1500||state.resources.stone<1500||state.resources.food<1500;
      ['wood','stone','food'].forEach(function(r){state.resources[r]=Math.max(0,state.resources[r]-1500);});
      if(bp){state.statuses.inPrison=true;state.statuses.prisonAttempts=0;state.tools.prisonStage='choose';}
      closeModal();commit(true,'Brotherhood Without Banners loss applied'+(bp?' and sent to prison':'')+'.');
      if(bp){setView('tools');jumpToAnchor('prisonTool');toast('Sent to Castle Black prison.','warn');}else toast('Brotherhood losses applied.','warn');return;
    }
    if(a==='space-route'){routeFromSpace(btn.getAttribute('data-space'));return;}
    if(a==='space-open-sword'){closeModal();setView('items');return;}
    if(a==='walkthrough-start'){openWalkthrough(0,false);return;}
    if(a==='walkthrough-next'||a==='walkthrough-back'){openWalkthrough(num(btn.getAttribute('data-step')),false);return;}
    if(a==='walkthrough-skip'||a==='walkthrough-finish'){finishWalkthrough();return;}
    if(a==='bounty-gather-after-fail'){if(bountyDaysRemaining()>1){state.bounty.intel++;state.bounty.stage='roll';state.bounty.targetD20=1;state.bounty.targetRollSet=false;state.bounty.playerD20=1;state.bounty.playerRollSet=false;state.bounty.lastResult='';closeModal();commit(false);render();toast('One day spent gathering intel. Bonus is now +'+state.bounty.intel+'. The target keeps the same defending attribute.','neutral');}return;}
    if(a==='bounty-attempt-again'){state.bounty.stage='roll';state.bounty.targetD20=1;state.bounty.targetRollSet=false;state.bounty.playerD20=1;state.bounty.playerRollSet=false;state.bounty.lastResult='';closeModal();commit(false);render();return;}
    if(a==='tutorial-open'){openContextTutorial(btn.getAttribute('data-tutorial-key'),true);return;}
    if(a==='tutorial-reset'){state.tutorialsSeen={};saveState();closeModal();toast('Guide banners will be available again.','neutral');return;}
    if(a==='manage-artwork'){openArtworkManager(false);return;}
    if(a==='image-pack-skip'){dismissArtworkPrompt();closeModal();return;}
    if(a==='image-pack-import-modal'){var aip=document.getElementById('imagePackFileModal');if(aip&&aip.files&&aip.files[0])importImagePack(aip.files[0],true);else toast('Choose the private image-pack JSON file first.','warn');return;}
    if(a==='image-pack-remove-modal'){try{localStorage.removeItem(IMAGE_PACK_KEY);}catch(e){}imagePack=null;dismissArtworkPrompt();closeModal();render();toast('Character portraits removed from this device.','neutral');return;}
    if(a==='save-player'){state.playerName=document.getElementById('playerNameEdit').value.trim()||'Player';closeModal();commit();return;}
    if(a==='mod-inc'||a==='mod-dec'){var ma=btn.getAttribute('data-attr'),md=a==='mod-inc'?1:-1;if(!manualModifierDraft){manualModifierDraft={};ATTRS.forEach(function(x){manualModifierDraft[x]=num(state.manualModifiers[x]);});}manualModifierDraft[ma]+=md;var mel=document.getElementById('mod-'+ma);if(mel)mel.textContent=manualModifierDraft[ma];return;}
    if(a==='mod-apply'){if(!manualModifierDraft)return;ATTRS.forEach(function(x){state.manualModifiers[x]=num(manualModifierDraft[x]);});manualModifierDraft=null;closeModal();commit(true,'Attribute adjustments applied: '+ATTRS.map(function(x){return ATTR_LABEL[x]+' '+state.manualModifiers[x];}).join(', '));toast('Attribute adjustments applied.','good');return;}
    if(a==='change-starting-allocation'){manualModifierDraft=null;openStartingAttributes();return;}
    if(a==='start-attr-inc'||a==='start-attr-dec'){var sa=btn.getAttribute('data-attr'),sd=a==='start-attr-inc'?1:-1;if(sd>0&&startAttrTotal()<15)startingAttrDraft[sa]++;if(sd<0&&startingAttrDraft[sa]>0)startingAttrDraft[sa]--;updateStartAttrModal();return;}
    if(a==='start-attr-confirm'){var setupName=(document.getElementById('startPlayerName')||{}).value||'';setupName=setupName.trim();if(!setupName){toast('Enter your player name.','bad');return;}if(startAttrTotal()!==15){toast('Use exactly 15 starting attribute points.','bad');return;}state.playerName=setupName;ATTRS.forEach(function(x){state.baseAttributes[x]=num(startingAttrDraft[x]);});state.setupComplete=true;startingAttrDraft=null;closeModal();commit(true,'Character setup confirmed for '+state.playerName+': '+ATTRS.map(function(x){return ATTR_LABEL[x]+' '+state.baseAttributes[x];}).join(', '));toast('Character setup saved.','good');setTimeout(function(){openWalkthrough(0,true);},120);return;}
    if(a==='save-face'){saveFaceFromModal();return;}
    if(a==='reset-save-confirm'){try{localStorage.removeItem(SAVE_KEY);LEGACY_SAVE_KEYS.forEach(function(k){localStorage.removeItem(k);});}catch(e){}state=defaultState();lastHistorySnapshot=historySnapshot(state);closeModal();saveState();render();toast('Game reset. Set up your character to begin.','neutral');return;}
    if(a==='delete-face-confirm'){var did=modal.getAttribute('data-face-delete');state.faces=state.faces.filter(function(x){return x.id!==did;});modal.removeAttribute('data-face-delete');closeModal();commit();toast('Face removed. Attribute totals updated.','neutral');return;}
    if(a==='open-rule'){var q=btn.getAttribute('data-query')||'';closeModal();currentView='rules';rulesMode='rules';rulesDisplay='contents';setView('rules');var search=document.getElementById('ruleSearch');if(search){search.value=q;updateRulesContent(q);}return;}
  });

  function exportSave(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='west-of-westeros-'+state.playerName.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'-save.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  }
  function importSave(file){
    var reader=new FileReader();reader.onload=function(){try{state=normaliseState(deepMerge(defaultState(),JSON.parse(reader.result)));lastHistorySnapshot=historySnapshot(state);saveState();render();toast('Save imported.','good');}catch(e){toast('That save file could not be read.','bad');}};reader.readAsText(file);
  }

  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstallPrompt=e;if(installBtn)installBtn.classList.remove('hidden');});
  if(installBtn)installBtn.addEventListener('click',function(){if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.then(function(){deferredInstallPrompt=null;installBtn.classList.add('hidden');});});
  window.addEventListener('appinstalled',function(){if(installBtn)installBtn.classList.add('hidden');});
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}

  try{render();if(!state.setupComplete){setTimeout(function(){if(modal.classList.contains('hidden'))openStartingAttributes();},120);}else if(!state.walkthroughSeen){setTimeout(function(){if(modal.classList.contains('hidden'))openWalkthrough(0,true);},120);}else if(!imagePack&&!artworkPromptDismissed()){setTimeout(function(){if(modal.classList.contains('hidden'))openArtworkManager(true);},120);}}catch(err){view.innerHTML='<section class="card"><h2>App loading error</h2><p class="muted small">The interface could not start in this browser. Try opening the hosted version in Safari/Chrome rather than an in-app file preview.</p><pre class="error-box">'+esc(err&&err.message?err.message:String(err))+'</pre></section>';}
})();

  
</script>
</body>
</html>
